<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Homework Checklist</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1b2333; --muted:#5b6577; --accent:#1a73e8; --bad:#c5221f; --line:#dde2ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11151c; --card:#1b212b; --text:#e8ecf3; --muted:#9aa4b5; --accent:#8ab4f8; --bad:#f28b82; --line:#2c3442; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
    font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; width:100%; max-width:340px; text-align:center; }
  h1 { font-size:1.35rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 18px; }
  input { width:100%; font:inherit; font-size:1.6rem; letter-spacing:.5em; text-align:center; padding:12px; border:2px solid var(--line);
    border-radius:12px; background:var(--bg); color:var(--text); }
  input:focus { outline:none; border-color:var(--accent); }
  button { margin-top:14px; width:100%; font:inherit; font-weight:700; padding:13px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#11151c; } }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--bad); min-height:1.4em; margin:12px 0 0; }
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>Homework Checklist</h1>
  <p>Enter your PIN</p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autofocus aria-label="PIN">
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>
