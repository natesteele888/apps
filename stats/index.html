<!DOCTYPE html>
<html lang="en">
<head>
<!-- Copyright (c) 2026 Nate Steele. All rights reserved. Not licensed for copying, hosting or resale. See LICENSE. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Stats: LYBS stats on a watch</title>
<meta name="description" content="Sends one player's LYBS stats, season by season, to the My Stats app on a Wear OS watch. Signs in to the LYBS Dashboard; no stats are kept in this page.">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/apps/icons/stats-192.png">
<link rel="apple-touch-icon" href="/apps/icons/stats-192.png">
<script src="https://natesteele888.github.io/apps/install.js" defer></script>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --line: #334155; --text: #f1f5f9; --muted: #94a3b8; --gold: #f59e0b; --blue: #60a5fa; --red: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 1.6em; margin: 8px 0 2px; } h1 span { color: var(--gold); }
  h2 { font-size: 1.05em; margin: 0 0 8px; color: var(--blue); }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 11px 16px; background: var(--line); color: var(--text); cursor: pointer; }
  .btn.pri { background: var(--gold); color: #111827; }
  .btn:disabled { opacity: .5; }
  input[type=search], input.wl-code { font: inherit; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #0b1222; color: var(--text); }
  input.wl-code { width: 9.5em; }
  .pick { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .pick button { text-align: left; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); font-size: .92em; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .msg { margin: 10px 0 0; } .msg.err { color: var(--red); } .msg.ok { color: #4ade80; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>My <span>Stats</span></h1>
  <p class="sub">LYBS stats, season by season, on a Wear OS watch.</p>
  <section class="card" id="signin"></section>
  <section class="card" id="watch" hidden><h2>⌚ The watch</h2><div id="wl"></div></section>
  <section class="card" id="player" hidden></section>
  <section class="card" id="send" hidden></section>
  <p class="muted">Only the year, the level and the numbers go to the watch. No name, team or coach, and nothing is kept on this page.</p>
</main>
<noscript><p style="padding:24px">My Stats needs JavaScript turned on to work.</p></noscript>
<script src="../watchlink.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
