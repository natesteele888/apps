<title>Scoreboard: A Scoreboard for Any Gym or Field</title>
<meta name="description" content="Prop up a phone or tablet and run a scoreboard people can read from the bleachers. Basketball, baseball and softball, football, or just keep score. Everything stays on your phone.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="/apps/icons/scoreboard-192.png">
<link rel="apple-touch-icon" href="/apps/icons/scoreboard-192.png">
<script src="https://natesteele888.github.io/apps/install.js" defer></script><script src="https://natesteele888.github.io/apps/health.js" defer></script>

<div id="toasts"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif;color:#f2f6fa">Scoreboard needs JavaScript turned on to work.</p></noscript>
<script src="core.js"></script>
<script src="ui.js"></script>
