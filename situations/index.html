<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Do I Go? — Baseball Situations</title>
<meta name="theme-color" content="#0c1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Where Do I Go">
<meta name="application-name" content="Where Do I Go?">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/apps/icons/situations-192.png">
<link rel="apple-touch-icon" href="/apps/icons/situations-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!--
  This app runs LYBS Ballclub's own Situations trainer, so it is always the
  same as the Situations tab there: the engine (js/situations.js), its look
  (css/situations.css) and the rule files (data/*.csv) all load from
  /lybs-ballclub/ on this same site. Fix plays in lybs-ballclub, never here.
  This page only supplies the few things Ballclub's page normally provides:
  where the rule files live, an info popup, and the app frame.
-->
<link rel="stylesheet" href="/lybs-ballclub/css/situations.css">
<script src="https://natesteele888.github.io/apps/install.js" defer></script>
<script src="https://natesteele888.github.io/apps/health.js" defer></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0c1512;color:#f2f5f1}
body{font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto}
/* Ballclub's page styles a few shared classes the trainer uses; these stand in for them. */
.sectionHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.recordLine{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:10px;
  border:1px solid #28453c;background:#132420;color:#f2f5f1;font:600 15px 'Barlow',sans-serif;cursor:pointer}
.situationsRoot .btn.btnGhost{background:transparent;border:1px solid #28453c}
.emptyState{padding:30px 10px;text-align:center;color:#8fa89e}
.loading{padding:40px 10px;text-align:center;color:#8fa89e;font-family:'Barlow Condensed',sans-serif;font-size:18px}
/* Bigger taps on a phone than Ballclub's own sizes (same look, larger targets). */
.situationsRoot .sitDiamond{width:72px;height:72px}
.situationsRoot .sitDiamond button{width:24px;height:24px}
.situationsRoot .sitDiamond1{right:0;top:24px}
.situationsRoot .sitDiamond2{left:24px;top:0}
.situationsRoot .sitDiamond3{left:0;top:24px}
.situationsRoot .sitOuts button{width:32px;height:32px}
.situationsRoot .sitPill{min-height:36px}
.situationsRoot input[type=range]{height:32px}
/* Info popup (Ballclub's openInfoModal) */
#info{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#info.on{display:flex}
#info .sheet{background:#132420;border:1px solid #28453c;border-radius:16px 16px 0 0;width:100%;max-width:720px;
  max-height:86vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#info h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#info table{width:100%;border-collapse:collapse;font-size:14px}
#info td,#info th{border-bottom:1px solid #28453c;padding:6px 4px;text-align:left;vertical-align:top}
#infoClose{min-width:44px;min-height:44px;border:0;background:none;color:#f2f5f1;font-size:26px;cursor:pointer}
footer{margin:22px 0 0;text-align:center;color:#8fa89e;font-size:13px}
footer .btn{margin-top:8px}
</style>
</head>
<body>
<main>
  <div id="sit"><div class="loading">Loading the field…</div></div>
  <footer>
    <div>Same plays as the Situations tab in LYBS Ballclub.</div>
    <button class="btn" type="button" onclick="window.nateHealth&&nateHealth.report()">Something wrong? Send a report</button>
  </footer>
</main>
<div id="info" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="sheet"><h2><span id="infoTitle"></span><button id="infoClose" type="button" aria-label="Close">×</button></h2><div id="infoBody"></div></div>
</div>
<script>
(function () {
  var SRC = '/lybs-ballclub/';
  // The trainer fetches 'data/situations.csv' relative to its page; point those at Ballclub's copies.
  var realFetch = window.fetch.bind(window);
  window.fetch = function (u, o) {
    if (typeof u === 'string' && /^data\//.test(u)) u = SRC + u.replace(/\?.*$/, '');
    return realFetch(u, o);
  };
  // No shared database here: always read the rule files Ballclub ships.
  window.dbGet = function () { return Promise.resolve(null); };
  window.dbPut = function () { return Promise.resolve(); };
  window.sharedPath = function (p) { return p; };
  window.BUILD_V = '';
  window.escapeHtml = window.escapeHtml || function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  };
  var info = document.getElementById('info');
  window.openInfoModal = function (title, html) {
    document.getElementById('infoTitle').textContent = title;
    document.getElementById('infoBody').innerHTML = html;
    info.classList.add('on');
  };
  function closeInfo() { info.classList.remove('on'); }
  document.getElementById('infoClose').onclick = closeInfo;
  info.addEventListener('click', function (e) { if (e.target === info) closeInfo(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeInfo(); });

  var host = document.getElementById('sit');
  function fail() {
    host.innerHTML = '<div class="emptyState">Couldn\'t load the plays. Check your signal and try again.<br><br>' +
      '<button class="btn" type="button" onclick="location.reload()">Try again</button></div>';
  }
  var s = document.createElement('script');
  s.src = SRC + 'js/situations.js';
  s.onload = function () {
    if (!window.Situations) return fail();
    window.Situations.ensureLoaded(false).then(function (d) {
      if (!d || !d.situations || !d.situations.length) return fail();
      window.Situations.render(host);
    }).catch(fail);
  };
  s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
