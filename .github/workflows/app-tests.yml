name: App tests
# Runs each app's browser tests (tests/, see tests/README.md) on every pull request and on pushes to work branches,
# one job per app so a failure points straight at the app. Nothing is published or deployed.
# Where Do I Go? (situations) is left out: it needs the lybs-ballclub repo checked out beside this one.
# Walk-Up's tests also run in watch-build.yml; they are repeated here so every PR shows one complete set of checks.
on:
  pull_request: {}
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # run.sh matches by name, so "locker" also runs locker-back, "picks" runs picks-stats,
        # "eightcount" runs all three Eight Count files and "walkup" all three Walk-Up files.
        app: [health, bills, catchlog, photoblueprint, picks, getready, eightcount, playboard, locker,
              practiceclock, read20, whoswhere, tournamentpack, walkup, scoreboard, filmlite]
    name: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Phone-like fonts
        # The tests block web fonts, so pages fall back to the system's own. A bare Linux runner only has wide
        # DejaVu, which no phone uses; Roboto (Android's font) and Liberation (Arial and Arial Narrow sizes) match phones.
        run: |
          sudo apt-get install -y -qq fonts-roboto fonts-liberation fonts-liberation-sans-narrow >/dev/null
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
            <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f >/dev/null
          fc-match sans-serif; fc-match system-ui; fc-match "Arial Narrow"
      - name: Keep outside sites out
        # The tests swap the site's own install.js and health.js for empty scripts and block web fonts, but an app's
        # service worker fetches those straight from the internet, past the test's block: the live install bar then
        # covers buttons and web fonts change text sizes. Pointing those hosts at nowhere keeps the tests as written.
        run: printf '127.0.0.1 %s\n' natesteele888.github.io fonts.googleapis.com fonts.gstatic.com | sudo tee -a /etc/hosts
      - name: Tests
        run: NODE_PATH=/tmp/pw/node_modules tests/run.sh ${{ matrix.app }}
