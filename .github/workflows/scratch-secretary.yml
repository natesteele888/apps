name: Scratch - Meeting Secretary test
# Temporary, on a scratch branch only: runs the secretary browser test once to check PR 74.
on:
  push:
    branches: [claude/project-thread-jnxk52]
permissions:
  contents: read
jobs:
  secretary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Secretary test
        run: cd tests && W=$(mktemp -d) && mkdir -p $W/tests $W/serve $W/shots && ln -s $GITHUB_WORKSPACE $W/apps && ln -s $GITHUB_WORKSPACE $W/serve/apps && cp *.cjs $W/tests/ && cd $W/tests && NODE_PATH=/tmp/pw/node_modules node secretary.test.cjs
