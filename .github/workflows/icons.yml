name: Sync app icons from the Toolbox
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency: icons
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - id: pull
        run: python tools/pull-icons.py
      - if: steps.pull.outputs.changed != ''
        run: |
          git config user.name "Toolbox icon sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git commit -m "Icons from the Toolbox: ${{ steps.pull.outputs.changed }}"
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
