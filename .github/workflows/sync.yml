name: Sync the App Store
# Copies Toolbox icon and listing changes, each app's latest update and fresh screenshots
# into the app catalog (registry.json), icons/ and store/shots/. Runs every 3 hours and on demand.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0 playwright==1.48.0 && python -m playwright install --with-deps chromium
      - id: sync
        run: python tools/sync.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.sync.outputs.changed != ''
        run: |
          git config user.name "App Store sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons store/shots registry.json
          git commit -m "Sync the App Store: ${{ steps.sync.outputs.changed }}"
          git pull --rebase
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
