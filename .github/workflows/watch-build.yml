name: Dugout watch and phone apps
# Builds the Dugout phone app, the Dugout Wear OS watch app, the Steele Usage phone app and the Steele Family watch app (watch/family: Get Ready,
# Cube Clock, Power Program, Gameday Picks, Read 20, Practice Clock, Schedule and Spelling Genie on the watch), runs their tests, and runs Walk-Up's browser tests.
# The four APKs are attached to each run as "dugout-apks". With the DUGOUT_KEY and DUGOUT_KEY_PASSWORD secrets set, every
# build is signed with that same key and, on main, published as a "dugout-v<run number>" release, which Dugout on the
# phone finds and offers as an update. Without them each run signs with a fresh debug key and nothing is published.
on:
  push:
    paths:
      - "watch/**"
      - "walkup/**"
      - "tests/walkup*"
      - "tests/lib.cjs"
      - "tests/run.sh"
      - ".github/workflows/watch-build.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: watch-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      changed: ${{ steps.changed.outputs.changed }}
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the apps change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A Walk-Up-only change reaches Dugout through the live site, so it needs no new app.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" HEAD -- . ':!README.md'; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Unpack the Dugout signing key
        id: key
        env:
          KEY: ${{ secrets.DUGOUT_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/dugout.p12"
            echo "DUGOUT_KEYSTORE=$RUNNER_TEMP/dugout.p12" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          DUGOUT_VERSION: ${{ github.run_number }}
          DUGOUT_KEY_PASSWORD: ${{ secrets.DUGOUT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --continue :shared:test :phone:assembleDebug :wear:assembleDebug :wear:lintDebug :family:assembleDebug :family:lintDebug :usage:assembleDebug
      - name: Name the APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/dugout-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/dugout-watch.apk
          cp family/build/outputs/apk/debug/family-debug.apk out/steele-family-watch.apk
          cp usage/build/outputs/apk/debug/usage-debug.apk out/steele-usage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dugout-apks
          path: watch/out/*.apk
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: watch/*/build/reports
          retention-days: 7

  walkup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Walk-Up tests
        run: NODE_PATH=/tmp/pw/node_modules tests/run.sh walkup
      - name: Check the anthem download still works (a warning only)
        # Walk-Up's "Get the national anthem" downloads a public-domain recording from Wikimedia Commons on the coach's phone.
        # This only checks that the link still answers with audio the page is allowed to read; it never fails the build.
        if: always()
        continue-on-error: true
        run: |
          url=$(node -e 'const s=require("fs").readFileSync("walkup/board.js","utf8");console.log(/url: "([^"]+)"/.exec(s)[1])')
          h=$(curl -sSIL --max-time 30 -H "Origin: https://natesteele888.github.io" "$url")
          echo "$h" | grep -iE '^(HTTP/|content-type|content-length|access-control-allow-origin)'
          echo "$h" | grep -qiE '^HTTP/[0-9.]+ 200' && echo "$h" | grep -qiE '^content-type: audio/' && echo "$h" | grep -qi '^access-control-allow-origin' \
            || { echo "::warning::The anthem link in walkup/board.js no longer works. Coaches can still add their own file."; exit 1; }

  release:
    # Publishes the APKs that Dugout updates itself from: only on main (a push or a manual run), only when the apps changed, only when signed.
    needs: [apps, walkup-tests]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.apps.outputs.signed == '1' && needs.apps.outputs.changed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dugout-apks
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          gh release create "dugout-v$N" out/dugout-phone.apk out/dugout-watch.apk out/steele-family-watch.apk out/steele-usage.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Dugout $N" --latest \
            --notes "Built from ${GITHUB_SHA::7}. Android phones and Wear OS watches only (no Apple Watch). One watch app runs on Wear OS 2 (like the Huawei Watch 2) through Wear OS 5 (Pixel Watch, Galaxy Watch 4 and newer); anything that needs a newer watch is switched on only where the watch has it. iPhone users can use Walk-Up on the web, without the watch. Dugout on the phone offers this update by itself. steele-family-watch.apk is the family watch app (Get Ready, Cube Clock, Power Program, Gameday Picks, Read 20, Practice Clock, Schedule with its tile and Next up on the watch face, My Stats, Spelling Genie, Fairway). To install or update a watch app, see watch/README.md. steele-usage.apk is Steele Usage for the phone (GitHub Actions minutes and your Claude usage)."
          # Keep the five newest Dugout releases.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^dugout-v[0-9]*$' \
            | sort -t v -k2 -n -r | tail -n +6 | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
