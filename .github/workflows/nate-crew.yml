name: Nate crew testers
# Virtual testers for the game day apps (tests/crew/). They open each app on a new phone and an old small phone,
# tap every button once, and log crashes, dead buttons, sideways scrolling and tiny tap targets, plus a check for code
# older phones can't run. Every outside request is blocked, so nothing touches Firebase or any live data.
# One small job. Runs nightly at 3:17 AM Eastern and on demand; results are printed in the log between
# CREW-JSON-BEGIN / CREW-JSON-END and kept as a run artifact (screenshots of empty demo screens only).
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - "claude/crew-**"
permissions:
  contents: read
concurrency:
  group: nate-crew-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: serve/apps
      - name: Bengals coaching app beside it (public repo)
        uses: actions/checkout@v4
        with:
          repository: natesteele888/ASL-Bengals
          path: serve/asl-bengals
      - name: LYBS Ballclub beside it (Where Do I Go? loads its trainer)
        uses: actions/checkout@v4
        with:
          repository: natesteele888/lybs-ballclub
          path: serve/lybs-ballclub
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.63.0 acorn@8
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-roboto fonts-liberation >/dev/null
      - name: Old-phone code check
        run: ACORN=/tmp/pw/node_modules/acorn node serve/apps/tests/crew/oldphone.cjs serve/apps fairway walkup tournamentpack scoreboard practiceclock playboard filmlite locker eightcount situations | tee oldphone.json
      - name: Virtual testers
        run: NODE_PATH=/tmp/pw/node_modules node serve/apps/tests/crew/testers.cjs serve crew-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nate-crew-${{ github.run_id }}
          path: |
            crew-out
            oldphone.json
          retention-days: 14
