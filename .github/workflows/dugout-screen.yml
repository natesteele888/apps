name: Dugout phone screen check
# Runs the Dugout phone app on Android 15 and Android 16 emulators and checks that its top bar sits below the status bar
# and the page ends above the navigation bar (watch/phone/src/androidTest). Each run also prints a small screenshot of
# the app to the log, between "SCREENSHOT BEGIN" and "SCREENSHOT END", as base64 PNG.
on:
  push:
    paths:
      - "watch/phone/**"
      - "watch/shared/**"
      - ".github/workflows/dugout-screen.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dugout-screen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and its screen test
        working-directory: watch
        run: ./gradlew --no-daemon :phone:assembleDebug :phone:assembleDebugAndroidTest
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash watch/phone/screen-check.sh
