#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg,#0E141D);color:var(--ink,#E6EBF1);text-align:center;padding:24px;font-family:"Public Sans",system-ui,sans-serif}
#gate .box{max-width:340px}#gate h1{font-family:"Barlow Condensed",sans-serif;font-size:44px;text-transform:uppercase;margin:14px 0 6px}#gate p{opacity:.75;margin:0 0 18px}

.applyc{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.applyc ul{margin:6px 0 0;padding-left:18px}
.sh-acts .btn.cont{border-color:var(--accent);color:var(--accent)}
#viewer{position:fixed;inset:0;z-index:90;background:#000}
#viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#viewer .vbar{position:absolute;z-index:2;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:6px;opacity:.85}
#viewer .vbar button,#viewer .vbar a{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:rgba(10,14,20,.72);color:#fff;display:grid;place-items:center;font:600 17px system-ui;box-shadow:0 2px 10px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#viewer .vload{position:absolute;inset:0;display:grid;place-items:center;color:#9AA6B6;font:14px system-ui;pointer-events:none}

<div id="gate"><div class="box"><img src="icons/icon-192.png" width="88" height="88" alt="" style="border-radius:22px"><h1>Toolbox</h1><p id="gateMsg">Loading…</p><button id="gateBtn" hidden>Sign in with Google</button></div></div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one toolbox. Sticky side nav (top strip on phones), global search, six views over one shared data store */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E7EBE5; --ink:#142033; --muted:#5A6577; --line:#D6DCD4;
  --accent:#1D7A4D; --accent-ink:#FFFFFF;
  --a-lybs:#1F4E8C; --a-football:#C9561A; --a-family:#0F8282; --a-work:#7A4C9E; --a-platform:#677526;
  --s-active:#1D7A4D; --s-blocked:#C2362B; --s-parked:#7E8592; --s-done:#3F6E57;
  --blue:#2554A8; --blue-soft:#E3EBF8; --mark:#E2B32C; --mark-soft:#FFF4CF; --good:#21835A; --bad:#C23A2E; --warn:#B7790C;
  --shadow:0 10px 30px rgba(20,32,51,.14);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141D; --surface:#162030; --sunk:#111A26; --ink:#E6EBF1; --muted:#9AA6B6; --line:#283447;
  --accent:#45BE85; --accent-ink:#0B1A12;
  --a-lybs:#6E9BE0; --a-football:#F08A4B; --a-family:#3FC2C0; --a-work:#B48BD8; --a-platform:#A9B85A;
  --s-active:#45BE85; --s-blocked:#F06A5E; --s-parked:#8C95A3; --s-done:#79A894;
  --blue:#7FA8F0; --blue-soft:#1C2A44; --mark:#F3C63F; --mark-soft:#3A3116; --good:#4CC28E; --bad:#F2766A; --warn:#E5AE45;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#162030; --sunk:#111A26; --ink:#E6EBF1; --muted:#9AA6B6; --line:#283447;
  --accent:#45BE85; --accent-ink:#0B1A12;
  --a-lybs:#6E9BE0; --a-football:#F08A4B; --a-family:#3FC2C0; --a-work:#B48BD8; --a-platform:#A9B85A;
  --s-active:#45BE85; --s-blocked:#F06A5E; --s-parked:#8C95A3; --s-done:#79A894;
  --blue:#7FA8F0; --blue-soft:#1C2A44; --mark:#F3C63F; --mark-soft:#3A3116; --good:#4CC28E; --bad:#F2766A; --warn:#E5AE45;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

/* nav */
.side{position:sticky;top:calc(14px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:.95;text-transform:uppercase}
.logo small{display:block;line-height:1.35;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-weight:600}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.nav a em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

main{min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vh h1{font-size:44px;line-height:1;text-transform:uppercase}
.vh p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.lede{color:var(--muted);margin:0 0 14px;max-width:70ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}

.area-lybs{--ac:var(--a-lybs)} .area-football{--ac:var(--a-football)} .area-family{--ac:var(--a-family)} .area-work{--ac:var(--a-work)} .area-platform{--ac:var(--a-platform)}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.st-active{color:var(--s-active)} .st-blocked{color:var(--s-blocked)} .st-parked{color:var(--s-parked)} .st-done{color:var(--s-done)}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bases{display:inline-flex;gap:5px}
.bases b{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--ac);display:inline-block}
.bases b.on{background:var(--ac)}
.bases b.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.section-h{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-family:var(--f-body);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-h a{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;text-decoration:none}

/* home */
.score{display:flex;gap:2px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.score > *{background:var(--surface);padding:8px 14px;min-width:78px;text-decoration:none;color:var(--ink)}
.score b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.score .k-active b{color:var(--s-active)} .score .k-blocked b{color:var(--s-blocked)} .score .k-parked b{color:var(--s-parked)} .score .k-done b{color:var(--s-done)}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
.launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.launch a{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);background:var(--bg);min-width:0}
.launch a:hover{border-color:var(--accent)}
.launch a b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.launch a span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;flex-direction:column;gap:6px}
.mini > button{display:grid;grid-template-columns:5px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 0;width:100%}
.mini .rail{align-self:stretch;background:var(--ac);border-radius:0 3px 3px 0}
.mini b{display:block;font-size:14px}
.mini small{color:var(--muted);font-size:12.5px;display:block}
.bigbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:6px 0}
.bigbar i{display:block;height:100%;background:var(--good)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.feed li{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:14px}
.feed time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* projects */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ac)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:start}
.col h2{font-size:22px;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:3px solid var(--ac);margin-bottom:10px}
.col h2 em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px}
.card:hover{border-color:var(--ac)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3{font-size:19px;line-height:1.15}
.card p{margin:4px 0 8px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.is-done{opacity:.72}
.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ac)}
.newform{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.newform .r{display:flex;flex-wrap:wrap;gap:8px}
.newform input,.newform select,.newform textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;min-width:0}
.newform input{flex:1 1 200px}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.mapbox .scroll{overflow-x:auto}
.mapbox svg{display:block;width:100%;min-width:640px;height:auto}
.maplegend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.edge{stroke:var(--muted);stroke-opacity:.45;stroke-width:1.4}
.edge.hot{stroke:var(--ink);stroke-opacity:.9;stroke-width:2.2}
.node{cursor:pointer}
.node text{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.maptip{position:absolute;left:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:280px;box-shadow:var(--shadow)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:var(--shadow);border-left:1px solid var(--line);
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 18px}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:3px solid var(--ac)}
.drawer h2{font-size:32px;line-height:1.05}
.drawer .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.drawer select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:13px}
.blk{margin-top:18px}
.blk h4{margin:0 0 6px;font-family:var(--f-body);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;gap:8px;align-items:center}
.offline{font-size:12.5px;line-height:1.4;background:var(--mark-soft);border-left:3px solid var(--mark);border-radius:0 6px 6px 0;padding:6px 9px}
.drawer header .hbtns{display:flex;gap:6px;flex-shrink:0}
.edin{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;font-size:14px;color:var(--ink)}
textarea.edin{min-height:0;resize:vertical}
.edname{font-family:var(--f-display);font-size:26px;font-weight:700;padding:4px 9px}
.edtitle{font-weight:700}
.edrow{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.edrow input[type=checkbox]{flex:0 0 auto;accent-color:var(--ac)}
.tasks .edrow{margin:0}
.mv{display:inline-flex;gap:2px;flex:0 0 auto}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:28px;height:28px;padding:0 6px;font-size:13px;color:var(--muted);flex:0 0 auto}
.ib:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.ib:disabled{opacity:.35}
.ib.del:hover{color:var(--s-blocked);border-color:var(--s-blocked)}
.btn.danger{color:var(--s-blocked)}
.edhint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.drawer.editing .wp:before{display:none}
.toast .undo{background:none;border:0;color:var(--mark);font-weight:700;margin-left:8px;cursor:pointer}
.rowsE{display:grid;gap:4px}
.trow{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.trow > input[type=checkbox]{flex:0 0 auto;margin-top:4px;width:16px;height:16px;cursor:pointer}
.trow .edin{margin-top:0}
.etext{cursor:text;border-radius:4px;padding:1px 3px;margin:-1px -3px;min-width:0;overflow-wrap:anywhere}
.etext[role=button]:hover{background:var(--sunk);box-shadow:inset 0 -1px 0 var(--muted)}
.etext[role=button]:hover::after{content:" ✎";color:var(--muted);font-size:12px}
@media (hover:none){.etext[role=button]::after{content:" ✎";color:var(--muted);font-size:11px;opacity:.6}}
.as-inst{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ac,var(--accent));border-radius:0 10px 10px 0;padding:12px 14px}
.as-inst p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.as-inst ol{margin:0 0 10px;padding-left:20px;display:grid;gap:4px;font-size:14px}
.as-inst .sync{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.as-inst .sync b{color:var(--ink)}
.as-inst .kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ac,var(--accent));margin-bottom:4px}
/* brain */
.seg2{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.draftpill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--mark-soft);color:var(--warn);border-radius:4px;padding:1px 5px}
.bedge{fill:none;stroke:var(--mark);stroke-opacity:.5;stroke-width:1.3}
.bedge.hot{stroke-opacity:1;stroke-width:2.4}
.mapbox svg:has(.bedge.hot) .bedge:not(.hot){stroke-opacity:.12}
.pnode{cursor:pointer}
.pnode rect{fill:var(--mark-soft);stroke:var(--mark);stroke-width:1.8}
.pnode.k-data rect{fill:var(--blue-soft);stroke:var(--blue)}
.pnode.k-know rect{fill:color-mix(in srgb,var(--good) 14%,var(--surface));stroke:var(--good)}
.pnode text{font-family:var(--f-body);font-size:12.5px;font-weight:700;fill:var(--ink)}
.pnode .pcount{fill:var(--ink)}.pnode .pcountt{fill:var(--surface);font-size:10.5px;font-weight:700}
.pnode:hover rect,.pnode:focus rect{stroke-width:3}
.pnode:focus{outline:none}
.lg{display:inline-block;width:14px;height:10px;border-radius:5px;background:var(--mark-soft);border:1.5px solid var(--mark)}
.lg.k-data{background:var(--blue-soft);border-color:var(--blue)}.lg.k-know{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good)}

/* links */

<script>

/* ---------- tiny SVG kit: every diagram is drawn from these ---------- */
let AID=0;
function svg(h,body){const id="ah"+(++AID);return `<svg viewBox="0 0 760 ${h}" role="img"><defs>
${["","bad","good","blue"].map(k=>`<marker id="${id}${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head ${k}"/></marker>`).join("")}</defs>${body(id)}</svg>`}
function B(x,y,w,h,t,sub,k="d-box",r=9){const lines=[].concat(sub||[]);const ty=y+h/2-(lines.length*8)+ (lines.length?0:5);
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${k}"/><text x="${x+w/2}" y="${ty}" text-anchor="middle" class="d-t">${t}</text>`+
  lines.map((s,i)=>`<text x="${x+w/2}" y="${ty+19+i*17}" text-anchor="middle" class="d-s">${s}</text>`).join("")}
function A(id,x1,y1,x2,y2,lab,k=""){const mx=(x1+x2)/2,my=(y1+y2)/2;return `<path d="M${x1},${y1} L${x2},${y2}" class="d-a ${k}" marker-end="url(#${id}${k})"/>`+(lab?`<text x="${mx}" y="${my-7}" text-anchor="middle" class="d-lab">${lab}</text>`:"")}
function C(id,d,k=""){return `<path d="${d}" class="d-a ${k}" marker-end="url(#${id}${k})"/>`}
function T(x,y,s,c="d-s",a="start"){return `<text x="${x}" y="${y}" text-anchor="${a}" class="${c}">${s}</text>`}

const CH=id=>"https://claude.ai/chat/"+id;

/* ---------- the course ---------- */
const STAGES=[
{phase:"Build the page",title:"How a page works",
idea:`Every app you've built is an HTML file the browser reads top to bottom. <b>HTML is the structure</b>, <b>CSS is the look</b>, and <b>JavaScript is the behavior</b>. When something happens, like a tap, JavaScript changes the app's <b>state</b> (the facts it's holding right now: which tab is open, which angler is picked). Then a <b>render</b> function redraws the screen from that state. Event, state, render: that loop runs every one of your apps.`,
fig:()=>svg(340,id=>
  B(20,20,150,56,"HTML",["structure"],"d-blue")+B(20,92,150,56,"CSS",["look"],"d-blue")+B(20,164,150,56,"JavaScript",["behavior"],"d-blue")+
  A(id,172,48,250,100)+A(id,172,120,250,120)+A(id,172,192,250,140)+
  B(254,86,170,70,"Browser",["builds the DOM,","the live page"])+
  T(600,20,"THE LOOP, IN CATCH LOG","d-lab","middle")+
  B(450,34,140,48,"Tap “Gear”",null,"d-mark")+A(id,590,58,628,58)+
  B(630,34,120,48,"setTab()",null)+A(id,690,82,690,124,"","good")+
  B(610,126,140,48,"state.tab = gear",null)+A(id,610,150,592,150,"","good")+
  B(450,126,140,48,"render()",null)+A(id,520,174,520,210,"","good")+
  B(440,212,160,48,"Gear screen",null,"d-good")+
  C(id,"M748,84 C 756,140 756,230 730,262","bad")+B(612,262,140,52,"Guard",["no angler? return"],"d-bad")+
  T(20,272,"The guard quit before state changed,","d-lab")+T(20,290,"so render() drew the same screen.","d-lab")
),
cap:"Left: three ingredients become one live page. Right: the Catch Log Gear bug. The tap fired, but a leftover guard returned before state changed, so nothing new was drawn.",
builds:[
 {p:"Catch Log",t:"The Gear button didn't open its panel while Trophies and Locations did. A leftover guard inside <code>setTab()</code> silently stopped navigation when no angler was selected.",l:"No error doesn't mean no problem. Follow the loop: did the event fire, did state change, did render run?",u:CH("62b99262-fc6e-4d84-96d2-77299f354c1f")},
 {p:"Fortnite checklist",t:"110 item icons were cropped from one screenshot and embedded inside the HTML as base64 data URIs, so the file carries its own images.",l:"Single-file apps travel well because nothing lives outside the file.",u:CH("4b3669ce-d82f-4590-9bfa-56800e795ae1")},
 {p:"Catch Log home screen",t:"Your artwork fills the screen and six invisible buttons sit on top of the painted UI. Those are HTML buttons with transparent CSS positioned over an image.",l:"What you see and what you can tap are separate layers."}
],
terms:[["HTML","The page's structure: headings, buttons, sections."],["CSS","Rules for how things look: color, size, layout."],["JavaScript","Code that reacts to taps and changes things."],["DOM","The live, in-memory version of the page that the browser draws."],["state","The facts the app holds right now: current tab, selected player."],["render()","A function that rebuilds the screen from state."],["event listener","Code that waits for a tap, key or change, then runs."],["data URI","A file, like an image, encoded as text inside the page."]],
drill:["Open your latest Catch Log file and search for <code>render</code> and <code>setTab</code>.","Find one line that changes state and the line that redraws the screen.","Ask Claude: “Draw the event → state → render loop for this file as a diagram.”"],
q:{q:"You tap a button, nothing happens, and there's no error. What's the most likely cause?",o:["The CSS file failed to load","The tap never changed state, because code returned early","The browser is out of date"],a:1,w:"With no error, the code usually ran fine but exited before changing state. That's what the Gear guard did."}},

{phase:"Build the page",title:"Data shapes",
idea:`Apps run on structured data. <b>JSON</b> uses <b>objects</b> (labeled values inside <code>{ }</code>) and <b>arrays</b> (lists inside <code>[ ]</code>). <b>CSV</b> is rows and columns. One small slip, like a comma right before a closing brace or an empty <code>{}</code> where code expects an item, breaks the whole file. Shape choice matters too: sometimes a few <b>rules</b> beat a giant table.`,
fig:()=>svg(320,id=>
  `<rect x="20" y="20" width="340" height="280" rx="9" class="d-box"/>`+T(40,50,"product.json","d-t")+
  T(40,84,'{',"d-m")+T(56,106,'"sku": "RC-…-Rockers",',"d-m")+T(56,128,'"description": "Rockers",',"d-m")+T(56,150,'"price": …,',"d-m")+T(40,172,'}',"d-m")+
  `<circle cx="134" cy="146" r="8" class="d-bad"/>`+T(165,150,"← trailing comma: not allowed","d-lab")+
  T(40,214,'"additionalItems": [','d-m')+T(56,236,'{ "sku": … },','d-m')+T(56,258,'{}','d-m')+T(40,280,']','d-m')+
  `<rect x="50" y="242" width="32" height="22" rx="5" class="d-bad" fill-opacity=".4"/>`+T(95,258,"← empty item: code finds no sku","d-lab")+
  B(400,24,150,96,"Flat table",["one row per","situation"],"d-ghost")+T(475,146,"≈ 11,880 rows","d-t","middle")+
  B(590,24,150,96,"Rules",["707 rows,","* means “any”"],"d-blue")+
  A(id,665,122,665,170)+B(590,172,150,52,"Resolver",["most specific wins"])+
  A(id,665,226,665,250,"","good")+B(590,252,150,48,"Each kid's spot",null,"d-good")+
  T(475,186,"same answers,","d-lab","middle")+T(475,204,"far more to maintain","d-lab","middle")
),
cap:"Left: the two JSON slips Claude found in your product files. Right: why Where Do I Go stores 707 rules instead of a row for every situation.",
builds:[
 {p:"Product JSON, line 101",t:"A trailing comma after <code>price</code> inside an <code>additionalItems</code> object made the file invalid.",l:"JSON is strict: no comma after the last item.",u:CH("e0690a59-5443-45cb-8909-84317bb9416c")},
 {p:"Product JSON, line 308",t:"An empty <code>{}</code> sat inside <code>additionalItems</code>. Code expecting <code>sku</code>, <code>price</code> and friends found nothing. Fix: a real item or an empty array <code>[]</code>.",l:"Valid JSON can still be the wrong shape for the code reading it.",u:CH("40b68024-5433-4c55-b7c1-ad85cd2e3df0")},
 {p:"Where Do I Go?",t:"707 wildcard rules resolve per situation instead of a flat table of about 11,880 rows, driven by <code>situations.csv</code> and <code>responsibilities.csv</code>.",l:"When data repeats with small exceptions, store the rule and the exceptions.",u:CH("19decbe4-3dd4-4a02-bf03-cb8af4ed36f8")},
 {p:"Steele Cards stats",t:"GameChanger exports repeat headers like H, BB and SO in the batting and pitching sections, so the parser reads columns by position, never by name.",l:"Read the real file before trusting its headers."}
],
terms:[["JSON","Text format for data made of objects and arrays."],["object { }","Labeled values: \"name\": \"Sam\"."],["array [ ]","An ordered list of values or objects."],["CSV","Rows and columns, separated by commas. Spreadsheet-friendly."],["parse","Read text and turn it into data the code can use."],["schema","The expected shape: which fields, which types."],["wildcard rule","A rule with * for “any value,” covering many cases at once."],["string vs number","\"100\" is text; 100 is a number. Math needs numbers."]],
drill:["Take any JSON file from your projects and ask Claude: “Show this JSON as a tree diagram and list the required fields per item.”","Open <code>situations.csv</code> and find one rule with a <code>*</code>. Say out loud which situations it covers."],
q:{q:"Why does Where Do I Go use wildcard rules instead of a full table?",o:["Browsers can't load big tables","Fewer rows to maintain, and one edit covers many situations","CSV doesn't support more than 1,000 rows"],a:1,w:"A rule with * covers every matching situation, so fixing one rule fixes all of them."}},

{phase:"Build the page",title:"Where data lives",
idea:`Data has four homes. <b>Memory</b> (variables) disappears on refresh. <b>Browser storage</b> (localStorage, IndexedDB) survives a refresh but only on that device. <b>Shared cloud storage</b> (artifact storage, Firebase) reaches every device. <b>Outside systems</b> like a Google Sheet hold data your page sends them. Most “it didn't save” bugs mean the data went to a different home, or a different <b>key</b>, than the reader checks.`,
fig:()=>svg(400,id=>
  B(20,20,165,80,"Memory",["gone on refresh"],"d-box")+B(205,20,165,80,"Browser storage",["this device only"],"d-blue")+
  B(390,20,165,80,"Shared cloud",["every device"],"d-good")+B(575,20,165,80,"Outside system",["Sheet, CRM, etc."],"d-mark")+
  T(102,126,"variables","d-m","middle")+T(287,126,"localStorage","d-m","middle")+T(287,144,"IndexedDB","d-m","middle")+
  T(472,126,"artifact storage","d-m","middle")+T(472,144,"Firebase","d-m","middle")+T(657,126,"Apps Script","d-m","middle")+T(657,144,"→ Google Sheet","d-m","middle")+

{phase:"Ship it",title:"Hosting and caching",
idea:`<b>Hosting</b> means a server hands your files to browsers. GitHub Pages is <b>static hosting</b>: it just serves files. <b>Deploying</b> publishes a new version. To be fast, browsers and <b>service workers</b> keep <b>cached</b> copies, so a phone can keep showing an old version after you've shipped a new one. When a device behaves differently, suspect a stale copy first.`,

{phase:"Protect it",title:"Debugging and testing",
idea:`Debugging is a loop: <b>reproduce</b> the problem, <b>isolate</b> where it happens, form <b>one hypothesis</b>, <b>change one thing</b>, then <b>verify</b>. Testing turns your rules into checks the computer reruns every time, so a bug you fixed stays fixed.`,
fig:()=>svg(330,id=>{
  const N=[["Reproduce",200,44],["Isolate",318,124],["Hypothesize",288,262],["Change 1 thing",112,262],["Verify",82,124]];
  let s=N.map(([t,x,y])=>B(x-68,y-22,136,44,t,null,t==="Verify"?"d-good":"d-blue")).join("");
  for(let i=0;i<5;i++){const [,x1,y1]=N[i],[,x2,y2]=N[(i+1)%5];const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),k1=40/d,k2=(d-40)/d;s+=A(id,x1+dx*k1,y1+dy*k1,x1+dx*k2,y1+dy*k2)}
  s+=T(200,170,"one change","d-lab","middle")+T(200,188,"per loop","d-lab","middle");
  s+=T(590,24,"LET THE COMPUTER RE-CHECK","d-lab","middle");
  s+=B(440,40,300,68,"Syntax check",["node --check: does it even parse?"],"d-box");
  s+=B(440,126,300,68,"Invariant tests",["validator: no two fielders on one spot"],"d-box");
  s+=B(440,212,300,68,"Visual check",["screenshot: does it look right?"],"d-box");
  return s}),

/* ---------- map ---------- */
const W=1000,H=640;
const ANCHOR={lybs:[300,240],football:[740,220],family:[760,500],work:[190,520],platform:[520,420]};
function layout(ps){
  const prev=mapLayout||{};let seed=7;const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const nodes=ps.map(p=>{const o=prev[p.id];const a=ANCHOR[p.area]||[W/2,H/2];return{id:p.id,p,x:o?o.x:a[0]+(rnd()-.5)*140,y:o?o.y:a[1]+(rnd()-.5)*140}});
  const by=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const edges=[];ps.forEach(p=>(p.connects||[]).forEach(c=>{if(by[c.to])edges.push({s:by[p.id],t:by[c.to],why:c.why})}));
  for(let it=0;it<320;it++){const k=1-it/320;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;if(d<250){const f=(250-d)/d*.08*k;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f}}
    edges.forEach(e=>{let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.hypot(dx,dy)||1;const f=(d-170)/d*.04*k;e.s.x+=dx*f;e.s.y+=dy*f;e.t.x-=dx*f;e.t.y-=dy*f});
    nodes.forEach(n=>{const a=ANCHOR[n.p.area]||[W/2,H/2];n.x+=(a[0]-n.x)*.02*k;n.y+=(a[1]-n.y)*.02*k;n.x=Math.max(90,Math.min(W-90,n.x));n.y=Math.max(40,Math.min(H-40,n.y))})}
  mapLayout=Object.fromEntries(nodes.map(n=>[n.id,{x:n.x,y:n.y}]));return{nodes,edges};
}
/* ---------- Nate AI Brain (draft): shared parts across projects ---------- */
const PART_KIND={code:"Code you reuse",data:"Shared data",know:"Know-how"};
function brainLayout(ps,parts){
  // parts in a center column; projects in two side columns, ordered to keep lines short
  const LEFT=new Set(["lybs","work"]);const kindOrd={data:0,code:1,know:2};
  let P_=parts.slice().sort((a,b)=>(kindOrd[a.kind]??1)-(kindOrd[b.kind]??1));
  const L=ps.filter(p=>LEFT.has(p.area)),R=ps.filter(p=>!LEFT.has(p.area));
  const top=34,bot=H-24;const place=(arr,x)=>arr.forEach((n,i)=>{n.x=x;n.y=arr.length<2?(top+bot)/2:top+i*(bot-top)/(arr.length-1)});
  const pn=P_.map(q=>({id:"part:"+q.id,q,kind:"part"})),ln=L.map(p=>({id:p.id,p,kind:"proj",side:"L"})),rn=R.map(p=>({id:p.id,p,kind:"proj",side:"R"}));
  const uses=(n)=>pn.filter(x=>(x.q.uses||[]).includes(n.id));const usedBy=(x)=>[...ln,...rn].filter(n=>(x.q.uses||[]).includes(n.id));
  const bary=(arr,f)=>arr.forEach(n=>{const ys=f(n).map(m=>m.y);n.b=ys.length?ys.reduce((s,y)=>s+y,0)/ys.length:n.y});
  place(pn,W/2);place(ln,232);place(rn,768);
  for(let it=0;it<6;it++){bary(ln,uses);ln.sort((a,b)=>a.b-b.b);place(ln,232);bary(rn,uses);rn.sort((a,b)=>a.b-b.b);place(rn,768);
    bary(pn,usedBy);pn.sort((a,b)=>a.b-b.b);place(pn,W/2)}
  const nodes=[...pn,...ln,...rn];const by=Object.fromEntries(nodes.map(n=>[n.id,n]));const edges=[];
  pn.forEach(x=>(x.q.uses||[]).forEach(pid=>{if(by[pid])edges.push({s:x,t:by[pid]})}));
  return{nodes,edges};
}

  svg+=`</svg>`;
  $("#main").innerHTML=`<div class="vh"><div><h1>Map</h1><p>The Brain draft: pieces you've built more than once, linked to every project that uses them. Tap a part to see where it lives.</p></div>${mapToggle()}</div>

  ${filterBar()}${parts.length?`<div class="mapbox brain"><div class="scroll">${svg}</div><div class="maptip" id="tip">${TIPDEF}</div><div class="maplegend">
    <span><i class="lg k-code"></i>Code you reuse</span><span><i class="lg k-data"></i>Shared data</span><span><i class="lg k-know"></i>Know-how</span><span>Number = projects using it</span></div></div>`
    :`<div class="empty"><h2>No shared parts yet</h2><p>Ask Claude to scan your projects and repos for pieces you've built more than once.</p></div>`}`;
  wireMapToggle();

  document.querySelectorAll(".pnode,.node").forEach(g=>{const id=g.dataset.node;
    const on=()=>{document.querySelectorAll(".bedge").forEach(l=>l.classList.toggle("hot",l.dataset.s===id||l.dataset.t===id));
      if(id.startsWith("part:")){const q=parts.find(x=>"part:"+x.id===id);tip.innerHTML=`<b>${esc(q.name)}</b><br>${esc(q.what||"")}<br><span style="color:var(--muted)">Used in ${(q.uses||[]).length} projects</span>`}

    const off=()=>{document.querySelectorAll(".bedge").forEach(l=>l.classList.remove("hot"));tip.innerHTML=TIPDEF};
    g.addEventListener("mouseenter",on);g.addEventListener("mouseleave",off);g.addEventListener("focus",on);g.addEventListener("blur",off)});
  document.querySelectorAll("[data-part]").forEach(g=>{const go=()=>openPart(g.dataset.part);g.addEventListener("click",go);g.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});

async function askBrain(question){

function renderLearn(n){

  let rail="",ph="";STAGES.forEach((x,i)=>{if(x.phase!==ph){ph=x.phase;rail+=`<li class="phase">${ph}</li>`}
    rail+=`<li class="${d.has(i+1)?"done":""}"><a href="#learn-${i+1}" ${n===i+1?'aria-current="page"':""}><span class="n">${d.has(i+1)?"✓":i+1}</span><span class="t">${x.title}</span></a></li>`});
  $("#main").innerHTML=`<div class="learn"><div class="lrail"><div class="bigbar"><i style="width:${d.size/STAGES.length*100}%"></i></div><div class="prog" style="margin-bottom:8px">${d.size} of ${STAGES.length} stages</div><ol class="steps">${rail}</ol></div>
  <article class="stage"><div class="eyebrow">Stage ${n} of ${STAGES.length} · ${s.phase}</div><h2>${s.title}</h2><p class="idea">${s.idea}</p>
  <figure class="fig"><div class="scroll">${s.fig()}</div><figcaption>${s.cap}</figcaption></figure>
  <h3 class="sec">In your builds</h3><div class="builds">${s.builds.map(b=>`<div class="build"><div class="proj">${b.p}</div><p>${b.t}</p><p class="lesson"><b>Takeaway:</b> ${b.l}</p>${b.u?`<a href="${b.u}" target="_blank" rel="noopener">Open the chat ↗</a>`:""}</div>`).join("")}</div>
  <h3 class="sec">Words to know</h3><dl class="terms">${s.terms.map(([t,dd])=>`<div class="term"><dt>${t}</dt><dd>${dd}</dd></div>`).join("")}</dl>
  <h3 class="sec">Drill</h3><div class="drill"><ol>${s.drill.map(x=>`<li>${x}</li>`).join("")}</ol></div>
  <h3 class="sec">Check yourself</h3><div class="check"><div class="q">${s.q.q}</div><div class="opts">${s.q.o.map((o,i)=>`<button data-qi="${i}">${o}</button>`).join("")}</div><div class="why" id="why" hidden></div></div>
  <div class="foot">${n>1?`<a class="btn" href="#learn-${n-1}">← Stage ${n-1}</a>`:"<span></span>"}
   <button class="btn go" id="mark" aria-pressed="${d.has(n)}" ${S.db&&S.canWrite?"":"disabled"}>${d.has(n)?"Stage done ✓":"Mark stage done"}</button>
   ${n<STAGES.length?`<a class="btn" href="#learn-${n+1}">Stage ${n+1} →</a>`:"<span></span>"}</div></article></div>`;
  document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{const i=+b.dataset.qi;
    document.querySelectorAll(".opts button").forEach(x=>{x.classList.remove("right","wrong");if(+x.dataset.qi===s.q.a)x.classList.add("right")});
    if(i!==s.q.a)b.classList.add("wrong");const w=$("#why");w.hidden=false;w.innerHTML=(i===s.q.a?"<b>Right.</b> ":"<b>Not quite.</b> ")+s.q.w});
  $("#mark").onclick=()=>markStage(n);
}
function markStage(n){
  const d=doneStages();const on=!d.has(n);on?d.add(n):d.delete(n);
  const done=[...d].sort((a,b)=>a-b);S.progress={done};render();
  queue(()=>S.db.doc("progress/course").set({done,updated:new Date().toISOString()}));
  const p=S.projects["dev-training"];
  if(p){const w=structuredClone(p.waypoints||[]);let hit=false;w.forEach(x=>(x.tasks||[]).forEach(t=>{if(t.t.startsWith("Stage "+n+" ")){t.done=on;if(on)t.doneAt=new Date().toISOString();else delete t.doneAt;hit=true}}));if(hit)save(p.id,{waypoints:w})}
  if(on)toast("Stage "+n+" done");
}

function taskPrompt(p,wi,ti){
  const w=p.waypoints[wi],t=w.tasks[ti],d=t.do||{};
  if(d.prompt)return (d.prompt+"\n\n"+returnNote(p,wi,ti)).slice(0,1900);
  const cut=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
  const lines=[`I'm picking up a task from my Nate's Toolbox.`,``,`Project: ${p.name}`,`Where it lives: ${cut(p.where,200)}`,
    p.leftOff?`Where I left off: ${cut(p.leftOff,420)}`:"",`Waypoint: ${w.title}`,`Task: ${t.t}`,
    (d.steps||[]).length?`My steps: ${d.steps.map((s,i)=>`${i+1}) ${s}`).join(" ")}`:"",``,
    `Help me finish this task now. Start with 2-3 lines on what you'll do. If it needs files on my AutoNuvo_1 drive, use my linked computer. Pause before anything only I can do (sign-ins, clicking in another app) and tell me exactly what to click.`,``,returnNote(p,wi,ti)];
  return cut(lines.filter(x=>x!=="").join("\n").replace(/\n(?=Help me)/,"\n\n"),1900);
}

function mdLite(s){
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const out=[];let list=null;
  String(s||"").split("\n").forEach(line=>{const m=line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){if(!list){list=[];out.push(list)}list.push(inl(m[1]))}else{list=null;if(line.trim())out.push(`<p>${inl(line)}</p>`)}});
  return out.map(x=>Array.isArray(x)?`<ul>${x.map(i=>`<li>${i}</li>`).join("")}</ul>`:x).join("");
}

const MCPMSG={needs_reauth:s=>`${s} needs reconnecting: claude.ai → Settings → Connectors.`,server_not_connected:s=>`${s} isn't connected. Add it in claude.ai → Settings → Connectors.`,

function confirmAct(ctx,card,run,linkOf){
  return new Promise((resolve,reject)=>{
    const item={k:"confirm",card,state:"ask"};WORK.items.push(item);drawWorkLog();
    const finish=(state,msg,url)=>{item.state=state;item.msg=msg;item.url=url;drawWorkLog()};
    ctx.signal.addEventListener("abort",()=>{if(item.state==="ask"){finish("skip","Stopped");reject(new Error("Stopped before Nathan decided"))}},{once:true});
    item.approve=async()=>{finish("run","Working…");
      try{const r=await run();const url=linkOf(r.payload);finish("ok","Done",url);resolve({ok:true,link:url||null,result:typeof r.payload==="object"?JSON.stringify(r.payload).slice(0,1500):String(r.payload||"").slice(0,1500)})}
      catch(e){const s=e&&e.server||"The connector";const m=(MCPMSG[e&&e.code]||(()=>e&&e.code==="tool_error"?`${s} reported a problem: ${String(e.message||"").slice(0,200)}`:"That didn't go through."))(s);finish("err",m);reject(new Error(m))}};
    item.skip=()=>{finish("skip","Skipped");resolve({ok:false,declined:true,note:"Nathan chose not to do this. Ask what he'd like instead."})};
  });
}

  const p=structuredClone(S.projects[WORK.pid]);const t=p.waypoints[WORK.wi]&&p.waypoints[WORK.wi].tasks[WORK.ti];const d=t&&t.do;if(!d||!d.steps||!d.steps[i])return null;
  d.stepsDone=d.steps.map((_,k)=>k===i?done:!!(d.stepsDone||[])[k]);await save(p.id,{waypoints:p.waypoints});return d.steps[i];
}

  rate_limited:"Claude is busy or you've hit a usage limit. Try again in a bit.",session_expired:"Sign in to claude.ai again, then reopen this.",refused:"Claude couldn't help with that message. Try rewording it.",

async function sendWork(text){

  WORK.items.push({k:"user",text});let cur={k:"claude",text:"",from:0};WORK.items.push(cur);WORK.busy=true;drawWorkLog();
  const hist=WORK.items.filter(x=>(x.k==="user"||x.k==="claude"||x.k==="act")&&x!==cur&&x.text).slice(-24)
    .map(x=>x.k==="act"?{role:"user",content:`[Toolbox note: ${x.text}]`}:{role:x.k==="user"?"user":"assistant",content:x.text});
  const turns=[{role:"user",content:workRules()},...hist];while(turns.length&&turns[turns.length-1].role!=="user")turns.pop();
  const ctl=new AbortController();WORK.ctl=ctl;let lastLen=0;const me=WORK;
  // each tool round: notes and approval cards go in order, then a fresh bubble for Claude's next words
  const tools=workTools().map(tl=>({...tl,execute:async(a,ctx)=>{if(me!==WORK)throw new Error("Panel closed");
    if(!cur.text)WORK.items=WORK.items.filter(x=>x!==cur);

  try{
    await S.sample(turns,{signal:ctl.signal,tools,cache:false,onText:({text})=>{if(me!==WORK)return;lastLen=text.length;cur.text=text.slice(cur.from).replace(/^\s+/,"");if(!WORK.items.includes(cur))WORK.items.push(cur);drawWorkLog()}});
  }catch(e){if(me!==WORK)return;

    if(e&&e.code==="refused")cur.text="";

  if(me!==WORK)return;

}

async function savePhoneCopy(btn){

    const page='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="Toolbox"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+body+"</body></html>";

  }catch(err){if(!err||err.code!=="declined")toast(err&&err.code==="extension_not_enabled"?"HTML downloads aren't enabled here":"Couldn't build the phone copy")}

function localDb(snap){
  const KEY="toolbox.phone.v1";let st;
  try{st=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){st=null}
  if(!st||st.base!==snap.taken)st={base:snap.taken,docs:structuredClone(snap.docs)};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(_){}};
  const subs=[];const notify=()=>subs.forEach(f=>f());
  const mk=(id,d)=>({id,exists:!!d,data:()=>d,metadata:{}});
  const coll=(c)=>Object.entries(st.docs).filter(([p])=>p.startsWith(c+"/")&&p.split("/").length===2).map(([p,d])=>mk(p.split("/")[1],d));
  const ref=(path)=>({get:async()=>mk(path.split("/").pop(),st.docs[path]),onSnapshot:(n)=>{const f=()=>n(mk(path.split("/").pop(),st.docs[path]));subs.push(f);setTimeout(f,0);return()=>{}},
    update:async(data)=>{st.docs[path]={...(st.docs[path]||{}),...data};persist();notify()},
    set:async(data)=>{st.docs[path]=data;persist();notify()},
    delete:async()=>{delete st.docs[path];persist();notify()}});
  return{doc:ref,collection:(c)=>({onSnapshot:(n)=>{const f=()=>n({docs:coll(c)});subs.push(f);setTimeout(f,0);return()=>{}},doc:(id)=>ref(c+"/"+id)})};
}

  $("#applyGo").onclick=()=>{rows.forEach(r=>{const patch={};if(r.ideas.length)patch.ideas=mergeIdeas(r.p.ideas,r.ideas);
      if(r.add.length){const wps=structuredClone(r.p.waypoints||[]);let wi=wps.findIndex(x=>!wpDone(x));if(wi<0){wps.push({title:"Next",tasks:[]});wi=wps.length-1}r.add.forEach(t=>wps[wi].tasks.push({t,done:false}));patch.waypoints=wps}
      save(r.p.id,patch)});
    toast("Ideas added");closeSheet();clear();setTimeout(()=>{if(route().v==="home")renderHome()},300)};
}
/* ---------- return links from Claude: #apply=<base64 json> ---------- */
function readApply(){const m=location.hash.match(/^#apply=([A-Za-z0-9_\-]+)/);if(!m)return null;
  try{let s=m[1].replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const j=JSON.parse(decodeURIComponent(escape(atob(s))));return j&&(typeof j.pid==="string"||Array.isArray(j.batch))?j:null}catch(_){return {bad:true}}}
function maybeApply(){
  const a=readApply();if(!a||!S.loaded||$("#applySheet"))return;
  if(a.bad){toast("That update link looks damaged. Ask Claude for a fresh one.");history.replaceState(null,"",location.pathname+"#home");return}
  if(Array.isArray(a.batch))return applyBatch(a.batch);
  const p=S.projects[a.pid];if(!p){toast("That update is for a project this toolbox doesn't have.");history.replaceState(null,"",location.pathname+"#home");return}
  const done=(Array.isArray(a.done)?a.done:[]).filter(x=>Array.isArray(x)&&p.waypoints&&p.waypoints[x[0]]&&p.waypoints[x[0]].tasks[x[1]]);
  const adds=(Array.isArray(a.add)?a.add:[]).map(x=>String(Array.isArray(x)?x[0]:x).slice(0,200)).filter(Boolean).slice(0,10);
  const left=typeof a.leftOff==="string"?a.leftOff.slice(0,1200):"";
  const ideas=cleanIdeas(a.ideas);
  $("#sheet").innerHTML=`<div class="sheet-scrim" id="shScrim"></div><section class="sheet area-${p.area}" id="applySheet" role="dialog" aria-label="Update from Claude">
    <div class="sh-top"><div class="eyebrow2">Update from Claude · ${esc(p.name)}</div><button class="btn small" id="shClose">Cancel</button></div>
    <div class="applyc">${done.length?`<b>Tick off</b><ul>${done.map(([w,t])=>`<li>${esc(p.waypoints[w].tasks[t].t)}</li>`).join("")}</ul>`:""}
    ${adds.length?`<b>Add tasks</b><ul>${adds.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
    ${left?`<b>Where I left off</b><p style="margin:4px 0 0">${esc(left)}</p>`:""}
    ${ideas.length?`<b>💡 New ideas</b><ul>${ideas.map(i=>`<li>${esc(i.t)}</li>`).join("")}</ul>`:""}</div>
    <div class="sh-acts"><button class="btn primary" id="applyGo">Apply</button></div></section>`;
  const clear=()=>history.replaceState(null,"",location.pathname+"#home");
  $("#shScrim").onclick=()=>{closeSheet();clear()};$("#shClose").onclick=()=>{closeSheet();clear()};
  $("#applyGo").onclick=()=>{const wps=structuredClone(p.waypoints||[]);const now=new Date().toISOString();
    done.forEach(([w,t])=>{wps[w].tasks[t].done=true;wps[w].tasks[t].doneAt=now});
    if(adds.length){let wi=wps.findIndex(x=>!wpDone(x));if(wi<0){wps.push({title:"Next",tasks:[]});wi=wps.length-1}adds.forEach(t=>wps[wi].tasks.push({t,done:false}))}
    const patch={waypoints:wps};if(left)patch.leftOff=left;if(ideas.length)patch.ideas=mergeIdeas(p.ideas,ideas);
    save(p.id,patch).then(()=>toast("Toolbox updated"));closeSheet();clear();setTimeout(()=>openP(p.id),50)};
}

/* ---------- full-screen app viewer: your own apps open inside the Toolbox, no browser bar ---------- */
const VIEW_HOSTS=/^https:\/\/(natesteele888\.github\.io|[a-z0-9-]+\.web\.app|[a-z0-9-]+\.firebaseapp\.com)\//i;
function canView(u){return VIEW_HOSTS.test(u)&&!/[?&]install\b/.test(u)&&!/\/apps\/toolbox\//.test(u)}
function openViewer(url){
  closeViewer(true);
  const v=document.createElement("div");v.id="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-label","App");
  v.innerHTML=`<div class="vload">Opening…</div><iframe allow="fullscreen; clipboard-read; clipboard-write; geolocation; camera; microphone; autoplay; web-share" referrerpolicy="no-referrer"></iframe>
    <div class="vbar"><a href="${esc(url)}" target="_blank" rel="noopener" data-external="1" aria-label="Open outside the Toolbox">↗</a><button type="button" aria-label="Close app">✕</button></div>`;
  v.querySelector("iframe").src=url;v.querySelector("iframe").onload=()=>{const l=v.querySelector(".vload");if(l)l.remove()};
  v.querySelector("button").onclick=()=>history.back();
  document.body.appendChild(v);document.body.style.overflow="hidden";
  history.pushState({viewer:1},"");
}
function closeViewer(silent){const v=$("#viewer");if(v){v.remove();document.body.style.overflow=""}}
window.addEventListener("popstate",()=>closeViewer());
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href]");if(!a||a.dataset.external||e.ctrlKey||e.metaKey||e.shiftKey)return;
  if(a.closest("#viewer"))return;
  if(canView(a.href)){e.preventDefault();e.stopPropagation();closeSheet&&closeSheet();openViewer(a.href)}
},true);
window.addEventListener("hashchange",maybeApply);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
