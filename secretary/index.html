function openTranscriptSorter(tab = 'open', limit = 120){
  const segs = phoneSegs().sort((a, b) => Date.parse(a.wall) - Date.parse(b.wall));
  const open = segs.filter(s => !s.agendaId && s.how !== 'out');
  const howLabel = { words: 'by words', time: 'by topic tap', follows: 'follows the one before', manual: 'you chose', unsorted: '', out: 'left out' };
  const list = tab === 'open' ? open : segs;
  const counts = {}; segs.forEach(s => { if (s.agendaId) counts[s.agendaId] = (counts[s.agendaId] || 0) + 1; });
  const opts = sel => `<option value="">${sel === '' ? 'Needs a topic' : '— Needs a topic —'}</option><option value="__out"${sel === '__out' ? ' selected' : ''}>Leave out</option>` + M.agenda.map((a, i) => `<option value="${a.id}"${a.id === sel ? ' selected' : ''}>${i + 1}. ${esc(a.title)}</option>`).join('') + `<option value="__new">+ New topic…</option>`;
  openModal(`<h3>Sort the phone transcript</h3>
    <p style="color:var(--text-2);margin:6px 0 10px;font-size:14px">${segs.length} passages · <b>${open.length}</b> need a topic. Change any topic below; your choices stick, even when you re-sort.</p>
    <div class="row" style="gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn sm ${tab === 'open' ? 'primary' : 'ghost'}" data-tab="open">Needs a topic (${open.length})</button>
      <button class="btn sm ${tab === 'all' ? 'primary' : 'ghost'}" data-tab="all">All passages (${segs.length})</button>
      <span style="flex:1"></span>
      <button class="btn sm ghost" id="ptResort" title="Run the sorting again, for example after adding agenda text">Re-sort</button>
      <button class="btn sm danger" id="ptRemove">Remove import</button>
    </div>
    ${tab === 'all' ? `<p style="font-size:12px;color:var(--text-3);margin:0 0 8px">${M.agenda.filter(a => counts[a.id]).map(a => `${esc(a.title)} ${counts[a.id]}`).join(' · ')}</p>` : ''}
    <div class="ptlist">${list.length ? list.slice(0, limit).map(s => `<div class="ptrow${s.agendaId ? '' : ' open'}">
        <div class="ptm"><b>${esc(fmtWall(s.wall))}</b>${s.speaker ? ' · ' + esc(s.speaker) : ''}${howLabel[s.how] ? ' · ' + howLabel[s.how] : ''}</div>
        <div class="ptt">${esc(s.speaker && s.text.startsWith(s.speaker + ': ') ? s.text.slice(s.speaker.length + 2) : s.text)}</div>
        <select data-seg="${segs.indexOf(s)}">${opts(s.how === 'out' ? '__out' : (s.agendaId || ''))}</select>
      </div>`).join('') : '<p class="ph" style="margin:0">Nothing waiting. Every passage has a topic.</p>'}
      ${list.length > limit ? `<button class="btn sm ghost" id="ptMore" style="margin-top:8px">Show ${Math.min(120, list.length - limit)} more</button>` : ''}
    </div>
    <div class="foot"><button class="btn primary" id="ptDone">Done</button></div>`);
  $('#modalRoot .modal').classList.add('wide');
  $('#modalRoot').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openTranscriptSorter(b.dataset.tab));
  const apply = (s, val) => {
    if (val === '__out') { s.agendaId = null; s.how = 'out'; }
    else { s.agendaId = val || null; s.how = val ? 'manual' : 'unsorted'; }
  };
  $('#modalRoot').querySelectorAll('[data-seg]').forEach(sel => sel.onchange = () => {
    const i = +sel.dataset.seg, s = segs[i], row = sel.closest('.ptrow');
    if (sel.value === '__new') {   // a topic that wasn't on the agenda (it goes in before Adjournment)
      sel.insertAdjacentHTML('afterend', `<div class="row" style="gap:6px;grid-column:2"><input type="text" class="ptnew" placeholder="New topic name" style="flex:1;min-width:0;padding:5px 7px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);color:var(--text)"><button class="btn sm" type="button">Add</button></div>`);
      sel.classList.add('hidden'); const box = row.querySelector('.ptnew'); box.focus();
      const add = () => { const t = box.value.trim(); if (!t) return;
        const a = { id: uid(), title: t, startT: null, notes: '' }; const end = M.agenda.findIndex(x => /adjourn/i.test(x.title));
        M.agenda.splice(end >= 0 ? end : M.agenda.length, 0, a); apply(s, a.id); scheduleSave(); openTranscriptSorter(tab, limit); toast('Added “' + t + '” to the agenda.'); };
      row.querySelector('.ptnew + button').onclick = add; box.onkeydown = e => { if (e.key === 'Enter') add(); };
      return;
    }
    const before = s.agendaId, beforeHow = s.how;
    apply(s, sel.value);
    row.classList.toggle('open', !s.agendaId);
    row.querySelector('.ptrun')?.remove();
    // the rest of the same stretch probably belongs with it too: offer to move those in one go
    if (beforeHow !== 'manual' && sel.value && sel.value !== before) {
      let j = i + 1; while (j < segs.length && segs[j].agendaId === before && segs[j].how !== 'manual' && segs[j].how !== 'out') j++;
      const run = segs.slice(i + 1, j);
      if (run.length) {
        row.insertAdjacentHTML('beforeend', `<button class="btn sm ghost ptrun" type="button" style="grid-column:1/-1;justify-self:start">Move the next ${run.length} passage${run.length > 1 ? 's' : ''} from this stretch too</button>`);
        row.querySelector('.ptrun').onclick = () => { run.forEach(r => apply(r, sel.value)); scheduleSave(); openTranscriptSorter(tab, limit); toast(`Moved ${run.length + 1} passages.`); };
      }
    }
    scheduleSave();
  });
  if ($('#ptMore')) $('#ptMore').onclick = () => openTranscriptSorter(tab, limit + 120);
  $('#ptResort').onclick = async () => { ptSort(segs); await saveNow(); toast('Sorted again. Your own choices were kept.'); openTranscriptSorter(tab); };
  $('#ptRemove').onclick = () => confirmModal('Remove the phone transcript?', 'Every imported passage comes out of this meeting. Your notes, captures and laptop transcript stay.', 'Remove', async () => {
    M.segments = M.segments.filter(s => s.src !== 'phone'); M.imports = []; await saveNow(); closeModal(); if (view === 'review') renderReview(); toast('Phone transcript removed.');
  });
  $('#ptDone').onclick = () => { saveNow(); closeModal(); if (view === 'review') renderReview(); };
}

/* =====================================================================
   CLOUD SYNC — phone + laptop through your claude.ai sign-in
   Opened from its claude.ai link, this page keeps meetings and settings in
   the artifact's private per-person store (data/users/<your id>/). Nobody
   else who can open the link can read that subtree, and nothing is on
   GitHub or a public page. Opened as a file (file://) none of this runs and
   the app works exactly as before, saving only in that browser.
   What syncs: everything in a meeting except the audio. Audio stays in the
   browser that recorded it (use Save a backup for it).
   Rules: newest wins when only one device changed a meeting. If both
   changed it, nothing is thrown away: the other device's version keeps the
   meeting and this device's edits are saved as a separate copy. A meeting
   being recorded belongs to the device recording it; other devices follow
   along read-only until it ends (or "Take over here").
   ===================================================================== */
const Cloud = {
  on: false, state: 'off', db: null, uid: null, lastSync: 0, err: '',
  metas: new Map(),      // meeting id -> latest meta doc body
  base: {},              // meeting id -> {rev, updated} this device last synced
  sent: new Map(),       // meeting id -> chunk strings known to be in the store
  pending: new Set(), pushTimer: 0, syncTimer: 0, chain: Promise.resolve(), unsub: null,
};
const DEVICE = { id: '', name: /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'phone' : 'laptop' };
const CLOUD_CHUNK = 90000;

async function initDevice(){
  try { DEVICE.id = await DB.get('kv', 'deviceId'); } catch(e){}
  if (!DEVICE.id) { DEVICE.id = 'd' + uid(); try { await DB.put('kv', DEVICE.id, 'deviceId'); } catch(e){} }
  try { Cloud.base = (await DB.get('kv', 'cloudBase')) || {}; } catch(e){ Cloud.base = {}; }
}
const saveBase = () => DB.put('kv', structuredClone(Cloud.base), 'cloudBase').catch(e => console.warn(e));
function cloudHash(s){ let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + ':' + s.length; }
function cloudChunks(text){
  const out = [], enc = new TextEncoder();
  const put = p => { if (p.length > 1 && enc.encode(JSON.stringify(p)).length > 240000) { let h = p.length >> 1; if (/[\udc00-\udfff]/.test(p[h])) h--; put(p.slice(0, h)); put(p.slice(h)); } else out.push(p); };
  for (let i = 0; i < text.length; ) { let j = Math.min(text.length, i + CLOUD_CHUNK); if (j < text.length && /[\udc00-\udfff]/.test(text[j])) j--; put(text.slice(i, j)); i = j; }
  return out.length ? out : [''];
}
const cloudColl = () => Cloud.backend === 'firebase'
  ? Cloud.db.collection('ms_users').doc(Cloud.uid).collection('items')
  : Cloud.db.collection('data/users/' + Cloud.uid);
const isDirty = m => !Cloud.base[m.id] || Cloud.base[m.id].updated !== m.updated;
const liveHere = m => m.status === 'live' && (!m.liveDevice || m.liveDevice === DEVICE.id);
const liveElsewhere = m => m && m.status === 'live' && m.liveDevice && m.liveDevice !== DEVICE.id;
function cloudQueue(fn){ const p = Cloud.chain.then(fn, fn); Cloud.chain = p.catch(() => {}); return p; }
async function retryOnce(fn){ try { return await fn(); } catch(e){ if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); return fn(); } throw e; } }

  return ['app', 'auth', 'firestore'].reduce((p, n) => p.then(() => new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'https://www.gstatic.com/firebasejs/11.6.0/firebase-' + n + '-compat.js'; el.onload = res; el.onerror = () => rej(new Error('offline')); document.head.appendChild(el); })), Promise.resolve());

function cloudStop(){ if (Cloud.unsub) { try { Cloud.unsub(); } catch(e){} } Cloud.unsub = null; Cloud.on = false; Cloud.uid = null; Cloud.email = ''; }
async function initFirebaseCloud(){
  Cloud.backend = 'firebase'; Cloud.state = 'connecting'; drawSyncBar();

function cloudDenied(){

}
async function initCloud(){
  if (!(window.claude && typeof window.claude.use === 'function')) {
    if (location.protocol === 'https:' || /^(localhost|127\.)/.test(location.hostname)) return initFirebaseCloud();
    Cloud.state = 'file'; drawSyncBar(); return;
  }
  Cloud.backend = 'claude'; Cloud.state = 'connecting'; drawSyncBar();

// one live listener on the meeting list; each change re-runs the (idempotent) sync
function cloudListen(){
  if (!Cloud.on || Cloud.unsub) return;
  Cloud.unsub = cloudColl().where('kind', '==', 'meta').onSnapshot(snap => {
    snap.docs.forEach(d => Cloud.metas.set(d.data().id, d.data()));
    clearTimeout(Cloud.syncTimer); Cloud.syncTimer = setTimeout(() => cloudSyncAll(true), 1500);
  }, e => { Cloud.unsub = null; if (e && e.code === 'permission-denied') { cloudDenied(); return; } Cloud.err = (e && e.code) || 'error'; Cloud.state = 'error'; drawSyncBar(); });
}
function cloudSyncAll(fromListener){
  if (Cloud.on && !Cloud.unsub && !fromListener) setTimeout(cloudListen, 0);
  if (!Cloud.on) return Promise.resolve();
  return cloudQueue(async () => {
    try {
      if (!fromListener) { const snap = await retryOnce(() => cloudColl().where('kind', '==', 'meta').get()); snap.docs.forEach(d => Cloud.metas.set(d.data().id, d.data())); }
      const locals = await DB.all('meetings');
      const ids = new Set([...locals.map(m => m.id), ...Cloud.metas.keys()]);
      let changed = false;
      for (const id of ids) changed = (await cloudReconcile(id, locals.find(m => m.id === id), Cloud.metas.get(id))) || changed;
      await cloudSyncSettings();
      Cloud.lastSync = Date.now(); Cloud.state = 'ok'; Cloud.err = '';
      if (changed) afterCloudChange();
    } catch(e){ console.warn(e); if (e && e.code === 'permission-denied') { cloudDenied(); return; } Cloud.state = 'error'; Cloud.err = (e && e.code) || 'error'; if (window.nateHealth) nateHealth.note('sync', String(Cloud.err)); if (e && e.code === 'quota_exceeded') toast('Your synced space is full — delete an old meeting to keep syncing.', 6000); }
    drawSyncBar();
  });
}

// returns true when this device's copy changed
async function cloudReconcile(id, l, c){
  const base = Cloud.base[id];
  if (l && !c) { await cloudPush(l); return false; }
  if (!l && c) { if (c.deleted) return false; return !!(await cloudPull(c)); }
  if (c.deleted) {
    if (base && base.rev === c.rev) return false;
    if (isDirty(l) && base) { await cloudPush(l); return false; }   // edited here after the delete elsewhere: keep it
    await DB.del('meetings', id); await DB.delAudio(id); delete Cloud.base[id]; saveBase();
    if (M && M.id === id && !Engine.running) { M = null; if (view !== 'home') go('home'); toast('That meeting was deleted on your other device.'); }
    return true;
  }
  if (base && c.rev === base.rev) { if (isDirty(l)) await cloudPush(l); return false; }
  // the store has a version this device hasn't seen
  if (!isDirty(l)) { if (liveHere(l) && Engine.running) { await cloudPush(l); return false; } return !!(await cloudPull(c)); }
  if (liveHere(l)) { await cloudPush(l); return false; }   // the recording device wins its own meeting
  // both sides changed: keep the other device's version, save ours as a copy
  const copy = structuredClone(l); copy.id = uid(); copy.type = (copy.type || 'Meeting') + ` (copy edited on this ${DEVICE.name})`; copy.updated = new Date().toISOString();
  await DB.put('meetings', copy);
  const pulled = await cloudPull(c);
  if (!pulled) return false;
  await cloudPush(copy);
  toast(`This meeting was also changed on your other device. Both versions are kept: this ${DEVICE.name}'s edits are in a copy.`, 7000);
  return true;
}

async function cloudPush(m){
  if (!Cloud.on) return;
  const text = JSON.stringify(m), parts = cloudChunks(text), rev = uid(), coll = cloudColl();
  const prev = Cloud.sent.get(m.id) || [], old = Cloud.metas.get(m.id);
  for (let i = 0; i < parts.length; i++) if (prev[i] !== parts[i]) await retryOnce(() => coll.doc(`c_${m.id}_${i}`).set({ kind: 'chunk', mid: m.id, i, s: parts[i] }));
  const meta = { kind: 'meta', id: m.id, rev, hash: cloudHash(text), n: parts.length, updated: m.updated || '', deleted: false,
    date: m.date || '', type: m.type || '', status: m.status || '', liveDevice: m.liveDevice || '', liveDeviceName: m.liveDeviceName || '',
    by: DEVICE.id, byName: DEVICE.name, at: new Date().toISOString(),
    counts: { agenda: (m.agenda || []).length, items: (m.items || []).length, segments: (m.segments || []).length } };
  await retryOnce(() => coll.doc('m_' + m.id).set(meta));
  for (let i = parts.length; i < Math.max(prev.length, (old && old.n) || 0); i++) await coll.doc(`c_${m.id}_${i}`).delete().catch(() => {});
  Cloud.sent.set(m.id, parts); Cloud.metas.set(m.id, meta);
  Cloud.base[m.id] = { rev, updated: m.updated }; saveBase();
}

async function cloudPull(c, tries = 3){
  const coll = cloudColl(), parts = [];
  for (let i = 0; i < c.n; i++) { const d = await retryOnce(() => coll.doc(`c_${c.id}_${i}`).get()); parts.push(d.exists ? String(d.data().s ?? '') : ''); }
  const text = parts.join('');
  if (cloudHash(text) !== c.hash) {   // the other device is mid-save; its next meta will bring us back here
    if (tries > 1) { await new Promise(r => setTimeout(r, 2500)); const fresh = await coll.doc('m_' + c.id).get(); if (fresh.exists) return cloudPull(fresh.data(), tries - 1); }
    return null;
  }
  const m = JSON.parse(text);
  if (M && M.id === m.id && (Engine.running || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName))) return null;   // don't swap a meeting out from under the person typing; next sync gets it
  await DB.put('meetings', m);
  Cloud.sent.set(m.id, parts); Cloud.base[m.id] = { rev: c.rev, updated: m.updated }; saveBase();
  if (M && M.id === m.id) M = m;
  return m;
}

async function cloudDelete(id){
  if (!Cloud.on) return;
  await cloudQueue(async () => {
    const old = Cloud.metas.get(id), rev = uid(), coll = cloudColl();
    const meta = { kind: 'meta', id, rev, deleted: true, n: 0, updated: new Date().toISOString(), by: DEVICE.id, byName: DEVICE.name, at: new Date().toISOString() };
    await retryOnce(() => coll.doc('m_' + id).set(meta));
    for (let i = 0; i < ((old && old.n) || 0); i++) await coll.doc(`c_${id}_${i}`).delete().catch(() => {});
    Cloud.metas.set(id, meta); Cloud.sent.delete(id); Cloud.base[id] = { rev, updated: meta.updated }; saveBase();
  }).catch(e => { console.warn(e); toast('Deleted here, but the other device may still show it until the next sync.', 5000); });
}

// settings sync (the email bridge's key and address stay on this device only)
const LOCAL_ONLY_SETTINGS = ['minutesBridgeEndpoint', 'minutesBridgeKey', 'onDevice'];
async function cloudSyncSettings(){
  const ref = cloudColl().doc('settings'), d = await retryOnce(() => ref.get()), c = d.exists ? d.data() : null;
  const mine = SETTINGS._updated || '';
  if (c && c.updated && c.updated > mine) {
    const s = JSON.parse(c.json || '{}'); LOCAL_ONLY_SETTINGS.forEach(k => { delete s[k]; if (SETTINGS[k] !== undefined) s[k] = SETTINGS[k]; });
    SETTINGS = Object.assign(structuredClone(DEFAULT_SETTINGS), s, { _updated: c.updated });
    await DB.put('kv', structuredClone(SETTINGS), 'settings');
  } else if (!c || mine > (c.updated || '')) {
    const s = structuredClone(SETTINGS); LOCAL_ONLY_SETTINGS.forEach(k => delete s[k]);
    if (!s._updated) { s._updated = SETTINGS._updated = new Date().toISOString(); await DB.put('kv', structuredClone(SETTINGS), 'settings'); }
    await retryOnce(() => ref.set({ kind: 'settings', updated: s._updated, json: JSON.stringify(s) }));
  }
}

function cloudSchedulePush(id){
  if (!Cloud.on || !id) return;
  Cloud.pending.add(id);
  clearTimeout(Cloud.pushTimer);
  Cloud.pushTimer = setTimeout(cloudFlush, Engine.running ? 20000 : 3000);
}
function cloudFlush(){
  const ids = [...Cloud.pending]; Cloud.pending.clear();
  if (!ids.length) return Promise.resolve();
  Cloud.state = 'syncing'; drawSyncBar();
  return cloudQueue(async () => {
    try {
      for (const id of ids) {
        const l = await DB.get('meetings', id); if (!l) continue;
        const fresh = await retryOnce(() => cloudColl().doc('m_' + id).get());
        if (fresh.exists) Cloud.metas.set(id, fresh.data());
        if (await cloudReconcile(id, l, fresh.exists ? fresh.data() : undefined)) afterCloudChange();
      }
      Cloud.lastSync = Date.now(); Cloud.state = 'ok'; Cloud.err = '';
      if (M && ids.includes(M.id)) setTopStatus('Saved · synced');
    } catch(e){ console.warn(e); if (e && e.code === 'permission-denied') { cloudDenied(); return; } Cloud.state = 'error'; Cloud.err = (e && e.code) || 'error'; ids.forEach(i => Cloud.pending.add(i)); clearTimeout(Cloud.pushTimer); Cloud.pushTimer = setTimeout(cloudFlush, 30000); }
    drawSyncBar();
  });
}
window.addEventListener('online', () => cloudSyncAll());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.on) cloudSyncAll(); else if (document.visibilityState === 'hidden' && Cloud.pending.size) cloudFlush(); });

function afterCloudChange(){
  if (view === 'home') renderHome();
  else if (view === 'follow') renderFollow();
  else if (view === 'live' && M && liveElsewhere(M) && !Engine.running) { go('follow'); toast('Your other device took over this meeting.', 5000); }
  else if (M && (view === 'setup' || view === 'review') && !Engine.running) { const y = window.scrollY; go(view); window.scrollTo(0, y); toast('Updated from your other device.'); }
}

function syncText(){
  const t = Cloud.lastSync ? new Date(Cloud.lastSync).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  switch (Cloud.state) {
    case 'file': return { cls: '', html: `Saved only in this browser. To have these meetings on your phone too, open the app from its claude.ai link and use <b>Import backup</b> there (or <b>Export all meetings</b> here first).` };
    case 'signedout': return Cloud.backend === 'firebase'
      ? { cls: 'warn', html: `Sign in with Google to see your meetings on your phone and laptop. Until then they're saved only on this ${DEVICE.name}.`, btn: 'signin' }
      : { cls: 'warn', html: `Sign in to claude.ai to sync your meetings between devices. Until then they're saved only in this browser.` };
    case 'offline': return { cls: 'warn', html: `Offline. Meetings are saved on this ${DEVICE.name} and sync when you're back online.` };
    case 'denied': return { cls: 'warn', html: `That Google account can't open these meetings. They're private to the owner.`, btn: 'signin' };
    case 'connecting': return { cls: '', html: `Connecting to your account…` };
    case 'syncing': return { cls: '', html: `Syncing with your account…` };
    case 'error': return { cls: 'warn', html: `Couldn't reach your account just now${t ? ` (last synced ${t})` : ''}. Changes are saved here and sync when it's back.` };
    case 'ok': return { cls: 'ok', html: `Synced to your ${Cloud.backend === 'firebase' ? 'Google' : 'Claude'} account, private to you${t ? ` · last synced ${t}` : ''}. Audio stays on the device that recorded it.`, btn: Cloud.backend === 'firebase' ? 'signout' : '' };
    default: return { cls: '', html: '' };
  }
}
// Sync now: run a full sync, then say plainly what came of it (a quiet sync looked like nothing happened)
async function syncNowPressed(){
  Cloud.state = 'syncing'; drawSyncBar();
  const r = await Promise.race([cloudSyncAll().then(() => 'done'), new Promise(res => setTimeout(() => res('slow'), 20000))]);
  if (r === 'slow') { toast('Still trying to reach your Google account. Check this ' + DEVICE.name + '’s connection. It keeps trying by itself.', 7000); if (window.nateHealth) nateHealth.note('sync', 'Sync now took over 20 seconds'); return; }
  if (Cloud.state === 'ok') {
    const n = [...Cloud.metas.values()].filter(c => c && !c.deleted).length, here = (await DB.all('meetings')).length;
    toast(n ? `Synced. ${n} meeting${n > 1 ? 's' : ''} in your Google account, ${here} on this ${DEVICE.name}.`

    if (view === 'home') renderHome();

}
function drawSyncBar(){
  const el = document.getElementById('syncBar'); if (!el) return;
  const s = syncText();
  el.className = 'syncbar ' + s.cls;
  el.innerHTML = `<span>${s.html}</span><span class="row" style="gap:6px">${s.btn === 'signin' ? `<button class="btn sm primary" id="btnSignIn" type="button">Sign in with Google</button>` : ''}${Cloud.on ? `<button class="btn sm ghost" id="btnSyncNow" type="button">Sync now</button>` : ''}${s.btn === 'signout' ? `<button class="btn sm ghost" id="btnSignOut" type="button" title="${esc(Cloud.email)}">Sign out</button>` : ''}</span>`;
  const b = document.getElementById('btnSyncNow'); if (b) b.onclick = syncNowPressed;
  const si = document.getElementById('btnSignIn'); if (si) si.onclick = cloudSignIn;
  const so = document.getElementById('btnSignOut'); if (so) so.onclick = () => confirmModal('Sign out on this device?', `Your meetings stay on this ${DEVICE.name}, but stop syncing until you sign in again.`, 'Sign out', cloudSignOut);
}

async function exportAllMeetings(){
  const all = await DB.all('meetings');
  if (!all.length) { toast('No meetings to export yet.'); return; }
  await download(`lybs-meetings-${todayISO()}-all.json`, JSON.stringify({ kind: 'lybs-meetings', exportedAt: new Date().toISOString(), meetings: all }, null, 1), 'application/json');
  toast(`Exported ${all.length} meeting${all.length > 1 ? 's' : ''} (without audio). On your other device, open this app and use Import backup.`, 6000);
}
async function importMeetings(data){
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.meetings)) ? data.meetings : [data];
  let added = 0, same = 0;
  for (const m of list) {
    if (!m || !m.id || !Array.isArray(m.agenda)) throw new Error('not a meeting backup');
    const existing = await DB.get('meetings', m.id);
    if (existing && (existing.updated || '') >= (m.updated || '')) { same++; continue; }
    if (m.status === 'live') { m.status = 'ended'; delete m.liveDevice; delete m.liveDeviceName; }
    await DB.put('meetings', m); added++; cloudSchedulePush(m.id);
  }
  // A fresh install has no board list yet (it isn't kept in the code): take it from the newest meeting brought in.
  const newest = list.filter(m => m && Array.isArray(m.roster) && m.roster.length).sort((a, b) => (b.updated || '').localeCompare(a.updated || ''))[0];
  if (newest && !(SETTINGS.roster || []).length) {
    SETTINGS.roster = newest.roster.map(p => ({ name: p.name, role: p.role || '' }));
    if (!SETTINGS.presiding && newest.presiding) SETTINGS.presiding = newest.presiding;
    if (!SETTINGS.secretary && newest.recorder) SETTINGS.secretary = newest.recorder;
    if (!SETTINGS.location && newest.location) SETTINGS.location = newest.location;
    await saveSettings();
  }
  return { added, same };
}

    <div class="card" style="padding:12px 16px;margin-bottom:14px"><span style="font:500 11px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--text-3)">Now on</span>

    </div>
    ${lastSegs.length ? `<h2 style="margin-top:18px">Latest transcript</h2><div class="card" style="padding:10px 16px">${lastSegs.map(s => `<p style="margin:0 0 4px"><span style="color:var(--text-3)">${fmtClock(s.t)}</span> ${esc(s.text)}</p>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:18px;gap:8px"><button class="btn" id="fBack">All meetings</button><button class="btn ghost" id="fTake">Take over on this ${DEVICE.name}</button></div>`;

    M.liveDevice = DEVICE.id; M.liveDeviceName = DEVICE.name; view = 'live'; await saveNow(); go('live'); toast('Press Resume to keep recording here.', 4000);
  });
}


/* =====================================================================
   FINGERPRINT LOCK (optional, this device only)
   Turned on from the home screen. Opening the app then asks for the phone's own fingerprint or
   screen lock (a WebAuthn check on this device; nothing is sent anywhere). The meetings themselves are
   protected by Google sign-in and the database rules; this keeps someone holding the unlocked phone out.
   ===================================================================== */
const LOCK_KEY = 'ms.lock';
const lockId = () => { try { return localStorage.getItem(LOCK_KEY) || ''; } catch(e){ return ''; } };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function lockSupported(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } }
async function lockTurnOn(){
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Meeting Secretary' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'meeting-secretary', displayName: 'Meeting Secretary' },
      challenge: crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
    localStorage.setItem(LOCK_KEY, b64(cred.rawId));
    toast(`Fingerprint lock is on for this ${DEVICE.name}.`);
  } catch(e){ toast('The fingerprint lock wasn’t turned on.'); }
  drawLockRow();
}
async function lockVerify(){
  await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: 'public-key', id: unb64(lockId()) }], userVerification: 'required', timeout: 60000 } });
}
const unlock = () => document.documentElement.classList.remove('locked');
let lockBusy = false;
async function tryUnlock(){
  if (lockBusy) return; lockBusy = true;
  try { await lockVerify(); unlock(); }
  catch(e){ $('#lockMsg').textContent = 'That didn’t unlock it. Tap Unlock to try again.'; }
  lockBusy = false;
}
$('#lockGo').onclick = tryUnlock;
$('#lockGoogle').onclick = async () => {
  try { await fbLoad(); const fb = window.firebase; if (!fb.apps.length) fb.initializeApp(FB_CONFIG);
    const p = new fb.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    const r = await fb.auth().signInWithPopup(p);
    if (r && r.user) { await Cloud.chain; await cloudSyncAll(); if (Cloud.state !== 'denied') unlock(); }
  } catch(e){ $('#lockMsg').textContent = 'Google sign-in didn’t finish. Try again.'; }
};
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!lockId()) return;
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000 && !Engine.running) { document.documentElement.classList.add('locked'); $('#lockMsg').textContent = 'Locked. Use your fingerprint to open it.'; }
});
function drawLockRow(){
  const el = document.getElementById('lockRow'); if (!el) return;
  lockSupported().then(ok => {
    if (!ok) { el.innerHTML = ''; return; }
    el.innerHTML = lockId()
      ? `<span>Fingerprint lock is on for this ${DEVICE.name}.</span><button class="btn sm ghost" id="lockOff" type="button">Turn off</button>`
      : `<span>Ask for your fingerprint each time this opens on this ${DEVICE.name}.</span><button class="btn sm ghost" id="lockOn" type="button">Turn on</button>`;
    const on = document.getElementById('lockOn'); if (on) on.onclick = lockTurnOn;
    const off = document.getElementById('lockOff'); if (off) off.onclick = () => confirmModal('Turn off the fingerprint lock?', `This ${DEVICE.name} will open the app without asking.`, 'Turn off', async () => { try { localStorage.removeItem(LOCK_KEY); } catch(e){} drawLockRow(); });
  });
}

   OUTPUTS
   ===================================================================== */
function guestsList(){ return M.guests.split(/[\n,]+/).map(s => s.trim()).filter(Boolean); }
function to12(hhmm){ if (!hhmm) return ''; const [h,m] = hhmm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }

function buildPlainTranscript(){
  let out = `${SETTINGS.orgName} — ${M.type}, ${fmtDateLong(M.date)}\nRaw speech-to-text. Expect misheard names and numbers.\n\n`;
  let last = null;
  const phone = phoneSegs();
  if (phone.length) {
    M.agenda.forEach(a => { const ps = phone.filter(s => s.agendaId === a.id); if (!ps.length) return; out += `\n== ${a.title} (phone recording) ==\n`; ps.forEach(s => out += `[${fmtWall(s.wall)}] ${s.text}\n`); });
    const op = phone.filter(s => !s.agendaId && s.how !== 'out'); if (op.length) { out += `\n== Not yet sorted (phone recording) ==\n`; op.forEach(s => out += `[${fmtWall(s.wall)}] ${s.text}\n`); }
    out += `\n\n---- Laptop live transcript ----\n`;
  }
  for (const s of M.segments.filter(x => x.src !== 'phone')) {
    if (s.agendaId !== last) { last = s.agendaId; out += `\n== ${agendaById(s.agendaId)?.title || 'Topic'} ==\n`; }
    out += `[${fmtTs(s.t)}] ${s.text}\n`;
  }
  return out;
}

function buildHandoff(){
  const present = attendedNames(), absent = M.roster.map(p=>p.name).filter(n => !present.includes(n));
  const L = [];
  L.push(`# LYBS board meeting — handoff for minutes`);
  L.push('');
  L.push(`> **Claude: please write the official minutes from this file.** Follow the instructions below. Everything in "Captured during the meeting" was entered by the secretary at the table and is authoritative — use it exactly (names, vote counts, amounts, dates). The transcript is raw browser speech-to-text: names and numbers in it are often misheard, so prefer the captures and secretary notes whenever they disagree.`);
  L.push('');
  L.push(`## Instructions for writing the minutes`);
  L.push(`- Match the LYBS house style from past minutes: a short heading per agenda topic, then a concise narrative of what was reported and discussed — who reported, the key facts (dollar amounts, counts, names of vendors/places), what was decided, and who owns the follow-up. Plain, factual, third person, past tense. No quotes, no filler, no "the board discussed at length".`);
  L.push(`- Motions in this format, as their own paragraph: **Motion** to … made by [mover], 2nd by [seconder]. Approved [yay]–[nay]–[abstain]. (Use "unanimously" only if nay and abstain are 0.)`);
  L.push(`- Keep the agenda order below. Skip a topic only if nothing was said and nothing captured — then omit it rather than writing "no update".`);
  L.push(`- The Agenda section lists the background text the board saw for each topic. Use it for context and the spelling of names and terms, but write the minutes from what was actually said and captured.`);
  L.push(`- End with: an **Action Items** table (task · owner · due), an **Important Dates** table (date · what), adjournment time, and "Respectfully submitted, ${M.recorder}, Secretary".`);
  L.push(`- Flagged moments are places the secretary wanted double-checked. Look closely at the transcript around that timestamp; if it's still unclear, write the minutes with a bracketed [CONFIRM: …] note instead of guessing.`);
  L.push(`- Before finishing, list anything you were unsure of (misheard names, unclear amounts, an action with no owner) so the secretary can fix it before sending.`);
  L.push(`- Deliver as a document styled like the LYBS letterhead (organization name, meeting type and date, meta row with location / called to order / adjourned / presiding).`);
  L.push('');
  L.push(`## Meeting`);
  L.push(`- Organization: ${SETTINGS.orgName}`);
  L.push(`- Meeting: ${M.type}`);
  L.push(`- Date: ${fmtDateLong(M.date)}`);
  if (M.location) L.push(`- Location: ${M.location}`);
  L.push(`- Called to order: ${to12(M.calledToOrder) || 'not recorded'}`);
  L.push(`- Adjourned: ${to12(M.adjourned) || 'not recorded'}`);
  L.push(`- Presiding: ${M.presiding}`);
  L.push(`- Recorded by: ${M.recorder}, Secretary`);
  L.push(`- Meeting length: ${fmtClock(meetingElapsed())} (audio recorded: ${fmtClock(M.activeSec || 0)})`);
  L.push('');
  L.push(`## Attendance`);
  L.push(`- Present (${present.length}): ${present.join(', ') || '—'}`);
  L.push(`- Absent (${absent.length}): ${absent.join(', ') || '—'}`);
  if (attMoves().length) L.push(`- Arrived late or left early (timed when the secretary changed attendance): ${attMoves().join('; ')}. Put these in the attendance line, e.g. "(arrived 7:31 PM)" or "(left at 8:15 PM)".`);
  if (guestsList().length) L.push(`- Guests: ${guestsList().join(', ')}`);
  L.push(`- Quorum: ${present.length >= SETTINGS.quorum ? 'met' : 'NOT met'} (${present.length} of ${M.roster.length}; quorum set to ${SETTINGS.quorum})`);
  L.push('');
  L.push(`## Board roster (for matching spoken names)`);
  M.roster.forEach(p => L.push(`- ${p.name} — ${p.role || 'Director'}`));
  L.push('');
  L.push(`## Agenda (topics in order, with the secretary's background text)`);
  M.agenda.forEach((a, i) => {
    L.push(`${i+1}. ${a.title}`);
    if ((a.detail||'').trim()) L.push(`   Background: ${a.detail.trim().replace(/\n+/g, ' / ')}`);
  });
  L.push('');
  L.push(`## Captured during the meeting (authoritative)`);
  M.agenda.forEach((a, i) => {
    const its = M.items.filter(x => x.agendaId === a.id).sort((x,y) => x.t - y.t);
    if (!its.length && !(a.notes||'').trim()) return;
    L.push(`### ${i+1}. ${a.title}`);
    if ((a.notes||'').trim()) { L.push(`Secretary notes:`); noteLines(a).forEach(ln => { const m = ln.match(NOTE_TS); L.push(`- NOTE ${m ? '[' + m[1] + '] ' : ''}${stripNoteTs(ln)}`); }); }
    its.forEach(it => {
      const ts = `[${fmtTs(it.t)}]`;
      if (it.kind === 'motion') L.push(`- MOTION ${ts} ${it.text} · Moved: ${it.mover || '?'} · 2nd: ${it.second || '?'} · Vote (yay–nay–abstain): ${voteStr(it) || 'not recorded'} · Result: ${it.result || 'Pending'}`);
      else if (it.kind === 'action') L.push(`- ACTION ${ts} ${it.text} · Owner: ${it.owner || 'unassigned'} · Due: ${it.due ? fmtDateShort(it.due) : 'none given'}`);
      else if (it.kind === 'date') L.push(`- KEY DATE ${ts} ${it.when ? fmtDateShort(it.when) : '(date not entered)'} — ${it.text}`);
      else if (it.kind === 'decision') L.push(`- DECISION ${ts} ${it.text}`);
      else if (it.kind === 'note') L.push(`- NOTE ${ts} ${it.text}`);
      else if (it.kind === 'flag') L.push(`- FLAG ${ts} ${it.auto ? it.text : 'Secretary flagged this moment' + (it.text ? ': ' + it.text : '') + (it.ctx ? ` (said just before: "${it.ctx}")` : '')}`);
    });
    L.push('');
  });
  L.push(`## Transcript by agenda topic (raw speech-to-text)`);
  M.agenda.forEach((a, i) => {
    const segs = M.segments.filter(s => s.agendaId === a.id && s.src !== 'phone'), ps = M.segments.filter(s => s.agendaId === a.id && s.src === 'phone');
    if (!segs.length && !ps.length) return;
    L.push(`### ${i+1}. ${a.title}`);
    segs.forEach(s => L.push(`[${fmtTs(s.t)}] ${s.text}`));
    if (ps.length) { L.push(`Phone recording (clock time; speaker labels from the phone):`); ps.forEach(s => L.push(`[${fmtWall(s.wall)}] ${s.text}`)); }
    L.push('');
  });
  { const op = phoneSegs().filter(s => !s.agendaId && s.how !== 'out');
    if (op.length) { L.push(`### Phone recording, not yet sorted to a topic`); op.forEach(s => L.push(`[${fmtWall(s.wall)}] ${s.text}`)); L.push(''); } }
  if (!M.segments.length) L.push(`(No live transcript was captured. If the audio file is attached, work from that; otherwise write the minutes from the captures and notes above.)`);
  return L.join('\n');
}

function motionBody(t){ const b = String(t||'').replace(/^(a\s+)?motion\s+(was\s+made\s+)?(to\s+)?/i, '').trim(); return b ? b[0].toUpperCase() + b.slice(1) : t; }
/* draft minutes — from captures only, in the elevated letterhead format */
function minutesHTML(){
  const present = attendedNames(), absent = M.roster.map(p=>p.name).filter(n => !present.includes(n));
  const allActions = M.items.filter(i => i.kind === 'action').sort((a,b) => a.t - b.t);
  const allDates = M.items.filter(i => i.kind === 'date').sort((a,b) => String(a.when).localeCompare(String(b.when)));
  const motionHTML = it => {
    const v = voteStr(it); const res = (it.result || 'Pending');
    const unan = res === 'Approved' && v && +it.nay === 0 && +it.abstain === 0;
    return `<div class="motion"><div class="mt"><span>Motion</span><span class="res ${res.toLowerCase()}">${esc(res)}${v ? ' ' + v : ''}</span></div>
      <div class="mx">${esc(motionBody(it.text))}</div>
      <div class="mv">Moved by ${esc(it.mover || '—')} · Seconded by ${esc(it.second || '—')}${unan ? ' · Unanimous' : ''}</div></div>`;
  };
  const pendingMotions = M.items.filter(i => i.kind === 'motion' && ['Pending','Tabled'].includes(i.result || 'Pending'));
  const nextTopics = (M.nextTopics || []).map(t => typeof t === 'string' ? t : (t && t.title) || '').filter(Boolean);
  let n = 0;
  const sections = M.agenda.map(a => {
    const its = M.items.filter(x => x.agendaId === a.id && !x.auto && x.kind !== 'flag').sort((x,y) => x.t - y.t);
    const notes = (a.notes || '').trim();
    if (!its.length && !notes) return '';
    n++;
    const body = [];
    if (notes) notes.split(/\n{2,}|\n/).map(p => stripNoteTs(p).trim()).filter(Boolean).forEach(p => body.push(`<p>${esc(p)}</p>`));

    its.forEach(it => {
      if (it.kind === 'motion') body.push(motionHTML(it));
      else if (it.kind === 'decision') body.push(`<p><span class="lbl">Decision</span>${esc(it.text)}</p>`);
      else if (it.kind === 'note') body.push(`<p>${esc(it.text)}</p>`);
      else if (it.kind === 'action') body.push(`<p><span class="lbl">Action</span>${esc(it.text)}${it.owner ? ' — <b>' + esc(it.owner) + '</b>' : ''}${it.due ? ', by ' + esc(fmtDateShort(it.due)) : ''}</p>`);
      else if (it.kind === 'date') body.push(`<p><span class="lbl">Date</span>${it.when ? esc(fmtDateShort(it.when)) + ' — ' : ''}${esc(it.text)}</p>`);
    });
    return `<h4><span class="no">${pad(n)}</span>${esc(a.title)}</h4>${body.join('')}`;
  }).join('');
  return `<div class="doc">
    <div class="lh"><img src="${LOGO_PRIMARY}" alt=""><div class="org">Lunenburg Youth<br>Baseball &amp; Softball<small>Board of Directors</small></div></div>
    <h3 class="ttl2" style="margin-top:28px">${esc(docTitle())}</h3>
    <div class="ttl3">${esc(M.type)}</div>
    <div class="meta">
      <div><span>Location</span><b>${esc(M.location || '—')}</b></div>
      <div><span>Called to order</span><b>${esc(to12(M.calledToOrder) || '—')}</b></div>
      <div><span>Adjourned</span><b>${esc(to12(M.adjourned) || '—')}</b></div>
      <div><span>Presiding</span><b>${esc(M.presiding || '—')}</b></div>
    </div>
    <h4><span class="no">··</span>Attendance</h4>
    <div class="att">
      <p><span class="lbl">Present (${present.length})</span>${esc(present.join(', ') || '—')}</p>
      ${absent.length ? `<p><span class="lbl">Absent (${absent.length})</span>${esc(absent.join(', '))}</p>` : ''}
      ${attMoves().length ? `<p><span class="lbl">Arrived late / left early</span>${esc(attMoves().join('; '))}</p>` : ''}
      ${guestsList().length ? `<p><span class="lbl">Guests</span>${esc(guestsList().join(', '))}</p>` : ''}
      <p><span class="lbl">Quorum</span>${present.length >= SETTINGS.quorum ? 'A quorum was present.' : 'A quorum was not present.'}</p>
    </div>
    ${sections || '<p class="ph">Nothing captured yet.</p>'}
    <p style="margin-top:22px">${M.adjourned ? `The meeting was adjourned at ${esc(to12(M.adjourned))}.` : ''}</p>
    ${allDates.length ? `<h4><span class="no">◷</span>Important Dates</h4><table><thead><tr><th style="width:30%">Date</th><th>What</th></tr></thead><tbody>${allDates.map(d => `<tr><td>${esc(d.when ? fmtDateShort(d.when) : '—')}</td><td>${esc(d.text)}</td></tr>`).join('')}</tbody></table>` : ''}
    <h4><span class="no">▸</span>Open Items</h4>
    <p><span class="lbl">Action items</span>${allActions.length ? '' : 'None.'}</p>
    ${allActions.length ? `<table><thead><tr><th style="width:44%">Task</th><th>Topic</th><th>Owner</th><th>Due</th></tr></thead><tbody>${allActions.map(a => `<tr><td>${esc(a.text)}</td><td>${esc(agendaById(a.agendaId)?.title || '—')}</td><td>${esc(a.owner || '—')}</td><td>${esc(a.due ? fmtDateShort(a.due) : '—')}</td></tr>`).join('')}</tbody></table>` : ''}
    <p style="margin-top:12px"><span class="lbl">Left pending</span>${pendingMotions.length ? '' : 'Nothing.'}</p>
    ${pendingMotions.length ? `<ul>${pendingMotions.map(m => `<li>${esc(motionBody(m.text))} <i>(${esc(m.result || 'Pending')})</i></li>`).join('')}</ul>` : ''}
    <p style="margin-top:12px"><span class="lbl">Topics for the next meeting</span>${nextTopics.length ? '' : 'None yet.'}</p>
    ${nextTopics.length ? `<ul>${nextTopics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    <div class="sig"><div>${esc(M.recorder)}<span>Secretary · Respectfully submitted</span></div><div>&nbsp;<span>Date approved by the Board</span></div></div>
    <div class="foot">Lunenburg Youth Baseball &amp; Softball</div>
  </div>`;
}

function minutesEmailDocument(){
  return `<!doctype html><html><head><meta charset="utf-8"><style>${MINUTES_EMAIL_CSS}</style></head><body>${minutesHTML()}</body></html>`;
}

async function minutesBridgePost(action, extra){
  if (!SETTINGS.minutesBridgeEndpoint || !SETTINGS.minutesBridgeKey) {
    throw new Error('Set the minutes email bridge up first, in Roster & Settings.');
  }
  const res = await fetch(SETTINGS.minutesBridgeEndpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, key: SETTINGS.minutesBridgeKey, ...extra })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'The bridge refused that.');
  return data;
}

async function createMinutes(){
  const btn = $('#eCreate');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending for review…'; }
  try {
    await saveNow();
    await minutesBridgePost('send-minutes-review', {
      html: minutesEmailDocument(),
      transcript: buildPlainTranscript(),
      subject: docTitle(),
      fileBase: fileBase()
    });
    M.minutesStage = 'review-sent';
    M.minutesSentAt = new Date().toISOString();
    await saveNow();
    renderReview();
    window.scrollTo(0,0);
    toast(`Emailed to ${reviewEmail()} for review.`, 4000);
  } catch (err) {
    toast('Could not send that — ' + err.message, 5500);
    if (btn) { btn.disabled = false; btn.textContent = 'Create minutes'; }
  }
}

async function approveMinutes(){
  const btn = $('#aApprove');
  if (btn) { btn.disabled = true; btn.textContent = 'Drafting…'; }
  try {
    await minutesBridgePost('draft-minutes-email', {
      html: minutesEmailDocument(),
      subject: docTitle(),
      fileBase: fileBase()
    });
    M.minutesStage = 'approved';
    M.approvedAt = new Date().toISOString();
    await saveNow();
    renderReview();
    window.scrollTo(0,0);
    toast('Draft created — add the board and send.', 4000);
  } catch (err) {
    toast('Could not draft that email — ' + err.message, 5500);
    if (btn) { btn.disabled = false; btn.textContent = 'Approve minutes'; }
  }
}

function renderApprove(){
  M.items = M.items.filter(x => x.text || x.kind === 'flag');
  app.innerHTML = `

      <div><div class="docwrap">${minutesHTML()}</div></div>
      <div style="position:sticky;top:84px">
        <div class="card">
          <h2>Emailed for review</h2>
          <p style="font-size:14px;color:var(--text-2);margin:0 0 14px">Sent to <b>${esc(reviewEmail())}</b>${M.minutesSentAt ? ' at ' + esc(fmtWall(M.minutesSentAt)) : ''} as a PDF, with the transcript attached. Check it there, then approve here.</p>
          <button class="btn primary big" id="aApprove" style="width:100%;justify-content:center">Approve minutes</button>

            <div class="exports" style="margin-top:10px">
              <button class="btn" id="aEdit">Make more changes</button>
              <button class="btn" id="aBackup">Save a backup${M.audio.bytes ? ' (with audio)' : ''}</button>
              ${M.audio.bytes ? '<button class="btn" id="aAudio">Download audio (' + (M.audio.bytes/1048576).toFixed(1) + ' MB)</button>' : ''}
              <button class="btn" id="aPdf">Save as PDF (local copy)</button>
              <button class="btn" id="xHand">Download handoff for Claude</button>
              <button class="btn" id="xCopy">Copy handoff to clipboard</button>
              <button class="btn ghost" id="aReopen">Reopen &amp; keep recording</button>

  $('#aApprove').onclick = approveMinutes;
  $('#aEdit').onclick = () => { M.minutesStage = 'editing'; scheduleSave(); renderReview(); window.scrollTo(0,0); };
  $('#aBackup').onclick = saveBackup;
  if ($('#aAudio')) $('#aAudio').onclick = downloadAudio;
  $('#aPdf').onclick = printMinutes;
  $('#xHand').onclick = async () => { await saveNow(); download(fileBase() + '-handoff.md', buildHandoff(), 'text/markdown'); };
  $('#xCopy').onclick = async () => { try { await navigator.clipboard.writeText(buildHandoff()); toast('Copied — paste it into Claude.'); } catch(e){ toast('Clipboard blocked — use Download instead.'); } };
  $('#aReopen').onclick = () => { M.status = 'live'; scheduleSave(); go('live'); toast('Press Resume to continue recording.'); };
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  const s = SETTINGS;
  app.innerHTML = `
    <h1>Roster &amp; Settings</h1>
    <p class="sub">These are the defaults for new meetings. Meetings already created keep the roster they started with.</p>
    <div class="grid2">
      <div class="card">
        <h2>Board of Directors</h2>
        <div id="rosterEdit" style="display:flex;flex-direction:column;gap:6px"></div>
        <button class="btn sm" id="rAdd" style="margin-top:10px">+ Add director</button>
      </div>
      <div class="card">
        <h2>Defaults</h2>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label class="f">Secretary<input type="text" id="sSec" value="${esc(s.secretary)}"></label>
          <label class="f">Usually presiding<input type="text" id="sPres" value="${esc(s.presiding)}"></label>
          <label class="f">Usual location<input type="text" id="sLoc" value="${esc(s.location)}" placeholder="e.g. Lunenburg Public Library"></label>
          <label class="f">Quorum (number of directors — check the bylaws)<input type="number" min="1" id="sQ" value="${esc(s.quorum)}"></label>
          <label class="f">Speech language<select id="sLang">${[['en-US','English (US)'],['en-GB','English (UK)'],['es-US','Spanish (US)']].map(([v,l]) => `<option value="${v}" ${v===s.lang?'selected':''}>${l}</option>`).join('')}</select></label>
          <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="sDev" ${s.onDevice?'checked':''} style="margin-top:4px"><span><b>Try on-device speech recognition</b><br><span style="color:var(--text-3)">Newer Chrome versions can transcribe without sending audio to Google. <span id="devStatus">Checking…</span></span></span></label>
        </div>
        <h2 style="margin-top:22px">Standard agenda</h2>
        <textarea id="sAg" rows="9">${esc(s.agenda.join('\n'))}</textarea>
        <p style="font-size:12px;color:var(--text-3);margin:6px 0 0">One item per line.</p>
      </div>
      <div class="card">
        <h2>Minutes email</h2>
        <p style="font-size:13px;color:var(--text-2);margin:0 0 12px">"Create minutes" uses these to email a review PDF to ${esc(reviewEmail())} and later draft the minutes email. Same bridge the dashboard uses — copy its endpoint and REVIEW_KEY from Governance → Post Review settings there.</p>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label class="f">Apps Script endpoint<input type="text" id="sMEndpoint" value="${esc(s.minutesBridgeEndpoint)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
          <label class="f">REVIEW_KEY<input type="password" id="sMKey" value="${esc(s.minutesBridgeKey)}" placeholder="the shared review key"></label>
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" id="sReset">Restore defaults</button><button class="btn primary" id="sSave">Save settings</button></div>`;
  let roster = structuredClone(s.roster);
  const draw = () => {
    $('#rosterEdit').innerHTML = roster.map((p,i) => `<div class="ag-row"><input type="text" value="${esc(p.name)}" data-i="${i}" data-k="name" placeholder="Name" style="flex:1"><input type="text" value="${esc(p.role)}" data-i="${i}" data-k="role" placeholder="Role" style="flex:1.4"><button class="icon-btn" data-rm="${i}">✕</button></div>`).join('');
    $('#rosterEdit').querySelectorAll('input').forEach(inp => inp.oninput = e => { roster[+inp.dataset.i][inp.dataset.k] = e.target.value; });
    $('#rosterEdit').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { roster.splice(+b.dataset.rm, 1); draw(); });
  };
  draw();
  $('#rAdd').onclick = () => { roster.push({ name:'', role:'Director' }); draw(); };
  $('#sReset').onclick = () => confirmModal('Restore defaults?', 'The standard agenda and meeting defaults come back. Your board list stays.', 'Restore', async () => { SETTINGS = Object.assign(structuredClone(DEFAULT_SETTINGS), { roster: SETTINGS.roster, minutesBridgeEndpoint: SETTINGS.minutesBridgeEndpoint, minutesBridgeKey: SETTINGS.minutesBridgeKey }); await saveSettings(); renderSettings(); toast('Defaults restored'); });
  $('#sSave').onclick = async () => {
    SETTINGS.roster = roster.filter(p => p.name.trim()).map(p => ({ name: p.name.trim(), role: p.role.trim() }));
    SETTINGS.secretary = $('#sSec').value.trim(); SETTINGS.presiding = $('#sPres').value.trim(); SETTINGS.location = $('#sLoc').value.trim();
    SETTINGS.quorum = Math.max(1, +$('#sQ').value || 1); SETTINGS.lang = $('#sLang').value; SETTINGS.onDevice = $('#sDev').checked;
    SETTINGS.agenda = $('#sAg').value.split('\n').map(x => x.trim()).filter(Boolean);
    SETTINGS.minutesBridgeEndpoint = $('#sMEndpoint').value.trim();
    SETTINGS.minutesBridgeKey = $('#sMKey').value.trim();
    await saveSettings(); toast('Settings saved'); go('home');
  };
  (async () => {
    const el = $('#devStatus');
    try {
      if (SR && typeof SR.available === 'function') {
        const st = await SR.available({ langs: [s.lang || 'en-US'], processLocally: true });
        el.textContent = st === 'available' ? 'Available in this browser.' : st === 'downloadable' || st === 'downloading' ? 'Supported — Chrome will download the language pack the first time.' : 'Not available for this language here.';
        if ((st === 'downloadable') && typeof SR.install === 'function') {
          el.insertAdjacentHTML('beforeend', ' <button class="btn sm" id="devInstall">Download now</button>');
          $('#devInstall').onclick = async () => { try { const ok = await SR.install({ langs:[s.lang||'en-US'], processLocally:true }); el.textContent = ok ? 'Installed.' : 'Install failed.'; } catch(e){ el.textContent = 'Install failed.'; } };
        }
      } else el.textContent = 'Not supported in this browser version — leave this off.';
    } catch(e){ el.textContent = 'Not supported in this browser version — leave this off.'; }
  })();
}

/* ---------- boot ---------- */
(async () => {
  await loadSettings();
  await initDevice();
  setTopStatus(`Saved on this ${DEVICE.name}`);
  // If a meeting was recording when the tab closed, bring it straight back.
  const all = await DB.all('meetings');
  const interrupted = all.filter(m => m.status === 'live' && !liveElsewhere(m)).sort((a,b) => b.updated.localeCompare(a.updated))[0];
  if (interrupted) { M = interrupted; go('live'); toast('This meeting was interrupted. Everything up to the last few seconds is saved — press Resume.', 6000); }
  else go('home');
  initCloud();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (lockId()) tryUnlock();
})();
</script>
