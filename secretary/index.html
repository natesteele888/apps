<style>
:root{
  --navy:#090D32; --navy-2:#11174A; --navy-3:#1A2160;
  --blue:#2E52E8; --blue-deep:#1A2CBD; --blue-soft:#6F8BFF;
  --silver:#B4BBBF; --steel:#7E8284;
  --bg:#0B1036; --panel:#121952; --panel-2:#18206A; --line:rgba(180,187,191,.18);
  --text:#EEF1F6; --text-2:#B4BBBF; --text-3:#858DA8;
  --red:#FF5A5F; --green:#38D39F; --amber:#FFC24B;
  --radius:12px;
  --head:'Anton',Impact,sans-serif; --label:'Oswald','Arial Narrow',sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--blue-soft)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--navy);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar img{width:38px;height:38px;object-fit:contain}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font:22px var(--head);letter-spacing:.5px;text-transform:uppercase}
.brand span{font:500 11px var(--label);letter-spacing:2px;color:var(--silver);text-transform:uppercase}
.topbar .spacer{flex:1}
@media (max-width:600px){.topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}.topbar img{width:30px;height:30px}.topbar .brand{flex:1 1 0;min-width:0}.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span,.topbar .spacer{display:none}.topbar .pill{margin-left:auto;font-size:10px;letter-spacing:.5px;padding:3px 8px;white-space:nowrap}.topbar .btn.sm{flex:1 1 calc(50% - 4px);justify-content:center;white-space:nowrap;min-height:34px}}
.pill{font:500 12px var(--label);letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-2)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--panel-2);padding:9px 16px;border-radius:10px;font:500 14px var(--label);letter-spacing:.8px;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--blue-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:#3d60ff}
.btn.danger{background:transparent;border-color:rgba(255,90,95,.5);color:#ffb3b5}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.big{padding:14px 26px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font:600 11px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-3)}

/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
h1{font:32px var(--head);letter-spacing:.5px;text-transform:uppercase;margin:0 0 4px}
h2{font:600 15px var(--label);letter-spacing:1.6px;text-transform:uppercase;color:var(--silver);margin:0 0 12px}
.sub{color:var(--text-2);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:5px;font:500 12px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--text-2)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--navy);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:14px var(--body);text-transform:none;letter-spacing:0;color:var(--text);width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.banner{padding:12px 14px;border-radius:10px;border:1px solid rgba(255,194,75,.4);background:rgba(255,194,75,.08);color:#ffe2a6;margin-bottom:18px;font-size:14px}
.banner.info{border-color:rgba(111,139,255,.4);background:rgba(46,82,232,.12);color:#cdd7ff}

/* ---------- home ---------- */
.hero{display:flex;gap:22px;align-items:center;margin-bottom:26px}
.hero img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(46,82,232,.35))}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-weight:600}
.mrow .t span{color:var(--text-3);font-size:13px}
.status{font:500 11px var(--label);letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.status.setup{background:rgba(180,187,191,.15);color:var(--silver)}
.status.live{background:rgba(255,90,95,.18);color:#ffb3b5}
.status.ended{background:rgba(56,211,159,.15);color:#9ef0d2}
.empty{padding:28px;text-align:center;color:var(--text-3);border:1px dashed var(--line);border-radius:12px}

/* ---------- setup ---------- */
.agenda-edit{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ag-row{display:flex;gap:6px;align-items:center}
.ag-row .num{width:24px;text-align:right;color:var(--text-3);font:500 13px var(--label)}
.ag-row input{flex:1}
.ag-detail{display:flex;gap:6px;align-items:flex-start;margin:5px 0 8px 30px}
.ag-detail .ag-new{margin:5px 0 0}
.ag-text{flex:1;width:100%;min-height:0;resize:none;overflow:hidden;font-size:12px;line-height:1.4;padding:5px 8px;color:var(--text-2)}
.ag-addtext{background:none;border:0;padding:0 2px;font:500 11px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}
.ag-addtext:hover{color:var(--blue-soft)}
.ag-new{display:inline-block;margin-right:6px;font:600 10px var(--label);letter-spacing:1px;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:rgba(255,194,75,.14);border:1px solid rgba(255,194,75,.45);color:#ffe2a6}
.feedbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.feedbar .msg{flex:1;min-width:260px}
.feedbar .msg small{display:block;margin-top:4px;color:#aebbe8;font-size:12px}
.agenda-bg{margin:0 0 8px;padding:8px 10px;border-left:3px solid var(--blue-soft);background:rgba(111,139,255,.08);border-radius:0 8px 8px 0;font-size:13px;line-height:1.45;color:var(--text-2)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:34px;display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{border-color:var(--blue-soft);color:var(--text)}
.att{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.att .who b{font-weight:600}
.att .who span{display:block;color:var(--text-3);font-size:12px;line-height:1.2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font:500 12px var(--label);letter-spacing:.8px;text-transform:uppercase;color:var(--text-3)}
.seg button.on.present{background:rgba(56,211,159,.2);color:#9ef0d2}
.seg button.on.absent{background:rgba(255,90,95,.18);color:#ffb3b5}
.quorum{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.quorum.ok{background:rgba(56,211,159,.12);color:#9ef0d2}
.quorum.no{background:rgba(255,90,95,.12);color:#ffb3b5}
.meter{height:10px;border-radius:6px;background:var(--navy);overflow:hidden;border:1px solid var(--line);flex:1;min-width:120px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--amber) 70%,var(--red));transition:width .08s}

/* ---------- live ---------- */
.live{display:grid;grid-template-columns:270px 1fr 330px;gap:16px;align-items:start}
.recbar{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--navy-2);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;flex-wrap:wrap}
.clock{font:34px var(--head);letter-spacing:1px;min-width:130px;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;background:var(--steel);flex:none}
.dot.on{background:var(--red);box-shadow:0 0 0 0 rgba(255,90,95,.7);animation:pulse 1.6s infinite}
.dot.paused{background:var(--amber)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,90,95,0)}100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}}
.clocks{display:flex;gap:22px;align-items:flex-end}
.clk span{display:block;font:500 11px var(--label);letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3)}
.clk b{font:22px var(--head);letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--text-2);font-weight:400}
.clk.main b{font-size:34px;color:var(--text)}
.clk.warn b{color:var(--amber)} .clk.over b{color:var(--red)}
.recstate{white-space:nowrap;font:500 13px var(--label);letter-spacing:1.4px;text-transform:uppercase;color:var(--text-2)}
.health{font-size:12px;color:var(--text-3)}
.health b{color:var(--text-2);font-weight:600}
.agenda-live{display:flex;flex-direction:column;gap:4px}
.agi{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.agi:hover{background:var(--panel-2)}
.agi .n{font:500 13px var(--label);color:var(--text-3);min-width:18px}
.agi .tt{flex:1}
.agi .tm{font-size:11px;color:var(--text-3);display:block}
.agi.cur{background:rgba(46,82,232,.18);border-color:rgba(111,139,255,.55)}
.agi.cur .n{color:var(--blue-soft)}
.agi.done .tt{color:var(--text-2)}
.agi .cnt{font:500 11px var(--label);color:var(--text-3)}
.transcript{height:calc(100vh - 330px);min-height:360px;overflow-y:auto;padding:4px 6px 4px 2px;scroll-behavior:smooth}
.tline{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid rgba(180,187,191,.06)}
.tline .ts{font:12px var(--body);color:var(--text-3);font-variant-numeric:tabular-nums;padding-top:2px}
.tline.interim .tx{color:var(--text-3);font-style:italic}
.tdiv{margin:14px 0 6px;font:600 12px var(--label);letter-spacing:1.4px;text-transform:uppercase;color:var(--blue-soft);display:flex;gap:10px;align-items:center}
.tdiv:after{content:"";flex:1;height:1px;background:rgba(111,139,255,.3)}
.tcap{margin:6px 0 6px 72px;padding:8px 10px;border-radius:9px;font-size:13px;border-left:3px solid var(--blue)}
.tcap.motion{background:rgba(255,194,75,.08);border-color:var(--amber)}
.tcap.action{background:rgba(56,211,159,.08);border-color:var(--green)}
.tcap.date{background:rgba(111,139,255,.1);border-color:var(--blue-soft)}
.tcap.note,.tcap.decision{background:rgba(180,187,191,.07);border-color:var(--silver)}
.tcap.flag{background:rgba(255,90,95,.08);border-color:var(--red)}
.tcap b{font:600 11px var(--label);letter-spacing:1.2px;text-transform:uppercase;margin-right:6px}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.capbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);text-align:left}
.capbtn:hover{border-color:var(--blue-soft)}
.capbtn b{font:500 14px var(--label);letter-spacing:.8px;text-transform:uppercase}
.capbtn span{font-size:11px;color:var(--text-3)}
.capbtn.motion{border-left:3px solid var(--amber)}
.capbtn.action{border-left:3px solid var(--green)}
.capbtn.date{border-left:3px solid var(--blue-soft)}
.capbtn.note{border-left:3px solid var(--silver)}
.capbtn.flag{border-left:3px solid var(--red)}
.capbtn.next{border-left:3px solid var(--blue)}
.caplist{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 640px);min-height:120px;overflow-y:auto}
.citem{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--navy);border:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.citem .k{font:600 10px var(--label);letter-spacing:1.2px;text-transform:uppercase;padding:2px 6px;border-radius:5px;flex:none;margin-top:1px}
.k.motion{background:rgba(255,194,75,.18);color:#ffd88a}
.k.action{background:rgba(56,211,159,.16);color:#9ef0d2}
.k.date{background:rgba(111,139,255,.18);color:#cdd7ff}
.k.note,.k.decision{background:rgba(180,187,191,.16);color:var(--silver)}
.k.flag{background:rgba(255,90,95,.16);color:#ffb3b5}
.citem .b{flex:1;min-width:0}
.citem .m{color:var(--text-3);font-size:11px}
.citem .x{background:none;border:0;color:var(--text-3);padding:0 2px}
.citem .x:hover{color:var(--text)}
.notelog{display:flex;flex-direction:column;gap:5px;margin:0 0 8px}
.notelog .nl{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--navy);border:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.notelog .nl .tm{color:var(--text-3);font-size:11px;flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.notelog .nl .tx2{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.notelog .nl .x{background:none;border:0;color:var(--text-3);padding:0 2px}
.notelog .nl .x:hover{color:var(--text)}
.noteadd{display:flex;gap:6px;align-items:flex-end}
.noteadd textarea{flex:1;min-height:44px}
.notehint{font-size:11.5px;color:var(--text-3);margin:4px 0 0}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,6,24,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:92vh;overflow:auto}
.modal h3{font:22px var(--head);text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px}
.modal .ctx{background:var(--navy);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--text-2);margin:10px 0 14px;max-height:110px;overflow:auto}
.modal .ctx em{color:var(--text-3);font-style:normal;font-size:11px;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:1px;font-family:var(--label)}
.modal .fields{display:flex;flex-direction:column;gap:12px}
.modal .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- review ---------- */
.rev{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.rsec{margin-bottom:14px}
.rsec .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.rsec .hd b{font:600 16px var(--label);letter-spacing:.8px;text-transform:uppercase}
.rsec .hd span{color:var(--text-3);font-size:12px}
details.tx{margin-top:8px}
details.tx summary{cursor:pointer;color:var(--text-3);font-size:13px}
details.tx div{font-size:13px;color:var(--text-2);max-height:260px;overflow:auto;padding:8px 0}
.exports{display:flex;flex-direction:column;gap:8px}
.exports .btn{justify-content:flex-start}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat b{font:24px var(--head);display:block}
.stat span{font:500 11px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}

/* ---------- minutes document (screen + print) ---------- */
.docwrap{background:#E9ECF2;padding:30px 16px;border-radius:14px}
.doc{background:#fff;color:#1B1F2E;max-width:820px;margin:0 auto;padding:56px 64px 64px;font:15.5px/1.6 var(--serif);box-shadow:0 10px 40px rgba(9,13,50,.18)}
.doc .lh{display:flex;align-items:center;gap:20px;padding-bottom:16px;border-bottom:3px solid #1A2CBD;position:relative}
.doc .lh:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:#B4BBBF}
.doc .lh img{width:86px;height:86px;object-fit:contain}
.doc .lh .org{font:30px var(--head);letter-spacing:.6px;text-transform:uppercase;color:#090D32;line-height:1}
.doc .lh .org small{display:block;font:500 12px var(--label);letter-spacing:3px;color:#2E52E8;margin-top:6px}
.doc .ttl{text-align:center;margin:28px 0 4px;font:600 13px var(--label);letter-spacing:4px;text-transform:uppercase;color:#7E8284}
.doc .ttl2{text-align:center;font:26px var(--head);letter-spacing:.6px;text-transform:uppercase;color:#090D32;margin:0}
.doc .ttl3{text-align:center;color:#4a5068;margin:4px 0 24px;font-style:italic}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #D9DDE6;border-radius:6px;margin-bottom:26px}
.doc .meta div{padding:9px 12px;border-right:1px solid #D9DDE6}
.doc .meta div:last-child{border-right:0}
.doc .meta span{display:block;font:500 10px var(--label);letter-spacing:1.6px;text-transform:uppercase;color:#7E8284}
.doc .meta b{font:600 14px var(--body);color:#1B1F2E}
.doc h4{font:600 13px var(--label);letter-spacing:2px;text-transform:uppercase;color:#1A2CBD;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid #D9DDE6;display:flex;gap:10px}
.doc h4 .no{color:#B4BBBF}
.doc p{margin:0 0 10px}
.doc .att{display:block;font-size:14.5px}
.doc .att p{margin:0 0 4px}
.doc .lbl{font:600 11px var(--label);letter-spacing:1.4px;text-transform:uppercase;color:#7E8284;margin-right:6px}
.doc .motion{border:1px solid #E6D9A8;background:#FFFBEC;border-left:4px solid #E0A100;border-radius:4px;padding:10px 14px;margin:10px 0 12px;font-size:14.5px;page-break-inside:avoid}
.doc .motion .mt{font:600 11px var(--label);letter-spacing:1.6px;text-transform:uppercase;color:#9A6E00;display:flex;justify-content:space-between;gap:10px}
.doc .motion .res{padding:1px 8px;border-radius:3px;color:#fff;background:#1E8E5A}
.doc .motion .res.failed{background:#B3261E}
.doc .motion .res.tabled,.doc .motion .res.withdrawn,.doc .motion .res.pending{background:#7E8284}
.doc .motion .mx{margin:4px 0 2px;color:#1B1F2E}
.doc .motion .mv{font-family:var(--body);font-size:12.5px;color:#4a5068}
.doc .ph{color:#8a91a8;font-style:italic;background:#F4F6FA;border:1px dashed #C9CFDB;padding:8px 12px;border-radius:4px;font-size:14px}
.doc table{width:100%;border-collapse:collapse;font:13.5px/1.45 var(--body);margin-top:6px;page-break-inside:auto}
.doc th{text-align:left;font:600 10.5px var(--label);letter-spacing:1.4px;text-transform:uppercase;color:#fff;background:#090D32;padding:7px 10px}
.doc td{padding:7px 10px;border-bottom:1px solid #E3E6EE;vertical-align:top}
.doc tr:nth-child(even) td{background:#F7F8FB}
.doc .sig{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:14px}
.doc .sig div{border-top:1px solid #1B1F2E;padding-top:6px}
.doc .sig span{display:block;color:#7E8284;font:500 11px var(--label);letter-spacing:1.2px;text-transform:uppercase}
.doc .foot{margin-top:34px;text-align:center;font:500 10px var(--label);letter-spacing:2px;text-transform:uppercase;color:#B4BBBF}

@media (max-width:1100px){.live{grid-template-columns:230px 1fr}.live .col3{grid-column:1/-1}.rev{grid-template-columns:1fr}}
@media (max-width:760px){.grid2,.live{grid-template-columns:1fr}.doc{padding:30px 22px}.doc .meta{grid-template-columns:1fr 1fr}.transcript{height:50vh}}
/* live screen fits the window: clocks/Pause/End stay put, each column scrolls inside itself */
@media (min-width:901px){
  body:has(#agLive){height:100vh;display:flex;flex-direction:column;overflow:hidden}
  body:has(#agLive) main#app{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:12px 20px 14px}
  body:has(#agLive) .recbar{flex:none;margin-bottom:12px;padding:10px 16px}
  body:has(#agLive) #srBanner{flex:none}
  body:has(#agLive) .live{flex:1;min-height:0;grid-template-columns:250px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);align-items:stretch}
  body:has(#agLive) .live > .card:first-child{overflow-y:auto;min-height:0}
  body:has(#agLive) .live > .card:nth-child(2){display:flex;flex-direction:column;min-height:0}
  body:has(#agLive) .live .transcript{flex:1;height:auto;min-height:0}
  body:has(#agLive) .live .col3{overflow-y:auto;min-height:0;grid-column:auto}
  body:has(#agLive) .live .caplist{max-height:none;overflow:visible}
  body:has(#agLive) .live > .card:first-child,body:has(#agLive) .live .transcript,body:has(#agLive) .live .col3{scrollbar-width:thin;scrollbar-color:var(--steel) transparent}
}

@media print{
  @page{size:letter;margin:.55in .6in}
  body{background:#fff}
  body > *:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .doc{box-shadow:none;padding:0;max-width:none}
  #printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printRoot{display:none}
.modal.wide{width:min(860px,100%)}
.ptspk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ptq{font:400 12px var(--body);letter-spacing:0;text-transform:none;color:var(--text-3)}
.ptlist{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow:auto;padding-right:4px}
.ptrow{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:4px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--navy)}
.ptrow.open{border-color:var(--amber)}
.ptrow .ptm{grid-column:1/-1;font-size:11px;color:var(--text-3)}
.ptrow .ptt{font-size:13.5px;line-height:1.45}
.ptrow select{align-self:start;font-size:13px;padding:5px 6px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
@media (max-width:760px){.ptrow{grid-template-columns:1fr}}
.syncbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text-2);font-size:13.5px;margin:0 0 14px}
.syncbar.ok{border-color:rgba(56,211,159,.35)}
.syncbar.warn{border-color:rgba(255,194,75,.4);background:rgba(255,194,75,.08);color:#ffe2a6}
.follow-list{display:flex;flex-direction:column;gap:8px}
.follow-row{padding:10px 14px}
.follow-row.now{border-color:var(--amber)}
.follow-row .fnote{font-size:14px;color:var(--text-2);margin-top:3px}
.follow-row .fk{font:500 10px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--blue-soft)}
@media (max-width:760px){.mrow{flex-wrap:wrap}.mrow .t{flex-basis:100%}}
#lockScreen{display:none}
html.locked #lockScreen{display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
html.locked body > *:not(#lockScreen){visibility:hidden}
#lockScreen img{width:110px;height:110px;object-fit:contain}
#lockScreen h1{margin:0}
.lockrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:9px 12px;border-radius:10px;border:1px solid var(--line);color:var(--text-2);font-size:13.5px;margin:10px 0 0}
.lockrow:empty{display:none}
</style>
</head>

/* ---------- tiny helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
function fmtClock(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':'+pad(m):pad(m))+':'+pad(s); }
function fmtTs(sec){ sec=Math.max(0,Math.floor(sec)); return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60); }
function fmtWall(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function fmtDateLong(d){ if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function fmtDateShort(d){ if(!d) return ''; if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d; const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
/* Inside claude.ai the page can't start a download itself: files go through the viewer's
   save prompt (downloads capability). Opened as a local file, the plain link below is used. */
let DL = null;
(async () => { try { if (window.claude && typeof window.claude.use === 'function') DL = await window.claude.use('downloads'); } catch (e) { DL = null; } })();
async function download(name, blobOrText, type='text/plain', tries=0){
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], {type});
  if (DL) {
    try { await DL.save({ filename: name, data: blob }); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'rate_limited' && tries < 4) { await new Promise(r => setTimeout(r, 1500)); return download(name, blob, type, tries + 1); }
      if (code === 'declined') { toast('Not saved: ' + name); return false; }
      toast('Could not save ' + name + ' here (' + (code || 'unavailable') + '). Open the app from the file on your laptop to save it.', 6000);
      return false;
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 120000);   // a 40+ MB file can take a while to hand off; revoking early makes Chrome fail it
  return true;
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* ---------- storage (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('lybs-meeting-secretary', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore('meetings', { keyPath:'id' });
        db.createObjectStore('audio', { keyPath:['meetingId','seq'] });
        db.createObjectStore('kv');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store);
      let out; Promise.resolve(fn(s)).then(v => out = v);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  const req = r => new Promise((res, rej) => { r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  return {
    put: (store, v, key) => tx(store, 'readwrite', s => { key===undefined ? s.put(v) : s.put(v, key); }),
    get: (store, key) => tx(store, 'readonly', s => req(s.get(key))),
    all: store => tx(store, 'readonly', s => req(s.getAll())),
    del: (store, key) => tx(store, 'readwrite', s => { s.delete(key); }),
    audioFor: meetingId => tx('audio', 'readonly', s => req(s.getAll(IDBKeyRange.bound([meetingId, 0], [meetingId, Infinity])))),
    delAudio: meetingId => tx('audio', 'readwrite', s => { s.delete(IDBKeyRange.bound([meetingId, 0], [meetingId, Infinity])); }),

/* ---------- agenda feed (optional) ----------
   A file named agenda-feed.js next to this page can offer the next meeting's agenda. The daily Gmail
   check writes it; nothing in this page reads Gmail. It sets window.AGENDA_FEED:
     { updatedAt: ISO time, source: 'where it came from', meeting: { date: 'YYYY-MM-DD', time, location },
       opening: [titles that go first], closing: [titles that go last],
       items: [{ title, detail, source, isNew }] }
   The setup screen offers it in a banner (Use these topics / Keep the standard agenda). Nothing changes
   until you choose, nothing is removed behind your back, and a topic you delete is not offered again.
   With no file, or one that doesn't parse, none of this shows and the app works exactly as before. */
function readAgendaFeed(){
  const f = window.AGENDA_FEED;
  if (!f || !Array.isArray(f.items)) return null;
  const titles = (v, dflt) => Array.isArray(v) ? v.map(s => String(s ?? '').trim()).filter(Boolean) : dflt;
  const topics = f.items
    .filter(i => i && String(i.title ?? '').trim())
    .map(i => ({ title: String(i.title).trim(), detail: String(i.detail ?? '').trim(), source: String(i.source ?? '').trim(), isNew: i.isNew === true }));
  if (!topics.length) return null;
  return {
    topics,
    opening: titles(f.opening, ['Call to Order', 'Approval of Prior Minutes']),
    closing: titles(f.closing, ['Adjournment']),
    updatedAt: String(f.updatedAt ?? ''),
    meetingDate: /^\d{4}-\d{2}-\d{2}$/.test(String(f.meeting?.date ?? '')) ? f.meeting.date : '',
    meetingLocation: String(f.meeting?.location ?? '').trim(),
    source: String(f.source ?? '').trim(),
  };
}
const sameTitle = (a, b) => String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
const plainItem = t => ({ id: uid(), title: t, startT: null, notes: '' });
const topicItem = (t, isNew) => ({ id: uid(), title: t.title, startT: null, notes: '', detail: t.detail, source: t.source, isNew });
function feedAgendaItems(feed){   // the opening items, then every topic, then the closing items
  return [...feed.opening.map(plainItem), ...feed.topics.map(t => topicItem(t, t.isNew)), ...feed.closing.map(plainItem)];
}
function feedMissingTopics(feed){   // topics not in this meeting's agenda, leaving out any the secretary removed on purpose
  const gone = (M.feedChoice && M.feedChoice.removed) || [];
  return feed.topics.filter(t => !M.agenda.some(a => sameTitle(a.title, t.title)) && !gone.some(g => sameTitle(g, t.title)));
}
function addFeedTopics(feed, topics){   // new topics go in just before the closing items (Adjournment)
  let at = M.agenda.length;
  while (at > 0 && feed.closing.some(c => sameTitle(c, M.agenda[at-1].title))) at--;
  M.agenda.splice(at, 0, ...topics.map(t => topicItem(t, true)));
}
function noteRemovedFeedTopic(item){   // remembering a removal keeps that topic from being offered again
  if (!item || !M.feedChoice || M.feedChoice.choice !== 'used') return;
  (M.feedChoice.removed = M.feedChoice.removed || []).push(item.title);
}
function feedBarState(feed){   // what the setup banner should say, if anything
  if (!feed) return null;
  const c = M.feedChoice;
  if (!c || (c.choice === 'ignored' && c.updatedAt !== feed.updatedAt)) return { kind: 'offer' };
  if (c.choice === 'used' && c.updatedAt !== feed.updatedAt) {
    const missing = feedMissingTopics(feed);
    if (missing.length) return { kind: 'update', missing };
  }
  return null;
}
let liveTextOpenId = null;   // a topic with no text yet whose box was opened with "+ Add agenda text"
function drawAgendaDetail(){   // the agenda's own text for the topic being discussed (editable), above the secretary's notes
  const el = $('#agDetail'); if (!el) return;
  const a = agendaById(M.currentAgendaId) || M.agenda[0];
  if (!a) { el.innerHTML = ''; return; }

    el.innerHTML = `<div class="agenda-bg"><span style="display:block;font:500 10px var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:4px">From the agenda</span><textarea class="ag-text" id="agDetailText" rows="1" placeholder="Add text for this topic (optional)">${esc(a.detail || '')}</textarea></div>`;
    const ta = $('#agDetailText'), grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    grow(); ta.oninput = e => { a.detail = e.target.value; grow(); scheduleSave(); };
  } else {

    $('#agDetailAdd').onclick = () => { liveTextOpenId = a.id; drawAgendaDetail(); const t = $('#agDetailText'); if (t) t.focus(); };
  }
}
function scheduleSave(){
  if (!M) return;
  clearTimeout(saveTimer);
  setTopStatus('Saving…');
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow(){
  if (!M) return;
  clearTimeout(saveTimer);
  if (view === 'follow' || liveElsewhere(M)) return;   // read-only while another device records it
  bankClock();
  if (M.status === 'live' && view === 'live') { M.liveDevice = DEVICE.id; M.liveDeviceName = DEVICE.name; }
  else if (M.status !== 'live') { delete M.liveDevice; delete M.liveDeviceName; }
  const savedStatus = () => Cloud.on ? 'Saved · syncing' : `Saved on this ${DEVICE.name}`;
  try {
    const prev = await DB.get('meetings', M.id);
    if (prev && JSON.stringify({ ...prev, updated: 0 }) === JSON.stringify({ ...M, updated: 0 })) { M.updated = prev.updated; setTopStatus(Cloud.on && !isDirty(M) ? 'Saved · synced' : savedStatus()); return; }
    M.updated = new Date().toISOString();
    await DB.put('meetings', structuredClone(M)); setTopStatus(savedStatus()); cloudSchedulePush(M.id);
  }
  catch(e){ console.error(e); setTopStatus('⚠ Save failed'); }
}
function setTopStatus(s){ $('#topStatus').textContent = s; }
function presentNames(m=M){ return m.roster.map(p=>p.name).filter(n => m.attendance[n] === 'present'); }
function agendaById(id){ return M.agenda.find(a => a.id === id); }
function agendaIndex(id){ return M.agenda.findIndex(a => a.id === id); }

/* =====================================================================
   AUDIO + SPEECH ENGINE
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Engine = {
  stream: null, recorder: null, rec: null, ctx: null, analyser: null, raf: 0,
  running: false, paused: false, seq: 0, part: 0, wakeLock: null, pending: new Set(), src: null, backoff: 300, runStart: 0,
  lastResultAt: 0, restarts: 0, srState: 'off', srError: '',
  tickStart: 0, onInterim: null, onFinal: null, onLevel: null, onState: null,

  async getMic(){
    if (this.stream && this.stream.active) return this.stream;
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 } });
    return this.stream;
  },
  startMeter(cb){
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      try { this.src && this.src.disconnect(); } catch(e){}
      const src = this.src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 1024;
      src.connect(this.analyser);
      const buf = new Uint8Array(this.analyser.fftSize);
      const loop = () => {
        this.analyser.getByteTimeDomainData(buf);
        let peak = 0; for (let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]-128); if (v>peak) peak=v; }
        cb && cb(Math.min(1, peak/90));
        this.raf = requestAnimationFrame(loop);
      };
      cancelAnimationFrame(this.raf); loop();
    } catch(e){ console.warn('meter', e); }
  },
  stopMeter(){ cancelAnimationFrame(this.raf); this.raf = 0; },
  pickMime(){
    const opts = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
    for (const o of opts) if (window.MediaRecorder && MediaRecorder.isTypeSupported(o)) return o;
    return '';
  },
  async startRecorder(meetingId, startSeq){
    if (!window.MediaRecorder) { toast('This browser cannot record audio — transcript only.'); return; }
    const mime = this.pickMime();
    this.recorder = new MediaRecorder(this.stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
    this.seq = startSeq;
    // Each start of a recorder is a separate audio file ("part"): after a crash/resume the
    // new recorder writes its own header, so parts can't just be glued together.
    M.audio.parts = (M.audio.parts || 0) + 1; this.part = M.audio.parts;
    M.audio.mime = this.recorder.mimeType || mime;
    const part = this.part;
    this.recorder.ondataavailable = e => {
      if (!e.data || !e.data.size) return;
      const seq = this.seq++;
      const p = DB.put('audio', { meetingId, seq, part, blob: e.data }).then(() => {
        M.audio.chunks = Math.max(M.audio.chunks, seq + 1); M.audio.bytes += e.data.size; scheduleSave();
      }).catch(err => { console.error('audio save', err); setTopStatus('⚠ Audio save failed — disk full?'); })
        .finally(() => this.pending.delete(p));
      this.pending.add(p);
    };
    this.recorder.start(10000); // a chunk every 10s → at most 10s lost if the tab crashes
  },
  startSpeech(){
    if (!SR) { this.srState = 'unsupported'; this.onState && this.onState(); return; }
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = SETTINGS.lang || 'en-US'; rec.maxAlternatives = 1;
    if (SETTINGS.onDevice && 'processLocally' in rec) { try { rec.processLocally = true; } catch(e){} }
    rec.onstart = () => { this.srState = 'listening'; this.srError=''; this.runStart = Date.now(); this.onState && this.onState(); };
    rec.onresult = ev => {
      this.lastResultAt = Date.now();
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const r = ev.results[i]; const txt = r[0].transcript.trim();
        if (!txt) continue;
        if (r.isFinal) this.onFinal && this.onFinal(txt); else interim += (interim?' ':'') + txt;
      }
      this.onInterim && this.onInterim(interim);
    };
    rec.onerror = ev => {
      this.srError = ev.error || 'error';
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { this.srState = 'blocked'; this.running && this.onState && this.onState(); }
      else if (ev.error === 'language-not-supported') { this.srState = 'blocked'; this.onState && this.onState(); }
    };
    rec.onend = () => {
      this.onInterim && this.onInterim('');
      if (this.running && !this.paused && this.srState !== 'blocked') {
        // Chrome ends continuous recognition on silence/network blips; just start again.
        // Back off if it keeps dying immediately (e.g. no internet), so we don't spin.
        this.backoff = (Date.now() - this.runStart < 3000) ? Math.min(8000, this.backoff * 2) : 300;
        this.restarts++; this.srState = 'restarting'; this.onState && this.onState();
        setTimeout(() => { if (this.running && !this.paused && this.rec === rec) { try { rec.start(); } catch(e){ /* already started */ } } }, this.backoff);
      } else if (this.srState !== 'blocked') { this.srState = 'off'; this.onState && this.onState(); }
    };
    this.rec = rec;
    try { rec.start(); } catch(e){ console.warn(e); }
  },
  stopSpeech(){ if (this.rec) { try { this.rec.onend = null; this.rec.abort(); } catch(e){} this.rec = null; } if (this.srState!=='blocked'&&this.srState!=='unsupported') this.srState='off'; this.onInterim && this.onInterim(''); },
  async wake(){ try { if ('wakeLock' in navigator && !this.wakeLock) { this.wakeLock = await navigator.wakeLock.request('screen'); this.wakeLock.addEventListener('release', () => { this.wakeLock = null; }); } } catch(e){} },
  unwake(){ try { this.wakeLock && this.wakeLock.release(); } catch(e){} this.wakeLock = null; },

  async start(meetingId, startSeq){
    await this.getMic();
    this.running = true; this.paused = false; this.restarts = 0;
    await this.startRecorder(meetingId, startSeq);
    this.startSpeech();
    this.startMeter(this.onLevel);
    this.wake();
    this.tickStart = performance.now();
  },
  pause(){
    if (!this.running || this.paused) return;
    this.paused = true;
    try { this.recorder && this.recorder.state === 'recording' && this.recorder.pause(); } catch(e){}
    try { this.recorder && this.recorder.requestData(); } catch(e){}
    this.stopSpeech();
  },
  resume(){
    if (!this.running || !this.paused) return;
    this.paused = false; this.tickStart = performance.now();
    try { this.recorder && this.recorder.state === 'paused' && this.recorder.resume(); } catch(e){}
    this.startSpeech();
  },
  async stop(){
    this.running = false; this.paused = false;
    this.stopSpeech();
    if (this.recorder && this.recorder.state !== 'inactive') {
      await new Promise(res => { this.recorder.addEventListener('stop', () => setTimeout(res, 250), { once:true }); try { this.recorder.stop(); } catch(e){ res(); } });
    }
    await Promise.all([...this.pending]);
    this.recorder = null;
    this.stopMeter();
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.unwake();
  },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Engine.running) Engine.wake(); });
window.addEventListener('beforeunload', e => { if (Engine.running) { e.preventDefault(); e.returnValue = ''; } });

/* active clock: seconds of recording time, excluding pauses */
function activeNow(){
  if (!M) return 0;
  let s = M.activeSec || 0;
  if (Engine.running && !Engine.paused) s += (performance.now() - Engine.tickStart) / 1000;
  return s;
}
function bankClock(){ // fold the running interval into M.activeSec
  if (Engine.running && !Engine.paused) { M.activeSec = activeNow(); Engine.tickStart = performance.now(); }
}

/* once the meeting has started, Present/Absent taps are timed: the minutes say who arrived late, left early or came back */
function noteAttChange(name, to){
  if (M.status !== 'live' || !M.startedAt) return;
  const log = (M.attLog ||= []), now = new Date();
  const last = [...log].reverse().find(e => e.name === name);
  if (last && last.to !== to && now - Date.parse(last.at) < 120000) { log.splice(log.lastIndexOf(last), 1); return; }   // a tap undone within two minutes was a mistake
  log.push({ name, to, at: now.toISOString(), hm: now.toTimeString().slice(0,5) });
}
function attEvents(m=M){ return (m.attLog || []).filter(e => m.roster.some(p => p.name === e.name)).slice().sort((a,b) => a.at.localeCompare(b.at)); }
function attendedNames(m=M){ const ev = attEvents(m); return m.roster.map(p=>p.name).filter(n => m.attendance[n] === 'present' || ev.some(e => e.name === n)); }
function attVerb(e, m=M){ return e.to === 'absent' ? 'left' : attEvents(m).some(x => x.name === e.name && x.at < e.at) ? 'returned' : 'arrived'; }
function attMoves(m=M){ return attEvents(m).map(e => `${e.name} ${attVerb(e, m)} at ${to12(e.hm)}`); }
function attTag(name){ return attEvents().filter(e => e.name === name).map(e => `${attVerb(e)} ${to12(e.hm)}`).join(', '); }
function drawAttendance(el, onChange){
  el.innerHTML = M.roster.map(p => {
    const st = M.attendance[p.name] || 'present';
    return `<div class="who"><b>${esc(p.name)}</b><span>${esc([p.role, attTag(p.name)].filter(Boolean).join(' · '))}</span></div>
      <div class="seg" data-n="${esc(p.name)}"><button class="present ${st==='present'?'on':''}" data-s="present">Present</button><button class="absent ${st==='absent'?'on':''}" data-s="absent">Absent</button></div>`;
  }).join('');
  el.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    if ((M.attendance[seg.dataset.n] || 'present') !== b.dataset.s) noteAttChange(seg.dataset.n, b.dataset.s);
    M.attendance[seg.dataset.n] = b.dataset.s; scheduleSave(); drawAttendance(el, onChange); onChange && onChange();
  }));
}
function drawQuorum(el){
  if (!el) return;
  const n = presentNames().length, q = +SETTINGS.quorum || 0;
  el.innerHTML = `<div class="quorum ${n>=q?'ok':'no'}">${n} of ${M.roster.length} directors present — ${n>=q ? 'quorum met' : 'quorum NOT met'} (quorum set to ${q} in Settings).</div>`;
}

async function startMeeting(){
  if (!M.agenda.length) M.agenda.push({ id: uid(), title: 'General Business', startT: null, notes: '' });
  M.agenda = M.agenda.filter(a => a.title.trim());
  try {
    Engine.stopMeter();
    if (Engine.stream) { Engine.stream.getTracks().forEach(t=>t.stop()); Engine.stream = null; }
    await Engine.start(M.id, M.audio.chunks || 0);
  } catch(e){
    toast('Microphone blocked: ' + e.message, 5000); return;
  }
  M.status = 'live';
  if (!M.startedAt) { M.startedAt = new Date().toISOString(); M.calledToOrder = new Date().toTimeString().slice(0,5); }
  if (!M.currentAgendaId) setAgenda(M.agenda[0].id, true);
  await saveNow();
  go('live');
}

/* ---------- LIVE ---------- */
function setAgenda(id, silent){
  const a = agendaById(id); if (!a) return;
  if (id !== M.currentAgendaId) commitNoteDraft(true);
  M.currentAgendaId = id;
  if (a.startT == null) a.startT = activeNow();
  M.topicSinceWall = new Date().toISOString();
  if (M.status === 'live' && (M.topicLog ||= []).at(-1)?.agendaId !== id) M.topicLog.push({ wall: M.topicSinceWall, agendaId: id });   // lines up a phone transcript later
  scheduleSave();
  if (!silent && view === 'live') { drawAgendaLive(); drawTranscript(true); $('#notesFor').textContent = a.title; drawNoteLog(); drawAgendaDetail(); }
}
/* ---------- secretary notes: a running list per topic. "+ Add" appends, it never replaces ---------- */
const NOTE_TS = /^\[(\d{1,2}(?::\d{2}){1,2})\]\s*/;
function noteLines(a){ return String((a && a.notes) || '').split('\n').map(s => s.trim()).filter(Boolean); }
function stripNoteTs(line){ return String(line).replace(NOTE_TS, ''); }
function appendNote(a, text){
  const t = String(text || '').replace(/\s*\n+\s*/g, ' ').trim(); if (!a || !t) return false;
  const line = '[' + fmtClock(activeNow()) + '] ' + t;
  a.notes = (a.notes || '').replace(/\s+$/, '') ? a.notes.replace(/\s+$/, '') + '\n' + line : line;
  return true;
}
function commitNoteDraft(silent){
  const d = M && M.noteDraft; if (!d || !String(d.text || '').trim()) return;
  const a = agendaById(d.agendaId) || agendaById(M.currentAgendaId);
  if (appendNote(a, d.text)) { M.noteDraft = null; const box = $('#agNoteDraft'); if (box) box.value = ''; scheduleSave(); if (silent) toast('Your unfinished note was added to ' + a.title + '.'); }
}
function addNoteFromDraft(){
  const box = $('#agNoteDraft'); if (!box) return;
  const a = agendaById(M.currentAgendaId);
  if (!String(box.value).trim()) { box.focus(); return; }
  M.noteDraft = { agendaId: M.currentAgendaId, text: box.value };
  commitNoteDraft(false);
  drawNoteLog(); drawAgendaLive();
}
function drawNoteLog(){
  const el = $('#noteLog'); if (!el) return;
  const a = agendaById(M.currentAgendaId); const lines = noteLines(a);
  el.innerHTML = lines.map((ln, i) => { const m = ln.match(NOTE_TS); return `<div class="nl"><span class="tm">${m ? esc(m[1]) : ''}</span><span class="tx2">${esc(stripNoteTs(ln))}</span><button class="x" data-rmnote="${i}" title="Remove this note" type="button">×</button></div>`; }).join('');
  el.querySelectorAll('[data-rmnote]').forEach(b => b.onclick = () => {
    const i = +b.dataset.rmnote, ls = noteLines(a); const gone = ls[i];
    confirmModal('Remove this note?', esc(stripNoteTs(gone)), 'Remove', () => { const now = noteLines(a); const k = now.indexOf(gone); if (k >= 0) now.splice(k, 1); a.notes = now.join('\n'); scheduleSave(); drawNoteLog(); drawAgendaLive(); });
  });
  el.scrollTop = el.scrollHeight;
}

function meetingElapsed(){ // wall-clock since the meeting was called to order — keeps running through pauses and crashes
  if (!M.startedAt) return 0;
  const end = M.endedAt ? Date.parse(M.endedAt) : Date.now();
  return (end - Date.parse(M.startedAt)) / 1000;
}
function drawClocks(){
  const mc = $('#meetClock'); if (!mc) return;
  const el = meetingElapsed(); mc.textContent = fmtClock(el);
  const box = $('#clkMeet'), plan = (+M.plannedMin || 0) * 60;
  box.className = 'clk main' + (plan ? (el > plan ? ' over' : el > plan - 600 ? ' warn' : '') : '');

  box.querySelector('span').textContent = plan ? (el > plan ? `Meeting · ${fmtClock(el - plan)} over` : `Meeting · ${fmtClock(plan - el)} left`) : 'Meeting time';

  st.textContent = notStarted ? 'Interrupted — press Resume' : Engine.paused ? 'Paused — not recording' : 'Recording';
  pb.textContent = notStarted || Engine.paused ? '● Resume' : 'Pause';
  pb.className = 'btn ' + (notStarted || Engine.paused ? 'primary' : '');

  else if (Engine.srState === 'blocked') b.innerHTML = `<div class="banner">Speech-to-text stopped (${esc(Engine.srError)}). Audio is still recording. ${SETTINGS.onDevice ? 'Try turning off on-device mode in Settings.' : 'Check the internet connection, then Pause and Resume.'}</div>`;

  h.innerHTML = `Audio <b>${mb} MB</b> saved · Speech ${sr} · <b>${M.segments.length}</b> lines`;

async function togglePause(){

    drawCaptures(); drawTranscript(); drawState(); scheduleSave(); return;
  }

}
function drawAgendaLive(){
  const el = $('#agLive'); if (!el) return;
  const curI = agendaIndex(M.currentAgendaId);
  el.innerHTML = M.agenda.map((a,i) => {
    const n = M.items.filter(x => x.agendaId === a.id && !x.auto).length + noteLines(a).length;
    return `<button class="agi ${a.id===M.currentAgendaId?'cur':''} ${i<curI?'done':''}" data-id="${a.id}">
      <span class="n">${i+1}</span><span class="tt">${esc(a.title)}${a.startT!=null?`<span class="tm">${fmtClock(a.startT)}</span>`:''}</span>${n?`<span class="cnt">${n}</span>`:''}</button>`;
  }).join('');
  el.querySelectorAll('.agi').forEach(b => b.onclick = () => setAgenda(b.dataset.id));
  el.querySelector('.agi.cur')?.scrollIntoView({ block: 'nearest' });
}
function drawAttMini(){
  const el = $('#attMini'); if (!el) return;
  const p = presentNames(), ab = M.roster.length - p.length;
  el.innerHTML = `<div>${p.length} present${ab ? ` · ${ab} absent` : ''} · quorum ${p.length >= SETTINGS.quorum ? '✓' : '✗'}</div><button class="btn sm ghost" style="margin-top:6px" id="attEdit">Edit attendance</button>`;
  $('#attEdit').onclick = () => {
    openModal(`<h3>Attendance</h3><p style="color:var(--text-2);margin:0 0 12px;font-size:14px">Someone arrived late or left early? Change it here. The time is saved, and the minutes say when they arrived or left.</p><div class="att" id="attModal"></div><label class="f" style="margin-top:12px">Guests<textarea id="gModal" rows="2">${esc(M.guests)}</textarea></label><div class="foot"><button class="btn primary" id="attDone">Done</button></div>`);
    drawAttendance($('#attModal'));
    $('#gModal').oninput = e => { M.guests = e.target.value; scheduleSave(); };
    $('#attDone').onclick = () => { closeModal(); drawAttMini(); };
  };
}

/* transcript rendering */
function capHTML(it){
  return `<div class="tcap ${it.kind}"><b>${capLabel(it)}</b>${esc(capSummary(it))}</div>`;
}
function drawTranscript(){
  const el = $('#tx'); if (!el) return;
  let html = ''; let lastAg = null;
  const capsByT = [...M.items].sort((a,b)=>a.t-b.t); let ci = 0;
  const section = id => { if (id !== lastAg) { lastAg = id; const a = agendaById(id); html += `<div class="tdiv">${esc(a ? a.title : 'Topic')}</div>`; } };
  for (const s of M.segments) {
    while (ci < capsByT.length && capsByT[ci].t < s.t) { section(capsByT[ci].agendaId); html += capHTML(capsByT[ci++]); }
    section(s.agendaId);
    html += `<div class="tline"><span class="ts">${fmtClock(s.t)}</span><span class="tx">${esc(s.text)}</span></div>`;
  }
  while (ci < capsByT.length) { section(capsByT[ci].agendaId); html += capHTML(capsByT[ci++]); }
  const curA = agendaById(M.currentAgendaId);
  if (curA && lastAg !== curA.id) html += `<div class="tdiv">${esc(curA.title)}</div>`;
  html += `<div class="tline interim" id="interim"><span class="ts"></span><span class="tx"></span></div>`;
  if (!M.segments.length && !M.items.length) html = `<div class="empty" style="margin-top:10px">Words will appear here as people talk. If nothing shows after a minute, check the speech status above — the audio file is recording either way.</div>` + html;
  el.innerHTML = html; el.dataset.lastAg = curA ? curA.id : '';
  drawInterim(); scrollTx();
}
function appendLine(s){
  const el = $('#tx'); if (!el) return;
  const emp = el.querySelector('.empty'); if (emp) emp.remove();
  const interim = $('#interim');
  if (el.dataset.lastAg !== s.agendaId) {
    const d = document.createElement('div'); d.className='tdiv'; d.textContent = agendaById(s.agendaId)?.title || 'Topic'; el.insertBefore(d, interim); el.dataset.lastAg = s.agendaId;
  }
  const d = document.createElement('div'); d.className = 'tline'; d.innerHTML = `<span class="ts">${fmtClock(s.t)}</span><span class="tx">${esc(s.text)}</span>`;
  el.insertBefore(d, interim); scrollTx();
}
function drawInterim(){ const i = $('#interim'); if (i) { i.querySelector('.tx').textContent = interimText; i.querySelector('.ts').textContent = interimText ? '…' : ''; } scrollTx(); }
function scrollTx(){ const el = $('#tx'), cb = $('#autoScroll'); if (el && (!cb || cb.checked)) el.scrollTop = el.scrollHeight; }

/* captures */
function capLabel(it){ return ({motion:'Motion', action:'Action', date:'Key date', note:'Note', decision:'Decision', flag:'Flag'})[it.kind] || it.kind; }
function voteStr(it){ const v = [it.yay, it.nay, it.abstain].map(x => (x===''||x==null) ? null : +x); if (v.every(x=>x==null)) return ''; return `${v[0]||0}–${v[1]||0}–${v[2]||0}`; }
function capSummary(it){
  if (it.kind === 'motion') { const parts = [it.text]; const who = [it.mover && 'moved by ' + it.mover, it.second && '2nd ' + it.second].filter(Boolean).join(', '); if (who) parts.push('(' + who + ')'); const v = voteStr(it); parts.push('— ' + (it.result||'Pending') + (v ? ' ' + v : '')); return parts.join(' '); }
  if (it.kind === 'action') return `${it.text}${it.owner ? ' — ' + it.owner : ''}${it.due ? ' · due ' + fmtDateShort(it.due) : ''}`;
  if (it.kind === 'date') return `${it.when ? fmtDateShort(it.when) + ': ' : ''}${it.text}`;
  return it.text || '(flagged moment)';
}
function drawCaptures(){
  const el = $('#capList'); if (!el) return;
  const items = [...M.items].sort((a,b) => b.t - a.t);
  $('#capCount').textContent = items.length ? `(${items.length})` : '';
  el.innerHTML = items.length ? items.map(it => `<div class="citem"><span class="k ${it.kind}">${capLabel(it)}</span><div class="b">${esc(capSummary(it))}<div class="m">${fmtClock(it.t)} · ${esc(agendaById(it.agendaId)?.title || '')}</div></div><button class="x" data-edit="${it.id}" title="Edit">✎</button></div>`).join('')
    : `<div style="color:var(--text-3);font-size:13px">Motions, action items and dates you capture show up here — and drop into the minutes exactly as entered.</div>`;
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openCapture(null, M.items.find(x => x.id === b.dataset.edit)));
}
function recentContext(n=4){
  const segs = M.segments.slice(-n).map(s => s.text);
  if (interimText) segs.push(interimText);
  return segs.join(' ');
}
function personOptions(sel, allowBlank=true, extra=''){
  const names = M.roster.map(p => p.name);
  const all = sel && !names.includes(sel) ? [...names, sel] : names;
  return (allowBlank ? `<option value="">${extra||'—'}</option>` : '') + all.map(n => `<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
}

function openCapture(kind, existing){
  const it = existing ? structuredClone(existing) : { id: uid(), kind, t: Math.round(activeNow()), agendaId: M.currentAgendaId, text: '' };
  kind = it.kind;
  const ctx = recentContext();
  const ctxHTML = !existing && ctx ? `<div class="ctx"><em>Just said</em>${esc(ctx)}</div>` : '';
  const agSel = `<label class="f">Agenda item<select id="cAg">${M.agenda.map(a => `<option value="${a.id}" ${a.id===it.agendaId?'selected':''}>${esc(a.title)}</option>`).join('')}</select></label>`;
  let body = '';
  if (kind === 'motion') {
    const present = presentNames().length;
    body = `<h3>Motion</h3>${ctxHTML}<div class="fields">
      <label class="f">Motion — what is being voted on<textarea id="cText" rows="3" placeholder="Motion to approve up to $8,000 for the Powell Field dugout project">${esc(it.text)}</textarea></label>
      <div class="two"><label class="f">Moved by<select id="cMover">${personOptions(it.mover)}</select></label><label class="f">Seconded by<select id="cSecond">${personOptions(it.second)}</select></label></div>
      <div class="three"><label class="f">Yay<input type="number" min="0" id="cYay" value="${it.yay ?? ''}"></label><label class="f">Nay<input type="number" min="0" id="cNay" value="${it.nay ?? ''}"></label><label class="f">Abstain<input type="number" min="0" id="cAbs" value="${it.abstain ?? ''}"></label></div>
      <div class="row"><button class="btn sm" id="cUnan">Unanimous (${present}–0–0)</button>
        <label class="f" style="flex:1">Result<select id="cRes">${['Approved','Failed','Tabled','Withdrawn','Pending'].map(r => `<option ${r===(it.result||'Approved')?'selected':''}>${r}</option>`).join('')}</select></label></div>
      ${agSel}</div>`;
  } else if (kind === 'action') {
    body = `<h3>Action item</h3>${ctxHTML}<div class="fields">
      <label class="f">What needs to happen<textarea id="cText" rows="2" placeholder="Get a lock for the Powell dumpster">${esc(it.text)}</textarea></label>
      <div class="two"><label class="f">Owner<select id="cOwner">${personOptions(it.owner, true, 'Unassigned')}</select></label><label class="f">Due<input type="date" id="cDue" value="${esc(it.due||'')}"></label></div>
      <label class="f">Owner not on the board? Type a name<input type="text" id="cOwnerX" value="" placeholder="e.g. Chris Ruth"></label>
      ${agSel}</div>`;
  } else if (kind === 'date') {
    body = `<h3>Key date</h3>${ctxHTML}<div class="fields">
      <div class="two"><label class="f">Date<input type="date" id="cWhen" value="${esc(/^\d{4}-/.test(it.when||'')?it.when:'')}"></label><label class="f">Or describe it<input type="text" id="cWhenX" value="${esc(/^\d{4}-/.test(it.when||'')?'':(it.when||''))}" placeholder="Sundays starting Jan 10, 3–8pm"></label></div>
      <label class="f">What<input type="text" id="cText" value="${esc(it.text)}" placeholder="Hit-a-Thon and Parade Day"></label>
      ${agSel}</div>`;
  } else if (kind === 'note' || kind === 'decision') {
    body = `<h3>Note</h3>${ctxHTML}<div class="fields">
      <label class="f">Type<select id="cKind"><option value="note" ${kind==='note'?'selected':''}>Note</option><option value="decision" ${kind==='decision'?'selected':''}>Decision (no vote)</option></select></label>
      <label class="f">Text<textarea id="cText" rows="3">${esc(it.text)}</textarea></label>${agSel}</div>`;
  } else if (kind === 'flag') {
    if (!existing) { // one tap, no dialog — label it later if you want
      it.text = ''; it.ctx = ctx; M.items.push(it); scheduleSave(); drawCaptures(); drawAgendaLive(); drawTranscript(); toast('Flagged at ' + fmtClock(it.t) + ' — Claude will look closely here'); return;
    }
    body = `<h3>Flag</h3><div class="fields"><label class="f">What to check<input type="text" id="cText" value="${esc(it.text)}" placeholder="Confirm the dollar amount"></label>${it.ctx?`<div class="ctx"><em>Said around then</em>${esc(it.ctx)}</div>`:''}${agSel}</div>`;
  }
  openModal(body + `<div class="foot">${existing ? '<button class="btn danger" id="cDel" style="margin-right:auto">Delete</button>' : ''}<button class="btn ghost" id="cCancel">Cancel</button><button class="btn primary" id="cSave">Save <span class="kbd" style="color:#dfe5ff;border-color:rgba(255,255,255,.4)">⌘↵</span></button></div>`);
  const first = $('#cText'); if (first) { first.focus(); if (kind==='motion' && !it.text) { first.value = 'Motion to '; } first.setSelectionRange(first.value.length, first.value.length); }
  if ($('#cUnan')) $('#cUnan').onclick = () => { $('#cYay').value = presentNames().length; $('#cNay').value = 0; $('#cAbs').value = 0; $('#cRes').value = 'Approved'; };
  $('#cCancel').onclick = closeModal;
  if ($('#cDel')) $('#cDel').onclick = () => { M.items = M.items.filter(x => x.id !== it.id); scheduleSave(); closeModal(); refreshAfterCapture(); };
  const save = () => {
    const v = id => $(id) ? $(id).value : undefined;
    it.text = (v('#cText') || '').trim();
    if (kind === 'motion' && it.text === 'Motion to') it.text = '';
    it.agendaId = v('#cAg') || it.agendaId;
    if (kind === 'motion') Object.assign(it, { mover: v('#cMover'), second: v('#cSecond'), yay: v('#cYay'), nay: v('#cNay'), abstain: v('#cAbs'), result: v('#cRes') });
    if (kind === 'action') Object.assign(it, { owner: (v('#cOwnerX')||'').trim() || v('#cOwner'), due: v('#cDue') });
    if (kind === 'date') it.when = v('#cWhen') || (v('#cWhenX')||'').trim();
    if (kind === 'note' || kind === 'decision') it.kind = v('#cKind');
    if (!it.text && kind !== 'flag') { toast('Add a few words first.'); return; }
    const i = M.items.findIndex(x => x.id === it.id);
    if (i >= 0) M.items[i] = it; else M.items.push(it);
    scheduleSave(); closeModal(); refreshAfterCapture();
  };
  $('#cSave').onclick = save;
  $('#modalRoot').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); } };
}
function refreshAfterCapture(){
  if (view === 'live') { drawCaptures(); drawAgendaLive(); drawTranscript(); }
  if (view === 'review') renderReview();
}
function openTopicModal(){
  openModal(`<h3>Add topic</h3><div class="fields"><label class="f">Topic<input type="text" id="tTitle" placeholder="e.g. Snack shack cash handling"></label><label class="f">Text for the agenda (optional)<textarea id="tDetail" rows="3" placeholder="Background the board should see for this topic"></textarea></label><label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="tNow" checked> Switch to it now</label></div><div class="foot"><button class="btn ghost" id="tCancel">Cancel</button><button class="btn primary" id="tSave">Add</button></div>`);
  $('#tTitle').focus();
  $('#tCancel').onclick = closeModal;
  const go2 = () => {
    const t = $('#tTitle').value.trim(); if (!t) return;
    const a = { id: uid(), title: t, startT: null, notes: '' }; const d = ($('#tDetail').value || '').trim(); if (d) a.detail = d;
    const i = agendaIndex(M.currentAgendaId);
    M.agenda.splice(i + 1, 0, a);
    const now = $('#tNow').checked; closeModal();
    if (now) setAgenda(a.id); else { scheduleSave(); drawAgendaLive(); }
  };

}

function endMeetingPrompt(){
  openModal(`<h3>End the meeting?</h3><p style="color:var(--text-2);margin:6px 0 14px">Recording stops and the audio file is finished. You can still edit everything on the next screen.</p>
    <div class="two"><label class="f">Called to order<input type="time" id="eStart" value="${esc(M.calledToOrder)}"></label><label class="f">Adjourned<input type="time" id="eEnd" value="${new Date().toTimeString().slice(0,5)}"></label></div>
    <div class="foot"><button class="btn ghost" id="eCancel">Keep recording</button><button class="btn danger" id="eGo">End meeting</button></div>`);
  $('#eCancel').onclick = closeModal;
  $('#eGo').onclick = async () => {
    M.calledToOrder = $('#eStart').value; M.adjourned = $('#eEnd').value;
    commitNoteDraft(false);
    $('#eGo').disabled = true; $('#eGo').textContent = 'Finishing audio…';
    bankClock();
    await Engine.stop();
    M.status = 'ended'; M.endedAt = new Date().toISOString();
    await saveNow(); closeModal(); go('review');
    toast('Meeting ended — everything is saved.');
  };
}

/* keyboard shortcuts during the meeting */
document.addEventListener('keydown', e => {
  if (view !== 'live') return;
  if ($('#modalRoot').firstChild) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = { m:'motion', a:'action', d:'date', n:'note', f:'flag' };
  if (map[k]) { e.preventDefault(); openCapture(map[k]); }
  else if (k === ']') { e.preventDefault(); nextAgenda(); }
  else if (k === '[') { e.preventDefault(); const i = agendaIndex(M.currentAgendaId); if (i > 0) setAgenda(M.agenda[i-1].id); }
});

/* ---------- modal plumbing ---------- */
function openModal(html){
  $('#modalRoot').innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#modalRoot .modal-back').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-back')) closeModal(); });
}
function closeModal(){ $('#modalRoot').innerHTML = ''; $('#modalRoot').onkeydown = null; }
function confirmModal(title, msg, okLabel, onOk){
  openModal(`<h3>${esc(title)}</h3><p style="color:var(--text-2)">${msg}</p><div class="foot"><button class="btn ghost" id="qNo">Cancel</button><button class="btn danger" id="qYes">${esc(okLabel)}</button></div>`);
  $('#qNo').onclick = closeModal; $('#qYes').onclick = async () => { closeModal(); await onOk(); };
}

  else if (stage === 'approved') renderApproved();
  else renderEditor();
}

  app.querySelectorAll('[data-notes]').forEach(t => t.oninput = e => { agendaById(t.dataset.notes).notes = e.target.value; scheduleSave(); });

function fileBase(){ return `lybs-${slug(M.type)}-${M.date}`; }
async function downloadAudio(){
  const rows = (await DB.audioFor(M.id)).sort((a,b) => a.seq - b.seq);
  if (!rows.length) { toast('No audio was recorded for this meeting.'); return; }
  const mime = (M.audio.mime || rows[0].blob.type || 'audio/webm').split(';')[0];
  const ext = mime.includes('mp4') ? (DL ? 'mp4' : 'm4a') : mime.includes('ogg') ? 'ogg' : 'webm';
  const parts = [...new Set(rows.map(r => r.part || 1))].sort((a,b) => a-b);
  const files = parts.map((p, i) => {
    const blob = new Blob(rows.filter(r => (r.part || 1) === p).map(r => r.blob), { type: mime });
    return { name: `${fileBase()}-audio${parts.length > 1 ? '-part' + (i+1) : ''}.${ext}`, blob };
  });
  const mb = b => (b.size / 1048576).toFixed(1) + ' MB';
  if (files.length === 1) {   // straight from the click
    toast('Saving the audio (' + mb(files[0].blob) + ')…', 3500);
    await download(files[0].name, files[0].blob);
    return;
  }
  // Several parts (the recording restarted): one button each, so every save is its own click.
  openModal(`<h3>Download the audio</h3><p style="color:var(--text-2);margin:6px 0 12px">The recording restarted ${files.length - 1}× during the meeting, so it is saved in ${files.length} parts. Save each one, in order.</p>
    <div class="fields">${files.map((f, i) => `<div class="row" style="justify-content:space-between;gap:10px"><span>Part ${i+1} · ${mb(f.blob)}</span><button class="btn sm" data-part="${i}">Save part ${i+1}</button></div>`).join('')}</div>
    <div class="foot"><button class="btn primary" id="apDone">Done</button></div>`);
  $('#apDone').onclick = closeModal;
  $('#modalRoot').querySelectorAll('[data-part]').forEach(b => b.onclick = async () => {
    const f = files[+b.dataset.part]; b.disabled = true; b.textContent = 'Saving…';
    const ok = await download(f.name, f.blob);
    b.disabled = false; b.textContent = ok ? 'Saved ✓' : 'Try again';
  });
}

/* =====================================================================
   PHONE TRANSCRIPT IMPORT
   Runs entirely in this browser: paste or open the transcript your phone
   made (Samsung Voice Recorder's "Speaker 1 (00:13)" text, or lines like
   "[00:12:34] text"), and each passage is filed under an agenda topic by
   (1) which topic you had open in this app at that moment, and
   (2) words that point to a topic, so talk that jumped around still lands
   in the right place. Anything it can't place waits for you under
   "Needs a topic". Nothing leaves the laptop.
   ===================================================================== */
const PT_STOP = new Set(('the and for that this with have from they will what about there their them then than just like know yeah okay going gonna want were was are you your our out not but all any can get got one two three also some more would could should because which when where who how did does doing been being into over only very much really think thing things right well good make made said says say see now here back still even maybe lot let lets need year years last next time first other people guys kind sort way whatever stuff actually probably mean talk talked talking come came goes went take took give put sure yes yep update discussion meeting board item items new old'.split(' ')));
function ptSecs(ts){ const p = ts.split(':').map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1]; }
function ptWords(s){
  return String(s || '').toLowerCase().replace(/[’']/g, '').split(/[^a-z0-9$]+/)
    .map(w => w.length > 4 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w)
    .filter(w => w.length >= 3 && !PT_STOP.has(w));
}
function parseTranscript(raw){
  const lines = String(raw || '').replace(/\r\n?/g, '\n').split('\n');
  const HEAD = /^\s*(.{0,40}?)\s*\(\s*((?:\d{1,2}:)?\d{1,2}:\d{2})\s*\)\s*:?\s*$/;          // Speaker 1  (00:13)
  const INLINE = /^\s*\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s*[-–]?\s*(?:((?:Speaker\s*\d+)|[A-Z][\w.'-]*(?: [A-Z][\w.'-]*)?):\s+)?(.+)$/;  // [00:12:34] Matt: text
  const out = []; let cur = null;
  const close = () => { if (cur && cur.text.trim()) out.push({ ...cur, text: cur.text.replace(/\s+/g, ' ').trim() }); cur = null; };
  for (const ln of lines) {
    let m;
    if (!ln.trim()) { close(); continue; }
    if ((m = ln.match(HEAD))) { close(); cur = { speaker: m[1].trim(), off: ptSecs(m[2]), text: '' }; continue; }
    if ((m = ln.match(INLINE))) { close(); cur = { speaker: (m[2] || '').trim(), off: ptSecs(m[1]), text: m[3] }; continue; }
    if (!cur) cur = { speaker: '', off: null, text: '' };
    cur.text += ' ' + ln;
  }
  close();
  const speakers = [...new Set(out.map(p => p.speaker).filter(Boolean))].sort((a, b) => (parseInt(a.replace(/\D/g, '')) || 99) - (parseInt(b.replace(/\D/g, '')) || 99) || a.localeCompare(b));
  return { passages: out, speakers, timed: out.some(p => p.off != null), length: Math.max(0, ...out.map(p => p.off || 0)) };
}
function ptVocab(){   // words that point to each topic: its title, agenda text, your notes and captures
  const per = M.agenda.map(a => {
    const caps = M.items.filter(i => i.agendaId === a.id && i.text).map(i => i.text).join(' ');
    const notes = noteLines(a).map(stripNoteTs).join(' ');
    const title = new Set(ptWords(a.title));
    return { id: a.id, title, words: new Set([...title, ...ptWords(a.detail), ...ptWords(notes), ...ptWords(caps)]) };
  });
  const df = {}; per.forEach(p => p.words.forEach(w => df[w] = (df[w] || 0) + 1));
  const N = per.length || 1;
  per.forEach(p => { p.idf = {}; p.words.forEach(w => p.idf[w] = Math.log(1 + N / df[w]) * (p.title.has(w) ? 1.5 : 1)); });
  return per;
}
function ptTimeline(){   // when each topic was open in this app: your topic taps, plus the laptop transcript's own topic marks
  const pts = [];
  (M.topicLog || []).forEach(e => pts.push({ ms: Date.parse(e.wall), id: e.agendaId }));
  if (!pts.length) M.segments.filter(s => s.src !== 'phone' && s.wall && s.agendaId).forEach(s => pts.push({ ms: Date.parse(s.wall), id: s.agendaId }));
  return pts.filter(p => !isNaN(p.ms) && agendaById(p.id)).sort((a, b) => a.ms - b.ms);
}
function ptTopicAt(ms, tl){
  let hit = null; for (const p of tl) { if (p.ms <= ms) hit = p; else break; }
  if (!hit) return null;
  const end = M.endedAt ? Date.parse(M.endedAt) : null;
  if (end && ms > end + 10 * 60000) return null;
  if (!M.topicLog?.length && ms - hit.ms > 15 * 60000) return null;   // laptop marks only: don't stretch one too far
  return hit.id;
}
function ptSort(segs){   // files each phone passage under a topic; your own choices (manual / left out) are kept
  // A best-path search over the whole recording: each passage leans toward the topic you had open at
  // that moment and toward topics its words point to, and changing topic costs a little, so one stray
  // word doesn't flip a passage but a real stretch of talk about another topic does.
  const vocab = ptVocab(), tl = ptTimeline(), K = vocab.length, NONE = K;   // state K = "needs a topic"
  const TAP = 1.6, SWITCH = 3.5, IDLE = 0.9;
  const ids = vocab.map(v => v.id), at = {}; ids.forEach((id, k) => at[id] = k);
  const em = segs.map(s => {
    const row = new Array(K + 1).fill(0);
    if (s.how === 'manual' && at[s.agendaId] != null) { row.fill(-1e6); row[at[s.agendaId]] = 0; return row; }
    if (s.how === 'out') { row.fill(-1e6); row[NONE] = 0; return row; }
    const ws = new Set(ptWords(s.text)), ms = Date.parse(s.wall), timeId = isNaN(ms) ? null : ptTopicAt(ms, tl);
    vocab.forEach((v, k) => { let sc = 0, hits = 0; ws.forEach(w => { if (v.idf[w]) { sc += v.idf[w]; hits++; } }); row[k] = Math.min(hits >= 2 ? sc : sc * 0.5, 8); });
    if (timeId != null && at[timeId] != null) row[at[timeId]] += TAP;
    row[NONE] = IDLE;
    s._time = timeId;
    return row;
  });
  const n = segs.length; if (!n) return segs;
  let score = em[0].slice(); const back = [];
  for (let i = 1; i < n; i++) {
    let bestK = 0; for (let k = 1; k <= K; k++) if (score[k] > score[bestK]) bestK = k;
    const nx = new Array(K + 1), bk = new Array(K + 1);
    for (let k = 0; k <= K; k++) {
      const stay = score[k], move = score[bestK] - SWITCH;
      if (stay >= move) { nx[k] = stay + em[i][k]; bk[k] = k; } else { nx[k] = move + em[i][k]; bk[k] = bestK; }
    }
    back.push(bk); score = nx;
  }
  let k = 0; for (let j = 1; j <= K; j++) if (score[j] > score[k]) k = j;
  const path = new Array(n); path[n - 1] = k;
  for (let i = n - 1; i > 0; i--) { k = back[i - 1][k]; path[i - 1] = k; }
  segs.forEach((s, i) => {
    if (s.how === 'manual' || s.how === 'out') { delete s._time; return; }
    const st = path[i];
    if (st === NONE) { s.agendaId = null; s.how = 'unsorted'; }
    else { s.agendaId = ids[st]; s.how = s._time === s.agendaId ? 'time' : (em[i][st] >= 1.5 ? 'words' : 'follows'); }
    delete s._time;
  });
  return segs;
}
function hhmmss(iso){ if (!iso) return ''; const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function phoneSegs(){ return M.segments.filter(s => s.src === 'phone'); }

function openTranscriptImport(){
  let parsed = null;
  const startDefault = hhmmss(M.startedAt) || (M.calledToOrder ? M.calledToOrder + ':00' : '19:00:00');
  openModal(`<h3>Import phone transcript</h3>
    <p style="color:var(--text-2);margin:6px 0 12px;font-size:14px">In Samsung Voice Recorder, open the recording, tap <b>Transcript</b>, then share or copy it as text. Paste it here or open the saved file. Everything stays on this laptop.</p>
    <label class="f">Transcript<textarea id="ptText" rows="7" placeholder="Speaker 1  (00:01)&#10;Monday after that, Sunday…"></textarea></label>
    <div class="row" style="margin:8px 0 12px;gap:8px;align-items:center"><label class="btn sm ghost" style="margin:0">Open a .txt file<input type="file" id="ptFile" accept=".txt,.text,.md,text/plain" style="display:none"></label><span id="ptFileName" style="font-size:12px;color:var(--text-3)"></span></div>
    <label class="f">Phone started recording at<input type="time" id="ptStart" step="1" value="${esc(startDefault)}"></label>
    <p style="font-size:12px;color:var(--text-3);margin:4px 0 12px">The clock time you pressed record on the phone. If you started it when you started the meeting here, leave it as is.</p>
    <div id="ptPreview"></div>
    <div class="foot"><button class="btn ghost" id="ptCancel">Cancel</button><button class="btn" id="ptRead">Read transcript</button><button class="btn primary hidden" id="ptAdd">Add to this meeting</button></div>`);
  $('#modalRoot .modal').classList.add('wide');
  $('#ptCancel').onclick = closeModal;
  $('#ptFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; $('#ptText').value = await f.text(); $('#ptFileName').textContent = f.name; read(); };
  $('#ptText').oninput = () => { parsed = null; $('#ptAdd').classList.add('hidden'); $('#ptPreview').innerHTML = ''; };
  const read = () => {
    parsed = parseTranscript($('#ptText').value);
    if (!parsed.passages.length) { $('#ptPreview').innerHTML = '<p class="banner">That doesn’t look like a transcript yet. Paste the text from the phone.</p>'; return; }
    const people = M.roster.map(p => p.name);
    $('#ptPreview').innerHTML = `<div class="card" style="background:var(--navy);padding:12px 14px;margin-bottom:6px">
      <p style="margin:0 0 8px"><b>${parsed.passages.length}</b> passages${parsed.timed ? ', ' + fmtClock(parsed.length) + ' long' : ' (no timestamps, so topics come from the words only)'}${parsed.speakers.length ? ', ' + parsed.speakers.length + ' speakers' : ''}.</p>
      ${parsed.speakers.length ? `<p style="font-size:13px;color:var(--text-2);margin:0 0 8px">Name the speakers you recognise (optional). The phone numbers them in the order they first spoke.</p>
      <div class="ptspk">${parsed.speakers.map((sp, i) => {
        const first = parsed.passages.find(p => p.speaker === sp);
        return `<label class="f">${esc(sp)}<select data-spk="${i}"><option value="">Keep “${esc(sp)}”</option>${people.map(n => `<option>${esc(n)}</option>`).join('')}</select><span class="ptq">“${esc(first.text.slice(0, 70))}${first.text.length > 70 ? '…' : ''}”</span></label>`; }).join('')}</div>` : ''}
    </div>`;

    const [h, mi, se] = ($('#ptStart').value || startDefault).split(':').map(Number);
    const [y, mo, d] = (M.date || todayISO()).split('-').map(Number);
    const start = new Date(y, mo - 1, d, h || 0, mi || 0, se || 0).getTime();
    const imp = { id: uid(), at: new Date().toISOString(), start: new Date(start).toISOString(), count: parsed.passages.length };
    let lastOff = 0;
    const segs = parsed.passages.map(p => {
      const off = p.off != null ? p.off : lastOff; lastOff = off;

      return { t: off, wall: new Date(start + off * 1000).toISOString(), text: (who ? who + ': ' : '') + p.text, speaker: who, agendaId: null, src: 'phone', imp: imp.id, how: '' };

    ptSort(segs);

    await saveNow();
