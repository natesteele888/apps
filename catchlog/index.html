  .angler-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel2);cursor:pointer;text-align:left;margin-bottom:8px;font-family:inherit;color:var(--text);}

  .angler-av{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
  .angler-av img{width:100%;height:100%;object-fit:cover;}
  .angler-name{font-weight:700;color:var(--text);}

<body>
<div id="root"><div class="loading-screen">🎣</div></div>

<script>
/* =========================================================
   CLOUD: Google sign-in + Firestore (nates-toolbox).
   The web config is a public identifier, not a secret; the
   database rules guard the data. A crew is one document whose
   id is a long random code that only people with the crew
   link know. Photos are separate small documents under it.
========================================================= */
const FB_CONFIG = { apiKey: "AIzaSyDT_wGN93U4oM70orIU8flSAnvXHApqW2A", authDomain: "nates-toolbox.firebaseapp.com", projectId: "nates-toolbox", storageBucket: "nates-toolbox.firebasestorage.app", messagingSenderId: "567737923830", appId: "1:567737923830:web:b597b5d71e7c7a73c4d4d7" };
function fbLoad(){
  if (window.firebase && window.firebase.auth && window.firebase.firestore) return Promise.resolve();
  return ['app','auth','firestore'].reduce((p,n)=>p.then(()=>new Promise((res,rej)=>{ const el=document.createElement('script'); el.src='https://www.gstatic.com/firebasejs/11.6.0/firebase-'+n+'-compat.js'; el.onload=res; el.onerror=()=>rej(new Error('offline')); document.head.appendChild(el); })), Promise.resolve());
}
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const Cloud = { db:null, user:null, crew:null, unsub:null };
const crewRef = () => Cloud.db.collection('cl_crews').doc(Cloud.crew);
const photoRef = (pid) => crewRef().collection('photos').doc(pid);

function newCode(){
  const a = new Uint8Array(18); crypto.getRandomValues(a);
  return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('') + Date.now().toString(36).slice(-4);
}
function crewFromHash(){
  const m = (location.hash || '').match(/crew=([a-z0-9]{20,})/i);
  return m ? m[1] : null;
}
function crewLink(){ return location.origin + location.pathname + '#crew=' + Cloud.crew; }

function toast(msg, ms=3200){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

async function initAuth(){
  try{ await fbLoad(); }
  catch(e){ phase='offline'; render(); return; }
  const fb = window.firebase; if(!fb.apps.length) fb.initializeApp(FB_CONFIG);
  fb.auth().getRedirectResult().catch(e => { if(e && e.code) toast('Sign-in didn’t finish. Try again.'); });
  fb.auth().onAuthStateChanged(u => {
    Cloud.user = u;
    if(!u){ stopCloud(); phase='signin'; render(); return; }
    Cloud.db = fb.firestore();
    const fromLink = crewFromHash();
    if(fromLink){ LS.set('cl_crew', fromLink); history.replaceState(null,'',location.pathname); }
    const code = LS.get('cl_crew');
    if(code) startCloud(code); else { phase='crew'; render(); }
  });
}
async function signIn(){
  try{ await fbLoad(); }catch(e){ toast('Can’t reach Google right now.'); return; }
  const fb = window.firebase; if(!fb.apps.length) fb.initializeApp(FB_CONFIG);
  const p = new fb.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
  try{ await fb.auth().signInWithPopup(p); }
  catch(e){ if(e && /popup/.test(e.code||'')) fb.auth().signInWithRedirect(p); else toast('Sign-in didn’t finish. Try again.'); }
}
async function signOut(){ stopCloud(); try{ await window.firebase.auth().signOut(); }catch(e){} }
function stopCloud(){ if(Cloud.unsub){ Cloud.unsub(); Cloud.unsub=null; } }

function startCloud(code){
  stopCloud();
  Cloud.crew = code;
  phase = 'loading'; render();
  state.me = LS.get('cl_me_'+code);
  Cloud.unsub = crewRef().onSnapshot(snap => {
    let d = {};
    if(snap.exists){ try{ d = JSON.parse(snap.data().data || '{}'); }catch(e){ d = {}; } }
    applyData(d);
    if(phase !== 'ready'){
      phase = 'ready';
      if(state.profiles.length === 0) creatingProfile = true;
      if(state.me && !state.profiles.some(p=>p.id===state.me)) state.me = null;
      loadDraft();
      render();
    } else safeRender();
  }, err => {
    if(window.nateHealth) try{ window.nateHealth.note('sync', (err && err.code) || 'error'); }catch(x){}
    if(err && err.code === 'permission-denied'){ phase='denied'; render(); }
    else { toast('Can’t reach your crew right now.'); }
  });
}
async function startNewCrew(){
  const code = newCode();
  Cloud.crew = code;
  try{
    await crewRef().set({ data: JSON.stringify(blankData()), updated: Date.now() });
    LS.set('cl_crew', code);
    startCloud(code);
  }catch(e){ toast('Couldn’t start a crew. Check your connection and try again.'); }
}
function joinFromPaste(){
  const v = (document.getElementById('crewPaste')?.value || '').trim();
  const m = v.match(/crew=([a-z0-9]{20,})/i) || v.match(/^([a-z0-9]{20,})$/i);
  if(!m){ toast('That doesn’t look like a crew link.'); return; }
  LS.set('cl_crew', m[1]); startCloud(m[1]);
}
function leaveCrew(){
  if(!confirm('Leave this crew on this phone? Nothing is deleted. You can rejoin with the crew link.')) return;
  stopCloud(); LS.del('cl_crew'); Cloud.crew=null; state = freshState(); phase='crew'; render();
}
async function shareCrew(){
  const url = crewLink();
  try{
    if(navigator.share){ await navigator.share({ title:'Catch Log', text:'Join our fishing crew on Catch Log', url }); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); toast('Crew link copied. Only send it to people in your crew.'); }
  catch(e){ prompt('Copy your crew link:', url); }
}

/* ---------- Data: one JSON document, changed only inside a transaction ---------- */
function blankData(){ return { profiles:[], gear:{}, sessions:[], spots:[] }; }
function norm(d){
  d.profiles = Array.isArray(d.profiles)?d.profiles:[]; d.sessions = Array.isArray(d.sessions)?d.sessions:[];
  d.spots = Array.isArray(d.spots)?d.spots:[]; d.gear = (d.gear && typeof d.gear==='object')?d.gear:{};
  return d;
}
function applyData(d){
  norm(d);
  state.profiles = d.profiles; state.gearMap = d.gear; state.sessions = d.sessions; state.spots = d.spots;
}
async function mutate(fn){
  try{
    await Cloud.db.runTransaction(async t => {
      const snap = await t.get(crewRef());
      let d = {};
      if(snap.exists){ try{ d = JSON.parse(snap.data().data || '{}'); }catch(e){ d = {}; } }
      norm(d); fn(d);
      const s = JSON.stringify(d);
      if(s.length > 880000) throw new Error('full');
      t.set(crewRef(), { data:s, updated: Date.now() });
    });
    return true;
  }catch(e){
    console.error('save failed', e);
    if(window.nateHealth) try{ window.nateHealth.note('save', (e && e.code) || (e && e.message) || 'error'); }catch(x){}
    toast(e && e.message==='full' ? 'Your crew’s log is full. Ask Nate to make room.' : 'Didn’t save. Check your connection and try again.');
    return false;
  }
}

/* =========================================================
   IMAGE COMPRESSION
========================================================= */
function compressImage(file, maxDim=480, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if(width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
        else if(height > maxDim){ width *= maxDim/height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  if(window.L) return Promise.resolve();

}

    html:`<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid #101913;box-shadow:0 2px 4px rgba(0,0,0,.5)"></div>` });
}
function baseMap(el, center, zoom){
  const m = L.map(el, { zoomControl:true, attributionControl:true }).setView(center, zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap' }).addTo(m);
  maps.push(m); return m;
}

function initGearDraft(){
  const g = state.gearMap[state.me];
  gearDraft = g ? {rodBrand:g.rodBrand||'', reelBrand:g.reelBrand||'', baits:[...(g.baits||[])], colors:[...(g.colors||[])], liveBait:[...(g.liveBait||[])], combos:[...(g.combos||[])]}
                : {rodBrand:'', reelBrand:'', baits:[], colors:[], liveBait:[], combos:[]};
}
function persistCurrentGear(){
  const me = state.me, g = JSON.parse(JSON.stringify(gearDraft));
  state.gearMap[me] = g;
  mutate(d => { d.gear[me] = g; });
}
function pickSingle(field, val){ gearDraft[field] = gearDraft[field] === val ? '' : val; persistCurrentGear(); render(); }
function toggleMulti(field, val){
  const arr = gearDraft[field]; const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  persistCurrentGear(); render();
}
function addCustom(field, inputId){
  const input = document.getElementById(inputId);
  const val = input.value.trim(); if(!val) return;
  if(field==='rodBrand' || field==='reelBrand'){ gearDraft[field] = val; }
  else if(!gearDraft[field].includes(val)) gearDraft[field].push(val);
  input.value=''; input.blur();
  persistCurrentGear(); render();
}
function addCombo(){
  const name = (document.getElementById('comboName')?.value || '').trim();
  if(!gearDraft.rodBrand || !gearDraft.reelBrand){ toast('Pick a rod and a reel first.'); return; }
  const label = name || `${gearDraft.rodBrand} + ${gearDraft.reelBrand}`;
  if(gearDraft.combos.some(c=>c.name===label)){ toast('You already have a combo with that name.'); return; }
  gearDraft.combos.push({ id:`cb_${Date.now()}`, name:label, rod:gearDraft.rodBrand, reel:gearDraft.reelBrand });
  newComboName = ''; document.activeElement?.blur();
  persistCurrentGear(); render();
}
function removeCombo(id){
  if(!confirm('Remove this combo?')) return;
  gearDraft.combos = gearDraft.combos.filter(c=>c.id!==id);
  persistCurrentGear(); render();
}

========================================================= */
function flattenCatches(filterFn){
  const byId = Object.fromEntries(state.profiles.map(p=>[p.id,p]));
  const out = [];
  state.sessions.forEach(s => {
    (s.catches||[]).forEach(c => {
      if(filterFn && !filterFn(s,c)) return;
      out.push({ catch:c, session:s, angler: byId[s.profileId] });
    });
  });
  return out.sort((a,b) => {
    const aw=a.catch.weight, bw=b.catch.weight;
    if(aw!=null && bw!=null) return bw-aw;
    if(aw!=null) return -1;
    if(bw!=null) return 1;
    return (b.catch.length||0)-(a.catch.length||0);
  });
}
function rankRowHTML(entry, rank){
  const {catch:c, session, angler} = entry;
  const badgeClass = rank===0?'gold':rank===1?'silver':rank===2?'bronze':'';
  const badgeContent = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`${rank+1}`;
  const mine = session.profileId === state.me;
  const tag = mine ? 'button' : 'div';
  return `
    <${tag} class="rank-row" ${mine?`onclick="openEdit('${session.id}','${c.id}')"`:''}>
      <div class="rank-badge ${badgeClass}">${badgeContent}</div>
      <div class="rank-thumb">${imgOr(c.photo,'🐟')}</div>
      <div class="rank-mid">
        <p class="rank-species" style="margin:0;">${esc(c.species)||'Unknown fish'}</p>
        <p class="rank-sub" style="margin:0;">${angler?`${esc(angler.firstName)} ${esc(angler.lastInitial)}.`:'Unknown'} · ${esc(session.spotName)}</p>
      </div>
      <div class="rank-wt">${c.weight!=null?c.weight+' lb':c.length!=null?c.length+' in':''}</div>
    </${tag}>`;
}
function gmEmpty(text, sub){
  return `<div class="empty"><div class="big">🌊</div><p>${text}</p>${sub?`<span>${sub}</span>`:''}</div>`;
}
function simpleScreen(icon, title, bodyHtml, footerHtml, closeFn){
  return `
    <div class="screen">
      <div class="screen-header">
        <span class="s-icon">${icon}</span><span class="s-title">${title}</span>
        <button class="screen-close" onclick="${closeFn||'goHome()'}">✕</button>
      </div>
      <div class="screen-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="screen-footer">${footerHtml}</div>` : ''}
    </div>
  `;
}
function renderTrophies(){
  const meFilter = (s) => !myRecordsOnly || s.profileId === state.me;
  let content = '';
  if(lbView==='daily'){
    const daily = flattenCatches((s,c)=> localDay(c.time||s.loggedAt)===todayStr() && meFilter(s));
    content = daily.length===0?gmEmpty("No catches today yet","Get out there and log one!"):daily.slice(0,10).map((e,i)=>rankRowHTML(e,i)).join('');
  } else if(lbView==='lifetime'){
    const all = flattenCatches(meFilter);
    content = all.length===0?gmEmpty("No catches logged yet","Be the first!"):all.slice(0,10).map((e,i)=>rankRowHTML(e,i)).join('');
  } else {
    const spots = [...new Set(state.sessions.filter(meFilter).map(s=>s.spotName))].filter(Boolean);
    if(!spots.length) content = gmEmpty("No spots fished yet");
    else content = spots.map(spot => {
      const top = flattenCatches(s => s.spotName === spot && meFilter(s));
      if(!top.length) return '';
      return `<div style="margin-bottom:14px;"><div class="section-title">📍 ${esc(spot)}</div>${top.slice(0,3).map((e,i)=>rankRowHTML(e,i)).join('')}</div>`;
    }).join('');
  }
  const body = `
    <div class="chip-wrap" style="margin-bottom:14px;">
      <button class="chip ${lbView==='daily'?'active':''}" onclick="lbView='daily';render()">Today</button>
      <button class="chip ${lbView==='lifetime'?'active':''}" onclick="lbView='lifetime';render()">All-Time</button>
      <button class="chip ${lbView==='spots'?'active':''}" onclick="lbView='spots';render()">By Spot</button>
    </div>
    ${content}
  `;
  return simpleScreen('🏆','TROPHIES', body,
    `<button class="btn ${myRecordsOnly?'btn-primary':'btn-secondary'}" onclick="myRecordsOnly=!myRecordsOnly;render()">👤 ${myRecordsOnly?'SHOWING MINE':'MY RECORDS ONLY'}</button>`);
}

function openEdit(sid, cid){
  const s = state.sessions.find(x=>x.id===sid); const c = s && (s.catches||[]).find(x=>x.id===cid);
  if(!c || s.profileId!==state.me) return;
  editRef = { sid, cid, species:c.species||'', weight:c.weight!=null?String(c.weight):'', length:c.length!=null?String(c.length):'' };

}
function renderEditCatch(){
  if(!editRef){ state.tab='history'; return renderHistory(); }
  const body = `
    <div class="card">
      <label class="small">SPECIES</label>
      <input class="input" id="edSpecies" value="${esc(editRef.species)}" oninput="editRef.species=this.value" style="margin-bottom:10px;font-weight:800;">

        <div style="flex:1;"><label class="small">WEIGHT (LB)</label><input class="input" id="edWeight" inputmode="decimal" value="${esc(editRef.weight)}" oninput="editRef.weight=this.value.replace(/[^0-9.]/g,'');this.value=editRef.weight"></div>
        <div style="flex:1;"><label class="small">LENGTH (IN)</label><input class="input" id="edLength" inputmode="decimal" value="${esc(editRef.length)}" oninput="editRef.length=this.value.replace(/[^0-9.]/g,'');this.value=editRef.length"></div>

  `;
  return simpleScreen('✏️','EDIT CATCH', body,
    `<button class="btn btn-secondary" style="flex:1;" onclick="editRef=null;setTab('history')">Cancel</button><button class="btn btn-primary" style="flex:1;" onclick="saveEdit()">✅ Save</button>`,
    "editRef=null;setTab('history')");
}
async function saveEdit(){
  const r = editRef; if(!r || !r.species.trim()){ toast('Species can’t be blank.'); return; }
  const me = state.me;
  const ok = await mutate(d => {
    const s = d.sessions.find(x=>x.id===r.sid); if(!s || s.profileId!==me) return;
    const c = (s.catches||[]).find(x=>x.id===r.cid); if(!c) return;
    c.species = r.species.trim(); c.weight = r.weight?Number(r.weight):null; c.length = r.length?Number(r.length):null;
  });
  if(ok){ editRef = null; toast('Catch updated'); setTab('history'); }
}
async function deleteCatch(){
  const r = editRef; if(!r) return;
  if(!confirm('Remove this catch for good?')) return;
  const me = state.me; let photo = null;
  const ok = await mutate(d => {
    const s = d.sessions.find(x=>x.id===r.sid); if(!s || s.profileId!==me) return;
    const c = (s.catches||[]).find(x=>x.id===r.cid); photo = c ? c.photo : null;
    s.catches = (s.catches||[]).filter(x=>x.id!==r.cid);
    if(!s.catches.length) d.sessions = d.sessions.filter(x=>x.id!==r.sid);
  });
  if(ok){ deletePhoto(photo); editRef = null; toast('Catch removed'); setTab('history'); }
}

function getAllLocations(){
  const map = {};
  state.spots.forEach(sp => { map[sp.name] = {...sp}; });
  state.sessions.forEach(s => {
    if(!s.spotName) return;
    if(!map[s.spotName]) map[s.spotName] = { id:'auto_'+s.spotName, name:s.spotName, type:'freshwater', lat:s.lat, lng:s.lng, auto:true };
  });
  return Object.values(map);
}
function spotCardHTML(loc){

  const bestText = best ? `${best.catch.weight!=null?best.catch.weight+' lb':best.catch.length!=null?best.catch.length+' in':'Logged'}, ${esc(best.catch.species||'fish')}` : 'No catches yet';
  const coordsText = loc.lat!=null ? `${Number(loc.lat).toFixed(3)}°, ${Number(loc.lng).toFixed(3)}°` : 'No GPS pin';
  return `
    <button class="spot-card" onclick="viewSpotBoard('${jsq(loc.name)}')">
      <div class="spot-thumb">${loc.type==='saltwater'?'🌊':'🏞️'}</div>
      <div style="flex:1;">

    </button>
  `;
}
function viewSpotBoard(){ lbView='spots'; myRecordsOnly=false; state.tab='trophies'; render(); window.scrollTo(0,0); }
function toggleAddLocation(){

function useLocationPin(){
  const btn = document.getElementById('locAddBtn');
  if(!navigator.geolocation){ if(btn) btn.innerHTML = "GPS not available"; return; }
  if(btn) btn.innerHTML = '📍 Locating...';
  navigator.geolocation.getCurrentPosition(
    (pos) => { newLocDraft.lat = pos.coords.latitude; newLocDraft.lng = pos.coords.longitude; render(); },
    () => { if(btn) btn.innerHTML = "Couldn't get GPS"; },
    {enableHighAccuracy:true, timeout:8000}
  );
}
async function saveNewLocation(){
  const input = document.getElementById('locNameInput');
  const name = (input ? input.value : newLocDraft.name).trim();
  if(!name) return;
  if(getAllLocations().some(l=>l.name.toLowerCase()===name.toLowerCase())){ toast('You already have a spot with that name.'); return; }

  const ok = await mutate(d => { d.spots.push(spot); });
  if(!ok) return;
  addingLocation = false; locTab = newLocDraft.type;

      <div class="chip-wrap" style="margin-bottom:8px;">
        <button type="button" class="chip ${newLocDraft.type==='freshwater'?'active':''}" onclick="newLocDraft.type='freshwater';render()">🏞️ Freshwater</button>
        <button type="button" class="chip ${newLocDraft.type==='saltwater'?'active':''}" onclick="newLocDraft.type='saltwater';render()">🌊 Saltwater</button>
      </div>
      <p class="map-hint">Tap the map to drop a pin, or use your location. Both are optional.</p>
      <div class="map small" id="locAddMap"></div>
      <button type="button" class="btn btn-secondary" id="locAddBtn" style="margin-bottom:8px;" onclick="useLocationPin()">${newLocDraft.lat!=null?'📍 Pin set ✓':'📍 Use My Location'}</button>
      <button type="button" class="btn btn-primary" onclick="saveNewLocation()">Save Spot</button>
    </div>
  ` : '';
  const pinnedCount = locs.filter(l=>l.lat!=null).length;
  const body = `
    <div class="chip-wrap" style="margin-bottom:14px;">
      <button class="chip ${locTab==='freshwater'?'active':''}" onclick="locTab='freshwater';addingLocation=false;render()">🏞️ Freshwater</button>
      <button class="chip ${locTab==='saltwater'?'active':''}" onclick="locTab='saltwater';addingLocation=false;render()">🌊 Saltwater</button>
    </div>
    ${addForm}
    ${(!addingLocation && pinnedCount) ? `<div class="map" id="spotsMap"></div>` : ''}
    ${(locs.length===0 && !addingLocation) ? gmEmpty("No spots here yet","Add one below to get started.") : locs.map(spotCardHTML).join('')}
  `;
  return simpleScreen('📍','SPOTS', body,
    `<button class="btn btn-primary" onclick="toggleAddLocation()">${addingLocation?'✕ CANCEL':'➕ ADD SPOT'}</button>`);
}

/* =========================================================
   CREW (anglers)
========================================================= */
function startCreate(){ creatingProfile = true; newProfileDraft = { avatar: AVATARS[0], photo:null, first:'', last:'', age:'', home:'' }; render(); }
function cancelCreate(){ creatingProfile = false; render(); }
function selectAvatar(a){ newProfileDraft.avatar = a; newProfileDraft.photo = null; render(); }
async function handleProfilePhoto(e){
  const f = e.target.files[0]; if(!f) return;
  try{ newProfileDraft.photo = await compressImage(f, 240, 0.7); render(); }catch(err){ console.error(err); }
}
async function submitProfile(){
  const firstName = (newProfileDraft.first||'').trim();
  const lastInitial = (newProfileDraft.last||'').trim().slice(0,1).toUpperCase();
  const age = (newProfileDraft.age||'').trim();
  const hometown = (newProfileDraft.home||'').trim();
  if(!firstName || !lastInitial){ toast('Add a first name and last initial.'); return; }
  const photo = newProfileDraft.photo ? await uploadPhoto(newProfileDraft.photo) : null;
  const profile = { id:`p_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, firstName, lastInitial, age: age?Number(age):null, hometown, avatar:newProfileDraft.avatar, photo };
  const ok = await mutate(d => { d.profiles.push(profile); });
  if(!ok) return;
  if(!state.profiles.some(p=>p.id===profile.id)) state.profiles.push(profile);
  creatingProfile = false;
  setMe(profile.id);
  setTab('home');
}
function selectAngler(id){ setMe(id); setTab('home'); }
function renderCreateProfileForm(){
  const d = newProfileDraft;
  return `
    <div class="card">
      <div class="section-title">NEW ANGLER</div>
      <div class="row" style="margin-bottom:9px;">
        <input class="input" id="npFirst" placeholder="First name" value="${esc(d.first)}" oninput="newProfileDraft.first=this.value" style="flex:1">
        <input class="input" id="npLast" placeholder="Last initial" maxlength="1" value="${esc(d.last)}" oninput="newProfileDraft.last=this.value" style="width:90px">
      </div>
      <div class="row" style="margin-bottom:9px;">
        <input class="input" id="npAge" placeholder="Age" inputmode="numeric" value="${esc(d.age)}" oninput="newProfileDraft.age=this.value" style="width:80px">
        <input class="input" id="npHome" placeholder="Hometown" value="${esc(d.home)}" oninput="newProfileDraft.home=this.value" style="flex:1">
      </div>
      <label class="small">PICTURE</label>
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0 10px;">
        <div class="avatar-circle">${d.photo ? `<img src="${d.photo}" alt="">` : d.avatar}</div>
        <button type="button" class="btn btn-secondary" style="flex:none;width:auto;padding:9px 14px;font-size:12.5px;" onclick="document.getElementById('npPhotoInput').click()">📷 Upload photo</button>
        <input type="file" id="npPhotoInput" accept="image/*" style="display:none" onchange="handleProfilePhoto(event)">
      </div>
      <div class="chip-wrap">
        ${AVATARS.map(a=>`<button type="button" class="avatar-pick ${d.avatar===a && !d.photo?'active':''}" onclick="selectAvatar('${a}')">${a}</button>`).join('')}
      </div>
      ${state.profiles.length>0 ? `<button type="button" style="width:100%;margin-top:12px;background:none;border:none;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;" onclick="cancelCreate()">Cancel</button>` : ''}
    </div>
  `;
}
function renderFriendsList(){
  if(state.profiles.length === 0) return gmEmpty("No anglers yet", "Add the first one below to get started.");
  return `<p class="map-hint">Tap your name to fish as you on this phone.</p>` + state.profiles.map(p => `
      <button class="angler-row ${state.me===p.id?'active':''}" onclick="selectAngler('${p.id}')">
        <div class="angler-av">${imgOr(p.photo, p.avatar)}</div>
        <div style="flex:1;">
          <div class="angler-name">${esc(p.firstName)} ${esc(p.lastInitial)}.</div>
          <div class="angler-sub">${esc(p.hometown)||'—'}${p.age?` · Age ${p.age}`:''} · ${catchCount(p.id)} catches</div>
        </div>
        ${state.me===p.id ? `<span class="angler-badge">YOU</span>` : ''}
      </button>`).join('');
}
function renderCrew(){
  if(!newProfileDraft.first && newProfileDraft.first!=='') newProfileDraft = { avatar: AVATARS[0], photo:null, first:'', last:'', age:'', home:'' };
  const body = creatingProfile ? renderCreateProfileForm() : renderFriendsList();
  const footer = creatingProfile
    ? `<button class="btn btn-primary" onclick="submitProfile()">✓ CREATE PROFILE</button>`
    : `<button class="btn btn-primary" onclick="startCreate()">➕ ADD ANGLER</button>`;
  return simpleScreen('👥','CREW', body, footer, state.me ? 'goHome()' : 'creatingProfile=false;render()');
}

/* =========================================================
   SETTINGS
========================================================= */
function switchAngler(){ setMe(null); setTab('crew'); }
function renderSettings(){
  const me = state.profiles.find(p => p.id === state.me);
  const who = Cloud.user ? (Cloud.user.displayName || 'your Google account') : '';
  const body = `
    ${me ? `
      <div class="card" style="display:flex;align-items:center;gap:12px;">
        <div class="avatar-circle">${imgOr(me.photo, me.avatar)}</div>
        <div>
          <div style="font-weight:700;font-size:15px;">${esc(me.firstName)} ${esc(me.lastInitial)}.</div>
          <div style="font-size:11.5px;color:var(--muted);">${esc(me.hometown)||'—'}${me.age?` · Age ${me.age}`:''} · Fishing as this angler on this phone</div>
        </div>
      </div>
    ` : gmEmpty("No angler selected", "Pick or add an angler to get started.")}

    <button class="settings-row" onclick="switchAngler()"><span class="sr-icon">🔄</span><span class="sr-label">Switch Angler</span><span class="sr-arrow">›</span></button>
    <button class="settings-row" onclick="setTab('crew')"><span class="sr-icon">👥</span><span class="sr-label">Manage Crew</span><span class="sr-arrow">›</span></button>
    <button class="settings-row" onclick="shareCrew()"><span class="sr-icon">🔗</span><span class="sr-label">Invite to your crew</span><span class="sr-arrow">›</span></button>
    <button class="settings-row" onclick="leaveCrew()"><span class="sr-icon">🚪</span><span class="sr-label">Leave this crew on this phone</span><span class="sr-arrow">›</span></button>
    <button class="settings-row" onclick="if(window.nateHealth) window.nateHealth.report()"><span class="sr-icon">🛠️</span><span class="sr-label">Something wrong with the app?</span><span class="sr-arrow">›</span></button>
    <button class="settings-row" onclick="signOut()"><span class="sr-icon">👋</span><span class="sr-label">Sign out${who?' ('+esc(who)+')':''}</span><span class="sr-arrow">›</span></button>

    <div class="settings-info">🔒 Your crew’s anglers, catches, photos and spots are private. Only people signed in with Google who have your crew link can see them. Only send the invite to people in your crew.</div>
    <div class="settings-credit">Catch Log · made for the crew 🎣</div>
  `;
  return simpleScreen('⚙️','SETTINGS', body, null);
}

/* =========================================================
   BOOT
========================================================= */
initAuth();
if('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
