<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/apps/icons/practiceclock-192.png">
<link rel="apple-touch-icon" href="/apps/icons/practiceclock-192.png">
<script src="https://natesteele888.github.io/apps/install.js" defer></script>
<!-- Optional fonts. Loaded without blocking the page; offline or blocked just means the system fonts are used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="practiceclock.css">
